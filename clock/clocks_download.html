            background-size: cover;
            background-color: rgb(6, 2, 29);
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
        }

        .view_item {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90px;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            box-sizing: border-box;
        }

        .view_item:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }

        .vi_left img {
            width: 70px;
            height: 70px;
            border-radius: 6px;
            object-fit: cover;
            background: rgba(0, 0, 0, 0.3);
        }

        .btn-delete {
            background: linear-gradient(135deg, #ff4d4d, #d63031);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 0;
            width: 100%;
            font-size: 9px;
            font-weight: bold;
            margin-top: 6px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-delete:hover {
            background: linear-gradient(135deg, #ff6b6b, #ee5253);
            filter: brightness(1.1);
        }

        .btn-delete:active {
            transform: scale(0.95);
        }

        .wrapper {
            width: 440px;
            max-width: 95vw;
            background: rgba(0, 0, 0, 0.3);
            padding: 25px;
            border-radius: 25px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }

        .view_wrap {
            display: grid;
            grid-template-columns: repeat(4, 90px);
            gap: 10px;
            justify-content: flex-start;
            margin-top: 10px;
        }

        h2 {
            text-align: center;
            font-weight: 300;
            font-size: 20px;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        hr {
            border: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(186, 104, 200, 0.4), transparent);
            margin: 15px 0;
        }

        .home-img {
            width: 160px;
            height: 36px;
            margin: 20px auto 0;
            display: block;
            background: rgba(255, 255, 255, 0.05);
            color: #FFF;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            text-transform: uppercase;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .home-img:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .conectt {
            display: block;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 15px;
            text-align: right;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.2);
            z-index: 99999;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(2px);
        }

        .overlay-content {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            color: white;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .loader {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #ff4d4d;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

                return;
            }
            var leftBtn = e.target.closest(".vi_left");
            if (leftBtn) {
                var fff = leftBtn.getAttribute("value");
                websocket.send("#VIE@" + fff);
            }
        });
        homeImgBtn = document.querySelector(".home-img");
        const homeImage = () => {
            window.open("/", "_self")
        }
            ;
        homeImgBtn.addEventListener("click", homeImage)
        window.addEventListener('load', onload);
        function onload(event) {
            initWebSocket()
        }
        function initWebSocket() {
            websocket = new WebSocket(`ws://${window.location.hostname}/ws`);
            websocket.onopen = onOpen;
            websocket.onclose = onClose;
            websocket.onmessage = onMessage;
            buttonconect.innerHTML = "Not connect!"
        }
        function onOpen(event) {
            buttonconect.innerHTML = "Connect!"
        }
        function onClose(event) {
            setTimeout(initWebSocket, 2000);
            buttonconect.innerHTML = "Not connect!"
        }
        function onMessage(event) {
            if (event.data == "SAVEOK") {
                window.open("/clock", "_self")
            }
        }
    </script>
</body>

</html>
