            color: white;
        }

        .container {
            width: 480px;
            max-width: 95vw;
            background: var(--glass);
            border-radius: 28px;
            padding: 24px;
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.2);
            box-sizing: border-box;
            margin: 20px;
        }

        h2 {
            text-align: center;
            font-weight: 700;
            font-size: 22px;
            letter-spacing: 2px;
            margin: 0 0 20px 0;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .section-glass {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--primary);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, rgba(79, 172, 254, 0.3), transparent);
        }

        .flex-row {
            display: flex;
            gap: 12px;
            margin-bottom: 8px;
            align-items: center;
        }

        .flex-column {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        label {
            font-size: 11px;
            opacity: 0.7;
            margin-bottom: 5px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        input[type="number"],
        select {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: white;
            padding: 8px 12px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
            width: 100%;
        }

        option {
            background: #111;
            color: white;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.1);
        }

        .btn {
            padding: 12px;
            border-radius: 12px;
            border: none;
            color: white;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            box-shadow: 0 8px 15px -5px rgba(0, 150, 255, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
        }

        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .btn:active { transform: translateY(0); }

        /* RSS Checkbox Grid */
        .rss-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
        }

        /* Modern Checkbox Style */
        .checkbox-container {
            position: relative;
            display: flex;
            align-items: center;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            cursor: pointer;
            transition: all 0.2s;
        }

        .checkbox-container:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .checkbox-container input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }

        .checkmark {
            height: 18px;
            width: 18px;
            background-color: rgba(0, 0, 0, 0.4);
            border-radius: 4px;
            border: 1px solid var(--glass-border);
            margin-right: 10px;
            position: relative;
            transition: all 0.2s;
        }

        .checkbox-container input:checked ~ .checkmark {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        .checkmark:after {
            content: "";
            position: absolute;
            display: none;
            left: 5px;
            top: 1px;
            width: 5px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .checkbox-container input:checked ~ .checkmark:after {
            display: block;
        }

        .checkbox-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-dim);
            transition: color 0.2s;
        }

        .checkbox-container input:checked ~ .checkbox-label {
            color: white;
            font-weight: 600;
        }

        hr {
            border: none;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            margin: 20px 0;
        }

        .status-tag {
            display: block;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 15px;
            text-align: center;
            font-family: monospace;
            letter-spacing: 1px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .container { animation: fadeIn 0.5s ease-out; }
    </style>
</head>

                <label class="checkbox-container">
                    <input type="checkbox" id="box-5">
                    <span class="checkmark"></span>
                    <span class="checkbox-label">Lifestyle</span>
                </label>
                <label class="checkbox-container">
                    <input type="checkbox" id="box-6">
                    <span class="checkmark"></span>
                    <span class="checkbox-label">Business</span>
                </label>
                <label class="checkbox-container">
                    <input type="checkbox" id="box-7">
                    <span class="checkmark"></span>
                    <span class="checkbox-label">Tech</span>
                </label>
                <label class="checkbox-container">
                    <input type="checkbox" id="box-8">
                    <span class="checkmark"></span>
                    <span class="checkbox-label">Entertainment</span>
                </label>
                <label class="checkbox-container">
                    <input type="checkbox" id="box-9">
                    <span class="checkmark"></span>
                    <span class="checkbox-label">Sports</span>
                </label>
                <label class="checkbox-container">
                    <input type="checkbox" id="box-10">
                    <span class="checkmark"></span>
                    <span class="checkbox-label">Legal</span>
                </label>
                <label class="checkbox-container">
                    <input type="checkbox" id="box-11">
                    <span class="checkmark"></span>
                    <span class="checkbox-label">Featured</span>
                </label>
                <label class="checkbox-container">
                    <input type="checkbox" id="box-12">
                    <span class="checkmark"></span>
                    <span class="checkbox-label">Education</span>
                </label>

        </div>

        <!-- Weather Section -->
        <div class="section-glass">
            <div class="section-title">Weather (Coordinates)</div>
            <div class="flex-column" style="gap: 10px;">
                <div class="flex-row">
                    <div class="flex-column">
                        <label>Latitude</label>
                        <input type="text" id="thoitiet0" value="" maxlength="64" placeholder="0.000">
                    </div>
                    <div class="flex-column">
                        <label>Longitude</label>
                        <input type="text" id="thoitiet1" value="" maxlength="64" placeholder="0.000">
                    </div>
                </div>
            </div>
        </div>

        <div class="flex-row" style="gap: 10px; margin-top: 10px;">
            <button class="btn btn-primary" id="save-all">Save Settings</button>
            <button class="btn btn-secondary home-img">Home</button>
        </div>
        <div class="status-tag" id="conet">Wait...</div>
    </div>

    <script>
        var websocket;
        var buttonconect = document.getElementById('conet');
        const saveBtn = document.getElementById('save-all');

        // Mapping helper to fill form
        function fillForm(dataStr) {
            const parts = dataStr.split(':');
            if (parts.length < 20) return; // Basic validation

            // Tokens (1, 2, 3) -> 4 fields each = 12 fields
            document.getElementById('token11').value = parts[1];
            document.getElementById('token12').value = parts[2];
            document.getElementById('token1l').value = parts[3];
            document.getElementById('token1h').value = parts[4];
            
            document.getElementById('token21').value = parts[5];
            document.getElementById('token22').value = parts[6];
            document.getElementById('token2l').value = parts[7];
            document.getElementById('token2h').value = parts[8];
            
            document.getElementById('token31').value = parts[9];
            document.getElementById('token32').value = parts[10];
            document.getElementById('token3l').value = parts[11];
            document.getElementById('token3h').value = parts[12];
            
            // Chart & Time
            document.getElementById('tchart').value = parts[13];
            document.getElementById('tchartime').value = parts[14];
            
            // Stocks
            document.getElementById('stock1').value = parts[15];
            document.getElementById('stock2').value = parts[16];
            document.getElementById('stock3').value = parts[17];
            
            // Weather
            document.getElementById('thoitiet0').value = parts[18];
            document.getElementById('thoitiet1').value = parts[19];
            
            // RSS (Index 20 to 31)
            for (let i = 0; i < 12; i++) {
                const box = document.getElementById('box-' + (i + 1));
                if (box) box.checked = (parts[20 + i] === '1');
            }
        }

        // Save logic
        saveBtn.addEventListener('click', () => {
            if (!websocket || websocket.readyState !== WebSocket.OPEN) return;
            
            let cmd = "#APP_SAVE$";
            const fields = [
                'token11', 'token12', 'token1l', 'token1h',
                'token21', 'token22', 'token2l', 'token2h',
                'token31', 'token32', 'token3l', 'token3h',
                'tchart', 'tchartime', 'stock1', 'stock2', 'stock3',
                'thoitiet0', 'thoitiet1'
            ];
            
            const vals = fields.map(id => document.getElementById(id).value);
            cmd += vals.join(':');
            
            // RSS check boxes
            for (let i = 1; i <= 12; i++) {
                const box = document.getElementById('box-' + i);
                cmd += ":" + (box.checked ? "1" : "0");
            }
            
            websocket.send(cmd);
            buttonconect.innerHTML = "Saving...";
        });

        // Home button
        document.querySelector(".home-img").addEventListener("click", () => {
            window.open("/", "_self");
        });

        // WebSocket core logic
        function initWebSocket() {
            websocket = new WebSocket(`ws://${window.location.hostname}/ws`);
            websocket.onopen = onOpen;
            websocket.onclose = onClose;
            websocket.onmessage = onMessage;
            buttonconect.innerHTML = "Connecting...";
        }

        function onOpen() {
            buttonconect.innerHTML = "Connected";
            buttonconect.style.color = "#4facfe";
            websocket.send("#APP_CONNECT$");
        }

        function onClose() {
            buttonconect.innerHTML = "Disconnected - Retrying...";
            buttonconect.style.color = "#ff4d4d";
            setTimeout(initWebSocket, 2000);
        }

        function onMessage(event) {
            if (event.data.startsWith("APP_DATA:")) {
                fillForm(event.data);
            } else if (event.data === "SAVEOK") {
                buttonconect.innerHTML = "Saved OK";
                buttonconect.style.color = "#4facfe";
                setTimeout(() => {
                    buttonconect.innerHTML = "Connected";
                }, 2000);
            }
        }

        window.addEventListener('load', initWebSocket);
    </script>
</body>
</html>
