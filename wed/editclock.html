<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=0.8, user-scalable=no">
    <title>MAGIC O'CLOCK - EDIT</title>
    <style>
        :root { --primary: #4facfe; --secondary: #00f2fe; --accent: #BA68C8; --bg-dark: rgb(6, 2, 29); --glass: rgba(15, 23, 42, 0.2); --glass-border: rgba(255, 255, 255, 0.08); }
        body { margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: var(--bg-dark); font-family: 'Segoe UI', system-ui, sans-serif; color: white; overflow-x: hidden; }
        .container { width: 460px; max-width: 95vw; background: var(--glass); border-radius: 28px; padding: 24px 12px; backdrop-filter: blur(30px); border: 1px solid var(--glass-border); box-sizing: border-box; }
        h2 { text-align: center; font-size: 20px; letter-spacing: 2px; margin-bottom: 20px; background: linear-gradient(to right, #818cf8, #c084fc); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; }
        .section-glass { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 20px; padding: 15px; margin-bottom: 15px; }
        .flex-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
        .flex-column { display: flex; flex-direction: column; flex: 1; }
        label { font-size: 11px; opacity: 0.6; margin-bottom: 4px; text-transform: uppercase; }
        select, input { background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border); border-radius: 8px; color: white; padding: 10px; font-size: 14px; outline: none; transition: 0.3s; }
        select:focus, input:focus { border-color: var(--primary); background: rgba(255,255,255,0.05); }
        .preview-area { width: 100%; height: 320px; background: #000; border-radius: 15px; overflow: hidden; display: flex; justify-content: center; align-items: center; position: relative; border: 1px solid var(--glass-border); }
        .btn { padding: 12px; border-radius: 12px; border: none; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 12px; flex: 1; display: flex; align-items: center; justify-content: center; }
        .btn-primary { background: linear-gradient(135deg, #4facfe, #00f2fe); }
        .btn-secondary { background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); }
        .btn-accent { background: linear-gradient(135deg, #BA68C8, #9b59b6); }
        .btn:hover { filter: brightness(1.2); transform: translateY(-2px); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .filter-controls { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        input[type="range"] { width: 100%; accent-color: var(--primary); padding: 0; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 2000; align-items: center; justify-content: center; }
        .modal-content { background: #1e293b; padding: 30px; border-radius: 24px; width: 280px; text-align: center; border: 1px solid var(--glass-border); }
        .progress-container { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; margin: 20px 0; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--primary); width: 0%; transition: 0.2s; }
        .disable { opacity: 0.3; pointer-events: none; filter: grayscale(1); }
        #log-panel { background: rgba(0,0,0,0.5); border: 1px solid var(--glass-border); border-radius: 12px; padding: 10px; margin-top: 15px; font-family: monospace; font-size: 11px; height: 50px; overflow-y: auto; color: #4facfe; }
        .log-entry { margin-bottom: 2px; border-left: 2px solid var(--primary); padding-left: 5px; }

        /* Croppr Visibility */
        .croppr-container * { user-select: none; box-sizing: border-box; }
        .croppr { position: relative; display: inline-block; }
        .croppr-overlay { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: rgba(0,0,0,0.6); z-index: 1; }
        .croppr-region { position: absolute; border: 1px dashed white; z-index: 3; cursor: move; box-shadow: 0 0 0 1000px rgba(0,0,0,0.5); }
        .croppr-handle { position: absolute; width: 14px; height: 14px; background: #fff; border: 2px solid var(--primary); border-radius: 50%; z-index: 4; }
        .croppr-imageClipped { position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 2; pointer-events: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>CLOCK EDITOR</h2>
        <div id="section-image" class="section-glass">
            <button class="btn btn-secondary" style="width:100%; margin-bottom:15px;" onclick="document.getElementById('file-input').click()">CHOOSE IMAGE / GIF</button>
            <input type="file" id="file-input" accept="image/gif,image/png,image/jpeg" hidden>
            <div class="preview-area"><p id="no-image-text" style="opacity:0.4">No Asset Loaded</p><img id="cropper-target" style="display:none"></div>
            <div class="filter-controls" style="margin-top:15px;">
                <button class="btn btn-secondary btn-filter active" id="brightness">Bright</button>
                <button class="btn btn-secondary btn-filter" id="saturation">Sat</button>
                <button class="btn btn-secondary btn-filter" id="inversion">Invert</button>
                <button class="btn btn-secondary btn-filter" id="grayscale">Gray</button>
                <div style="grid-column: span 2; margin-top:5px;">
                    <div class="flex-row" style="justify-content:space-between; font-size:11px; margin-bottom:3px;">
                        <span id="filter-name">Brightness</span><span id="filter-value">100%</span>
                    </div>
                    <input type="range" id="filter-slider" min="0" max="200" value="100">
                </div>
            </div>
            <div style="margin-top:15px;">
                <label>Playback Speed (1-32)</label>
                <div class="flex-row"><input type="range" id="speed" min="1" max="32" value="1" style="flex:4"><span id="speed-val" style="color:var(--primary); font-weight:bold; flex:1; text-align:right;">1</span></div>
            </div>
        </div>

        <div id="section-text" class="section-glass">
            <label>Alarm Label / Note</label>
            <input type="text" id="text" placeholder="Morning Alarm..." style="width:100%; box-sizing:border-box; margin-top:5px;">
        </div>

        <div id="section-alarm" class="section-glass">
            <div class="flex-row">
                <div class="flex-column"><label>Type</label><select id="typ"><option value="0">T-Days</option><option value="1">D-Month</option><option value="2">Once</option></select></div>
                <div class="flex-column"><label>Calendar</label><select id="am"><option value="0">Solar</option><option value="1">Lunar</option></select></div>
            </div>
            <div class="flex-row" style="margin-top:10px;">
                <div class="flex-column"><label>Repeat</label><select id="thu"><option value="0">Daily</option><option value="1">Sun</option><option value="2">Mon</option><option value="3">Tue</option><option value="4">Wed</option><option value="5">Thu</option><option value="6">Fri</option><option value="7">Sat</option></select></div>
            </div>
            <div class="flex-row" style="margin-top:10px;">
                <div class="flex-column"><label>Hour</label><input type="number" id="gio" min="0" max="23" value="7"></div>
                <div class="flex-column"><label>Min</label><input type="number" id="phut" min="0" max="59" value="0"></div>
                <div class="flex-column"><label>Day</label><input type="number" id="ngay" min="1" max="31" value="1"></div>
                <div class="flex-column"><label>Month</label><input type="number" id="thang" min="1" max="12" value="1"></div>
            </div>
            <div class="flex-column" style="margin-top:10px;"><label>Melody</label><select id="mel" class="listmelody">[[_MELODY_LIST_]]</select></div>
        </div>

        <div class="status-tag" id="ws-status">NOT CONNECTED</div>
        <div id="log-panel"></div>

        <div class="flex-row" style="margin-top:20px;">
            <button class="btn btn-secondary" id="btn-back">BACK</button>
            <button class="btn btn-primary" id="btn-preview">SYNC</button>
            <button class="btn btn-accent" id="btn-save">SAVE</button>
        </div>
    </div>

    <!-- Hidden Params -->
    <div style="display:none"><input id="pos-x"><input id="pos-y"><input id="pos-w"><input id="pos-h"></div>

    <div id="upload-modal" class="modal">
        <div class="modal-content"><h3 id="modal-title">Syncing...</h3><div class="progress-container"><div class="progress-bar" id="progress-bar"></div></div><div id="progress-percent">0%</div></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/omggif@1.0.10/omggif.min.js"></script>
    <script>

    <script>
        /** LOGIC CHÍNH **/
        const revMap = {0x7F:'à',0x80:'ả',0x81:'ã',0x82:'á',0x83:'ạ',0x84:'ă',0x85:'ằ',0x86:'ẳ',0x87:'ẵ',0x88:'ắ',0x89:'ặ',0x8A:'â',0x8B:'ầ',0x8C:'ẩ',0x8D:'ẫ',0x8E:'ấ',0x8F:'ậ',0x90:'đ',0x91:'è',0x92:'ẻ',0x93:'ẽ',0x94:'é',0x95:'ẹ',0x96:'ê',0x97:'ề',0x98:'ể',0x99:'ễ',0x9A:'ế',0x9B:'ệ',0x9C:'ì',0x9D:'ỉ',0x9E:'ĩ',0x9F:'í',0xA0:'ị',0xA1:'ò',0xA2:'ỏ',0xA3:'õ',0xA4:'ó',0xA5:'ọ',0xA6:'ô',0xA7:'ồ',0xA8:'ổ',0xA9:'ỗ',0xAA:'ố',0xAB:'ộ',0xAC:'ơ',0xAD:'ờ',0xAE:'ở',0xAF:'ỡ',0xB0:'ớ',0xB1:'ợ',0xB2:'ù',0xB3:'ủ',0xB4:'ũ',0xB5:'ú',0xB6:'ụ',0xB7:'ư',0xB8:'ừ',0xB9:'ử',0xBA:'ữ',0xBB:'ứ',0xBC:'ự',0xBD:'ỳ',0xBE:'ỷ',0xBF:'ỹ',0xC0:'ý',0xC1:'ỵ',0xC2:'À',0xC3:'Ả',0xC4:'Ã',0xC5:'Á',0xC6:'Ạ',0xC7:'Ă',0xC8:'Ằ',0xC9:'Ẳ',0xCA:'Ẵ',0xCB:'Ắ',0xCC:'Ặ',0xCD:'Â',0xCE:'Ầ',0xCF:'Ẩ',0xD0:'Ẫ',0xD1:'Ấ',0xD2:'Ậ',0xD3:'Đ',0xD4:'È',0xD5:'Ẻ',0xD6:'Ẽ',0xD7:'É',0xD8:'Ẹ',0xD9:'Ê',0xDA:'Ề',0xDB:'Ể',0xDC:'Ễ',0xDD:'Ế',0xDE:'Ệ',0xDF:'Ì',0xE0:'Ỉ',0xE1:'Ĩ',0xE2:'Í',0xE3:'Ị',0xE4:'Ò',0xE5:'Ỏ',0xE6:'Õ',0xE7:'Ó',0xE8:'Ọ',0xE9:'Ô',0xEA:'Ồ',0xEB:'Ổ',0xEC:'Ỗ',0xED:'Ố',0xEE:'Ộ',0xEF:'Ơ',0xF0:'Ờ',0xF1:'Ở',0xF2:'Ỡ',0xF3:'Ớ',0xF4:'Ợ',0xF5:'Ù',0xF6:'Ủ',0xF7:'Ũ',0xF8:'Ú',0xF9:'Ụ',0xFA:'Ư',0xFB:'Ừ',0xFC:'Ử',0xFD:'Ữ',0xFE:'Ứ',0xFF:'Ự',0x1F:'Ỳ',0x1E:'Ỷ',0x1D:'Ỹ',0x1C:'Ý',0x1B:'Ỵ'};
        function decodeHexText(hex){let s="";for(let i=0;i<hex.length;i+=2){let b=parseInt(hex.substr(i,2),16);s+=revMap[b]||String.fromCharCode(b);}return s;}
        function byteToHex(b){const s=(b&0xFF).toString(16);return s.length===1?'0'+s:s;}
        function dprintf(m){console.log(m);const p=document.getElementById('log-panel');if(p){const e=document.createElement('div');e.className='log-entry';e.innerText=m;p.appendChild(e);p.scrollTop=p.scrollHeight;}}
        const triggerChange = () => { document.getElementById('btn-preview').disabled=false; document.getElementById('btn-save').disabled=false; };

        const updateUI = () => {
            const v = document.getElementById("typ").value;
            const al = document.getElementById("am"), th = document.getElementById("thang"), ng = document.getElementById("ngay"), gi = document.getElementById("gio"), ph = document.getElementById("phut"), tn = document.getElementById("thu");
            [al, th, ng, gi, ph, tn].forEach(el => el.classList.remove("disable"));
            if (v == "0") [al, th, ng].forEach(el => el.classList.add("disable"));
            else if (v == "1") [gi, ph, tn].forEach(el => el.classList.add("disable"));
            else if (v == "2") [tn].forEach(el => el.classList.add("disable"));
        };

        let editorCroppr=null, editorImgOrig=null, editorGifFrames=[], editorIsGif=false, editorGifInterval=null;
        let eBright=100, eSat=100, eInv=0, eGray=0, imageChanged=false;
        let websocket=null, uploadQueue=[], totalPackets=0, isSaving=false, saveDoRedirect=false;

        function setupCropprImage(src, onReady) {
            if(editorCroppr){try{editorCroppr.destroy();}catch(e){} editorCroppr=null;}
            const noImg = document.getElementById('no-image-text'); if(noImg) noImg.style.display='none';
            const img = new Image(); img.src = src;
            img.onload = () => {
                const pW=440, pH=320; let uiW, uiH;
                if(img.width/img.height > pW/pH){ uiW=pW; uiH=uiW*img.height/img.width; } else { uiH=pH; uiW=uiH*img.width/img.height; }
                const cv = document.createElement("canvas"); const cx = cv.getContext("2d"); cv.width=pW; cv.height=pH;
                cx.translate(pW/2, pH/2); cx.drawImage(img, -uiW/2, -uiH/2, uiW, uiH);
                const target = document.getElementById('cropper-target'); target.style.display='block';
                target.onload = () => {
                    editorImgOrig = target;
                    editorCroppr = new Croppr(target, { onInitialize:()=>{imageChanged=true;triggerChange();}, onCropEnd:()=>{imageChanged=true;triggerChange();} });
                    if(onReady) onReady();
                };
                target.src = cv.toDataURL();
            };
        }

        document.getElementById('file-input').onchange = (e) => {
            if(!e.target.files.length) return;
            const file = e.target.files[0]; editorIsGif=false; editorGifFrames=[];
            if(editorGifInterval){clearInterval(editorGifInterval); editorGifInterval=null;}
            if(file.type === 'image/gif'){
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const uint8Arr = new Uint8Array(ev.target.result);
                        const gifReader = new GifReader(uint8Arr);
                        const num = gifReader.numFrames(), max=16, step=Math.max(1, Math.ceil(num/max));
                        const cumBuf = new Uint8ClampedArray(gifReader.width*gifReader.height*4);
                        for(let i=0; i<num; i++){
                            const fi = gifReader.frameInfo(i); gifReader.decodeAndBlitFrameRGBA(i, cumBuf);
                            if((i%step===0 || i===num-1) && editorGifFrames.length < max){
                                editorGifFrames.push({width:gifReader.width, height:gifReader.height, data:new Uint8ClampedArray(cumBuf)});
                            }
                            if(fi.disposal===2){
                                for(let dy=0; dy<fi.height; dy++) for(let dx=0; dx<fi.width; dx++){
                                    const idx=((fi.y+dy)*gifReader.width+(fi.x+dx))*4;
                                    cumBuf[idx]=0; cumBuf[idx+1]=0; cumBuf[idx+2]=0; cumBuf[idx+3]=0;
                                }
                            }
                        }
                        editorIsGif=true; const mid=editorGifFrames[Math.floor(editorGifFrames.length/2)];
                        const mc=document.createElement('canvas'); mc.width=mid.width; mc.height=mid.height;
                        const mx=mc.getContext('2d'); const md=mx.createImageData(mid.width,mid.height); md.data.set(mid.data); mx.putImageData(md,0,0);
                        setupCropprImage(mc.toDataURL(), () => {
                            let fIdx=0;
                            editorGifInterval = setInterval(() => {
                                if(!editorCroppr)return;
                                const fr=editorGifFrames[fIdx++ % editorGifFrames.length];
                                const tc=document.createElement('canvas'); tc.width=fr.width; tc.height=fr.height;
                                const tx=tc.getContext('2d'); const id2=tx.createImageData(fr.width,fr.height); id2.data.set(fr.data); tx.putImageData(id2,0,0);
                                const pW=440, pH=320; let uiW, uiH;
                                if(tc.width/tc.height > pW/pH){ uiW=pW; uiH=uiW*tc.height/tc.width; } else { uiH=pH; uiW=uiH*tc.width/tc.height; }
                                const uc=document.createElement("canvas"); const ux=uc.getContext("2d"); uc.width=pW; uc.height=pH;
                                ux.translate(pW/2, pH/2); ux.drawImage(tc, -uiW/2, -uiH/2, uiW, uiH);
                                document.querySelectorAll('.croppr-image, .croppr-imageClipped').forEach(img=>img.src=uc.toDataURL());
                            }, 150);
                        });
                        dprintf("GIF Loaded: " + num + " frames analyzed.");
                    } catch(err){ dprintf("Error: GIF too large or invalid."); setupCropprImage(URL.createObjectURL(file)); }
                };
                reader.readAsArrayBuffer(file);
            } else { setupCropprImage(URL.createObjectURL(file)); }
        };

        // Filters
        document.querySelectorAll('.btn-filter').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.btn-filter').forEach(b=>b.classList.remove('active'));
                btn.classList.add('active'); const f=btn.id; document.getElementById('filter-name').innerText=btn.innerText;
                const sl=document.getElementById('filter-slider');
                if(f==='brightness'||f==='saturation'){ sl.max=200; sl.value=(f==='brightness')?eBright:eSat; }
                else { sl.max=100; sl.value=(f==='inversion')?eInv:eGray; }
                document.getElementById('filter-value').innerText=sl.value+'%';
            };
        });
        document.getElementById('filter-slider').oninput = function(){
            const v=this.value; document.getElementById('filter-value').innerText=v+'%';
            const f=document.querySelector('.btn-filter.active').id;
            if(f==='brightness') eBright=v; else if(f==='saturation') eSat=v; else if(f==='inversion') eInv=v; else eGray=v;
            const fs=`brightness(${eBright}%) saturate(${eSat}%) invert(${eInv}%) grayscale(${eGray}%)`;
            document.querySelectorAll('.croppr-image, .croppr-imageClipped').forEach(img=>img.style.filter=fs);
        };

        let animPayload = "";
        function applyEditorCrop() {
            if(!editorCroppr || !editorImgOrig) return;
            const crop = editorCroppr.getValue();
            const fs=`brightness(${eBright}%) saturate(${eSat}%) invert(${eInv}%) grayscale(${eGray}%)`;
            const tw=64, th=64; animPayload="";
            document.getElementById('pos-x').value=crop.x; document.getElementById('pos-y').value=crop.y;
            document.getElementById('pos-w').value=tw; document.getElementById('pos-h').value=th;
            if(editorIsGif && editorGifFrames.length > 0){
                const hexF=[];
                editorGifFrames.forEach(fr => {
                    const sc=document.createElement('canvas'); sc.width=fr.width; sc.height=fr.height;
                    const sx=sc.getContext('2d'); const id3=sx.createImageData(fr.width,fr.height); id3.data.set(fr.data); sx.putImageData(id3,0,0);
                    const pW=440, pH=320; let uiW, uiH;
                    if(fr.width/fr.height > pW/pH){ uiW=pW; uiH=uiW*fr.height/fr.width; } else { uiH=pH; uiW=uiH*fr.width/fr.height; }
                    const pc=document.createElement("canvas"); const px=pc.getContext("2d"); pc.width=pW; pc.height=pH;
                    px.translate(pW/2, pH/2); px.drawImage(sc, -uiW/2, -uiH/2, uiW, uiH);
                    const out=document.createElement('canvas'); out.width=tw; out.height=th;
                    const ox=out.getContext('2d'); ox.filter=fs;
                    ox.drawImage(pc, crop.x, crop.y, crop.width, crop.height, 0, 0, tw, th);
                    const idata=ox.getImageData(0,0,tw,th).data; let h="";
                    for(let i=0; i<idata.length; i+=4){
                        const r=idata[i], g=idata[i+1], b=idata[i+2], a=idata[i+3];
                        h += byteToHex((a>>4)|(r&0xF0)) + byteToHex((g>>4)|(b&0xF0));
                    }
                    hexF.push(h);
                });
                animPayload = hexF.join('');
            } else {
                const out=document.createElement('canvas'); out.width=tw; out.height=th;
                const ox=out.getContext('2d'); ox.filter=fs;
                ox.drawImage(editorImgOrig, crop.x, crop.y, crop.width, crop.height, 0, 0, tw, th);
                const idata=ox.getImageData(0,0,tw,th).data; let h="";
                for(let i=0; i<idata.length; i+=4){
                    const r=idata[i]>>4, g=idata[i+1]>>4, b=idata[i+2]>>4, a=idata[i+3]>>4;
                    h += byteToHex(a|(r<<4)) + byteToHex(g|(b<<4));
                }
                animPayload = h;
            }
        }

        function sendImageData(finalSave, doRedirect) {
            if(!websocket || websocket.readyState !== WebSocket.OPEN) return;
            applyEditorCrop(); isSaving=finalSave; saveDoRedirect=doRedirect;
            const params = new URLSearchParams(window.location.search);
            const idx=(params.get('idx')||0), spd=document.getElementById('speed').value, qidx=(document.getElementById('quote_idx')?.value||0);
            const typ=document.getElementById("typ").value, gi=document.getElementById("gio").value, ph=document.getElementById("phut").value, ng=document.getElementById("ngay").value, th=document.getElementById("thang").value, tnu=document.getElementById("thu").value, am=document.getElementById("am").value, mel=document.getElementById("mel").value;
            const tv=document.getElementById('text').value; let nhex="";
            for(let i=0; i<tv.length; i++){ let c=tv.charCodeAt(i), h=byteToHex(c<256?c:32); for(let k in revMap) if(revMap[k]===tv[i]){ h=byteToHex(parseInt(k)); break; } nhex+=h; }
            const px=document.getElementById('pos-x').value, py=document.getElementById('pos-y').value, pw=document.getElementById('pos-w').value, phh=document.getElementById('pos-h').value;
            const hasImg=1, hasAlm=1, hasTxt=1, cnd=1;
            const meta = `#CMET$${idx}:${spd}:${qidx}:${typ}:${gi}:${ph}:${ng}:${th}:${tnu}:${am}:${mel}:${hasImg}:${hasAlm}:${hasTxt}:${cnd}:${px}:${py}:${pw}:${phh}:${nhex}`;
            document.getElementById('upload-modal').style.display='flex';
            if(imageChanged && animPayload){
                uploadQueue=[]; for(let i=0; i<animPayload.length; i+=1024) uploadQueue.push(animPayload.substring(i, i+1024));
                totalPackets=uploadQueue.length; websocket.send("#MSTB$"+idx);
            } else { websocket.send(meta); }
        }

        function initWebSocket() {
            websocket = new WebSocket(`ws://${window.location.hostname}/ws`);
            websocket.onopen = () => { document.getElementById('ws-status').innerText='CONNECTED'; const p=new URLSearchParams(window.location.search); websocket.send("#CVIE$"+(p.get('idx')||"0")); };
            websocket.onclose = () => { document.getElementById('ws-status').innerText='DISCONNECTED'; setTimeout(initWebSocket,2000); };
            websocket.onmessage = (e) => {
                const data = e.data;
                if(data === "M_READY" || data === "M_AB_UP_OK"){
                    if(uploadQueue.length > 0){
                        const chunk = uploadQueue.shift(); const prg = Math.round(((totalPackets-uploadQueue.length)/totalPackets)*100);
                        document.getElementById('progress-bar').style.width = prg+'%'; document.getElementById('progress-percent').innerText = prg+'%';
                        websocket.send('#MABIMG$'+chunk);
                    } else { websocket.send('#MABSAV$'); }
                } else if(data === "M_AB_SAVEOK" || data === "M_SAVEOK" || data === "C_SAVEOK"){
                    document.getElementById('modal-title').innerText = "SUCCESS!";
                    setTimeout(() => { document.getElementById('upload-modal').style.display='none'; if(saveDoRedirect) window.location.href='/clock.html?v='+Date.now(); }, 1000);
                } else if(data.startsWith("#CMET$")){
                    const p = data.slice(6).split(':');
                    if(p.length >= 19){
                        document.getElementById('speed').value=p[1]; document.getElementById('speed-val').innerText=p[1];
                        if(document.getElementById('quote_idx')) document.getElementById('quote_idx').value=p[2];
                        document.getElementById('typ').value=p[3]; document.getElementById('gio').value=p[4]; document.getElementById('phut').value=p[5];
                        document.getElementById('ngay').value=p[6]; document.getElementById('thang').value=p[7]; document.getElementById('thu').value=p[8];
                        document.getElementById('am').value=p[9]; document.getElementById('mel').value=p[10];
                        if(p[19]) document.getElementById('text').value = decodeHexText(p[19]);
                        updateUI();
                    }
                }
            };
        }

        document.getElementById('btn-preview').onclick=()=>sendImageData(true, false);
        document.getElementById('btn-save').onclick=()=>sendImageData(true, true);
        document.getElementById('btn-back').onclick=()=>window.location.href='/clock.html?v='+Date.now();
        ['typ','am','thu','gio','phut','ngay','thang','mel','text'].forEach(id=>{
            const el=document.getElementById(id); if(el){ el.onchange=triggerChange; el.oninput=triggerChange; }
        });
        initWebSocket();
    </script>
</body>
</html>
