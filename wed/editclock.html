            color: white;

        .container {
            width: 460px;
            max-width: 95vw;
            background: var(--glass);
            border-radius: 28px;
            padding: 24px 12px;
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.2);
            box-sizing: border-box;
            position: relative;
            z-index: 1;
        }

        h2 {
            text-align: center;
            font-weight: 700;
            font-size: 20px;
            letter-spacing: 2px;
            margin: 0 0 20px 0;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .section-glass {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .flex-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }

        .flex-column {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        label {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 4px;
        }

        select,
        input[type="number"],
        input[type="text"] {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: white;
            padding: 8px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        option {
            background: rgb(20, 20, 20);
            color: white;
        }

        select:focus,
        input:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.1);
        }

        .preview-area {
            width: 100%;
            height: 380px;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid var(--glass-border);
            position: relative;
        }

        .preview-area img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .btn {
            padding: 8px 12px;
            border-radius: 10px;
            border: none;
            color: white;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
        }

        .btn-secondary {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-accent {
            background: linear-gradient(135deg, #BA68C8, #9b59b6);
            /* Tương tự tone màu Accent cũ */
        }

        .btn:hover {
            filter: brightness(1.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            filter: none;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .filter-controls {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .slider-group {
            margin-top: 10px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--primary);
            background: transparent;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: #1e293b;
            padding: 30px;
            border-radius: 24px;
            width: 280px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }

        .modal-content h3 {
            margin: 0;
            font-weight: 300;
            letter-spacing: 1px;
            font-size: 18px;
            color: white;
        }

        .progress-container {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary, var(--primary)));
            transition: width 0.3s;
        }


        .status-tag {
            display: block;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 20px;
            text-align: center;
            font-family: monospace;
        }

        hr {
            border: none;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(186, 104, 200, 0.4), transparent);
            margin: 15px 0;
        }

        /* Croppr Specific Styles (Subset) */
        .croppr-container {
            position: relative;
            display: inline-block;
        }

        .croppr-overlay {
            background: rgba(0, 0, 0, 0.5);
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 1;
        }

        .croppr-region {
            border: 1px dashed white;
            position: absolute;
            z-index: 3;
            cursor: move;
        }

        .croppr-handle {
            border: 1px solid white;
            background-color: var(--primary);
            width: 10px;
            height: 10px;
            position: absolute;
            z-index: 4;
        }

        .croppr-imageClipped {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 2;
            pointer-events: none;
        }

        .disable {
            opacity: 0.2;
            pointer-events: none;
            filter: blur(1px);
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>CUSTOM EDITOR</h2>
        <hr>
        <div id="section-image" style="display: none;">
            <div class="section-glass">
                <div class="flex-column">
                    <button class="btn btn-secondary" onclick="document.getElementById('file-input').click()"
                        style="width: 100%;">
                        CHOOSE IMAGE
                    </button>
                </div>
                <input type="file" id="file-input" accept="image/*" hidden>
            </div>

            <div class="preview-area" id="preview-container">
                <p style="opacity: 0.3;" id="no-image-text">No Image Selected</p>
                <img id="cropper-target" style="max-width: 100%; max-height: 100%; display: none;" />
            </div>

            <div class="section-glass filter-controls" style="margin-top: 20px;">
                <button class="btn btn-secondary btn-filter active" id="brightness">Brightness</button>
                <button class="btn btn-secondary btn-filter" id="saturation">Saturation</button>
                <button class="btn btn-secondary btn-filter" id="inversion">Inversion</button>
                <button class="btn btn-secondary btn-filter" id="grayscale">Grayscale</button>
                <div class="slider-group" style="grid-column: span 2;">
                    <div class="flex-row" style="justify-content: space-between; margin-bottom: 5px;">
                        <span id="filter-name" style="font-size: 12px;">Brightness</span>
                        <span id="filter-value" style="font-size: 12px; color: var(--primary);">100%</span>
                    </div>
                    <input type="range" id="filter-slider" min="0" max="200" value="100">
                </div>
            </div>
        </div>

        <div style="height: 10px;"></div>

        <div id="section-text" class="section-glass" style="display: none;">
            <label>Alarm Title / Note</label>
            <input autocomplete="off" placeholder="Note..." type="text" id='text' maxlength="255"
                style="width: 100%; box-sizing: border-box;">

                        <option value="2">Once</option>
                    </select>

                        <option value="1">Lunar</option>
                    </select>
                </div>
            </div>
            <div class="flex-column" style="margin-top: 10px;">
                <label>Repeat (Day of week)</label>
                <select id="thu">
                    <option value="0">Daily</option>
                    <option value="1">Sun</option>
                    <option value="2">Mon</option>
                    <option value="3">Tue</option>
                    <option value="4">Wed</option>
                    <option value="5">Thu</option>
                    <option value="6">Fri</option>
                    <option value="7">Sat</option>
                </select>
            </div>
            <div style="margin-top: 10px;">
                <label>Time & Date</label>
                <div class="flex-row">
                    <div class="flex-column"><label>Hour</label><input type="number" id='gio' min="0" max="23"></div>
                    <div class="flex-column"><label>Min</label><input type="number" id='phut' min="0" max="59"></div>
                    <div class="flex-column"><label>Day</label><input type="number" id='ngay' min="1" max="31"></div>
                    <div class="flex-column"><label>Month</label><input type="number" id='thang' min="1" max="12"></div>
                </div>
            </div>
            <div class="flex-column" style="margin-top: 10px;">

            return s;
        }

        const triggerChange = () => {
            if (btnPreview) btnPreview.disabled = false;
            if (btnSave) btnSave.disabled = false;
        };

        const updateUI = () => {
            triggerChange();
            const v = document.getElementById("typ").value;
            const al = document.getElementById("am"), th = document.getElementById("thang"), ng = document.getElementById("ngay"), gi = document.getElementById("gio"), ph = document.getElementById("phut"), tn = document.getElementById("thu");
            [al, th, ng, gi, ph, tn].forEach(el => el.classList.remove("disable"));
            if (v == "0") [al, th, ng].forEach(el => el.classList.add("disable"));
            else if (v == "1") [gi, ph, tn].forEach(el => el.classList.add("disable"));
            else if (v == "2") [tn].forEach(el => el.classList.add("disable"));
        };

        let croppr = null;
        let imgOrig = null;
        let imageChanged = false;
        let brightness = 100, saturation = 100, inversion = 0, grayscale = 0;
        let websocket;
        let connectt = 0;
        let currentLayer = 0;

        const fileInput = document.getElementById('file-input');
        const previewContainer = document.getElementById('preview-container');
        const posX = document.getElementById('pos-x');
        const posY = document.getElementById('pos-y');
        const posW = document.getElementById('pos-w');
        const posH = document.getElementById('pos-h');
        const btnPreview = document.getElementById('btn-preview');
        const btnSave = document.getElementById('btn-save');
        const filterSlider = document.getElementById('filter-slider');
        const filterName = document.getElementById('filter-name');
        const filterValue = document.getElementById('filter-value');
        const progressBar = document.getElementById('progress-bar');
        const progressPercent = document.getElementById('progress-percent');
        const uploadModal = document.getElementById('upload-modal');

        // Logic to update inputs (Layer select was removed)


        fileInput.onchange = (e) => {
            if (e.target.files.length) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const img = new Image();
                    img.src = ev.target.result;
                    img.onload = () => {
                        // Kích thước khu vực hiển thị (preview container)
                        const pW = 368;
                        const pH = 380;

                        // Tính toán kích thước ảnh thu nhỏ (cogiax) để vừa khung
                        let uiW, uiH;
                        if (img.width / img.height > pW / pH) {
                            uiW = pW; uiH = uiW * img.height / img.width;
                        } else {
                            uiH = pH; uiW = uiH * img.width / img.height;
                        }

                        const canvasUI = document.createElement("canvas");
                        const ctxUI = canvasUI.getContext("2d");
                        canvasUI.width = pW;
                        canvasUI.height = pH;
                        ctxUI.translate(pW / 2, pH / 2);
                        // Vẽ ảnh nguyên bản đã scale để vừa khung nhìn
                        ctxUI.drawImage(img, -uiW / 2, -uiH / 2, uiW, uiH);

                        const scaledImgSrc = canvasUI.toDataURL();

                        if (croppr) {
                            try { croppr.destroy(); } catch (e) { console.log(e); }
                            croppr = null;
                        }

                        const noImageText = document.getElementById('no-image-text');
                        if (noImageText) noImageText.style.display = 'none';

                        const targetImg = document.getElementById('cropper-target');
                        if (!targetImg) return;
                        targetImg.style.display = 'block';

                        targetImg.onload = () => {
                            imgOrig = targetImg; // Lấy ảnh này làm gốc để crop

                            croppr = new Croppr(targetImg, {
                                // Khai báo rõ kích thước mặc định để không bị mất vòng bao (Handle Bug)
                                startSize: [80, 80, '%'],
                                minSize: [10, 10, 'px'],
                                returnMode: 'real',
                                onInitialize: () => {
                                    imageChanged = true;
                                    triggerChange();
                                },
                                onCropEnd: () => {
                                    imageChanged = true;
                                    triggerChange();
                                }
                            });
                        };

                        targetImg.src = scaledImgSrc;
                    };
                };
                reader.readAsDataURL(e.target.files[0]);
            }
        };

        // Filter Logic
        document.querySelectorAll('.btn-filter').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                imageChanged = true;
                triggerChange();
                filterName.innerText = btn.innerText;
                if (btn.id === 'brightness' || btn.id === 'saturation') {
                    filterSlider.max = 200;
                    filterSlider.value = (btn.id === 'brightness') ? brightness : saturation;
                } else {
                    filterSlider.max = 100;
                    filterSlider.value = (btn.id === 'inversion') ? inversion : grayscale;
                }
                filterValue.innerText = filterSlider.value + '%';
            };
        });

        filterSlider.oninput = () => {
            const val = filterSlider.value;
            filterValue.innerText = val + '%';
            const active = document.querySelector('.btn-filter.active').id;
            if (active === 'brightness') brightness = val;
            else if (active === 'saturation') saturation = val;
            else if (active === 'inversion') inversion = val;
            else grayscale = val;

            if (imgOrig) {
                imageChanged = true;
                const filterStr = `brightness(${brightness}%) saturate(${saturation}%) invert(${inversion}%) grayscale(${grayscale}%)`;
                // Áp dụng cho cả ảnh nền và ảnh trong khung crop của Croppr
                const previewImgs = document.querySelectorAll('.croppr-image, .croppr-imageClipped');
                previewImgs.forEach(img => img.style.filter = filterStr);
            }
            triggerChange();
        };

            const el = document.getElementById(id);
            if (el) {
                el.addEventListener('input', triggerChange);
                el.addEventListener('change', triggerChange);
            }

        function byteToHex(b) {

        function goBackWithReferrer() {

                    window.location.href = '/clock.html?v=' + Date.now();
                }
            } else {
                window.location.href = '/clock.html?v=' + Date.now();
            }

        window.addEventListener('load', () => {

            if (w !== null) posW.value = w;
            if (h !== null) posH.value = h;

        });

        function sendImageData(finalSave) {

            let crop = null;
            let imageHasContent = (imgOrig && imageChanged);

            if (croppr && imageChanged) {
                crop = croppr.getValue();
                const canvas = document.createElement('canvas');
                canvas.width = targetW;
                canvas.height = targetH;
                const ctx = canvas.getContext('2d');
                ctx.filter = `brightness(${brightness}%) saturate(${saturation}%) invert(${inversion}%) grayscale(${grayscale}%)`;
                ctx.drawImage(imgOrig, crop.x, crop.y, crop.width, crop.height, 0, 0, targetW, targetH);

                const imgData = ctx.getImageData(0, 0, targetW, targetH).data;
                for (let i = 0; i < imgData.length; i += 4) {
                    const r = imgData[i] >> 4, g = imgData[i + 1] >> 4, b = imgData[i + 2] >> 4, a = imgData[i + 3] >> 4;
                    hexData += byteToHex(a | (r << 4)) + byteToHex(g | (b << 4));
                }

                // --- Padding to 8192 bytes (16384 hex chars) ---
                const targetHexLen = 16384;
                if (hexData.length < targetHexLen) {
                    hexData = hexData.padEnd(targetHexLen, '0');
                }
            }

            if (finalSave) {
                const params = new URLSearchParams(window.location.search);
                const idx = params.get('idx') || 0;
                const tutao = (params.get('tutao') === '1' ? 1 : 0);
                const px = parseInt(posX.value) || 0;
                const py = parseInt(posY.value) || 0;
                const pw = parseInt(posW.value) || 64;
                const phh = parseInt(posH.value) || 64;
                const typ = parseInt(document.getElementById("typ").value) || 0;
                const gi = parseInt(document.getElementById("gio").value) || 0;
                const ph = parseInt(document.getElementById("phut").value) || 0;
                const ng = parseInt(document.getElementById("ngay").value) || 1;
                const th = parseInt(document.getElementById("thang").value) || 1;
                const tnu = parseInt(document.getElementById("thu").value) || 0;
                const am = parseInt(document.getElementById("am").value) || 0;
                const mel = parseInt(document.getElementById("mel").value) || 0;
                const chk = (params.get('chk') === '1' ? 1 : 0);
                const nchk = (params.get('chu') === '1' ? 1 : 0);

                const tv = document.getElementById('text').value;
                let nhex = "";
                for (let i = 0; i < tv.length; i++) {
                    let c = tv.charCodeAt(i); let h = byteToHex(c < 256 ? c : 32);
                    for (let k in revMap) if (revMap[k] === tv[i]) { h = byteToHex(parseInt(k)); break; }
                    nhex += h;
                }

                // 1. Gửi Text Note (#CNOT$)
                if (isText) {
                    const cnot = `#CNOT$${tv.length},${nhex}`;
                    websocket.send(cnot);
                }

                // 2. Gửi Hẹn giờ (#CALM$)
                if (isAlarm) {
                    // Định dạng: typ,gio,phut,ngay,thang,extra,amly,melody
                    const calm = `#CALM$${typ},${gi},${ph},${ng},${th},${tnu},${am},${mel}`;
                    websocket.send(calm);
                }
            }

            // #HGT logic removed; handled in #CHGM now.

            if (hexData) {
                startUpload(hexData, finalSave);
            } else if (finalSave) {
                isSaving = true;
                uploadModal.style.display = 'flex';
                document.getElementById('modal-title').innerText = "Finishing...";
                websocket.send("#CSAV$");
            }

            if (finalSave || imageChanged) {
                imageChanged = false; // reset after operation
            }
        }

        let uploadQueue = [];
        let totalPackets = 0;
        // let layerToSave = 0; // redundant with currentLayer
        let isSaving = false;

        function startUpload(mainData, finalSave) {
            uploadModal.style.display = 'flex';
            document.getElementById('modal-title').innerText = finalSave ? "Saving..." : "Previewing...";
            isSaving = finalSave;

            uploadQueue = [];
            for (let i = 0; i < mainData.length; i += 1024) uploadQueue.push("#CIMG$" + mainData.substring(i, i + 1024));

            totalPackets = uploadQueue.length;
            const params = new URLSearchParams(window.location.search);
            const idx = params.get('idx') || 0;
            websocket.send("#CSTB$" + idx); // Start clock session
        }

        function initWebSocket() {
            if (websocket && (websocket.readyState === WebSocket.CONNECTING || websocket.readyState === WebSocket.OPEN)) return;
            websocket = new WebSocket(`ws://${window.location.hostname}/ws`);
            websocket.onopen = () => {
                connectt = 1;
                document.getElementById('ws-status').innerText = "Connected";
                const params = new URLSearchParams(window.location.search);
                const idx = params.get('idx');
                if (idx !== null) websocket.send("#CLK$" + idx);
            };
            websocket.onclose = () => {
                setTimeout(initWebSocket, 2000);
                connectt = 0;
                document.getElementById('ws-status').innerText = "Disconnected";
            };
            websocket.onmessage = (e) => {
                const data = e.data;
                if (data === "C_READY" || data === "C_UP_OK") {
                    if (uploadQueue.length > 0) {
                        websocket.send(uploadQueue.shift());
                        const prog = Math.round(((totalPackets - uploadQueue.length) / totalPackets) * 100);
                        progressBar.style.width = prog + '%';
                        progressPercent.innerText = prog + '%';
                    } else {
                        websocket.send(isSaving ? "#CSAV$" : "#CFIN$");
                    }
                } else if (data === "C_SAVEOK") {
                    document.getElementById('modal-title').innerText = "Success!";
                    setTimeout(() => {
                        window.location.href = '/clock.html?v=' + Date.now();
                    }, 1500);
                }
            };
        }

        window.addEventListener('load', () => {
            initWebSocket();
            const params = new URLSearchParams(window.location.search);
            const idx = params.get('idx');
            const x = params.get('x'), y = params.get('y'), w = params.get('w'), h = params.get('h');

            if (idx !== null) currentLayer = parseInt(idx);
            if (x !== null) posX.value = x;
            if (y !== null) posY.value = y;
            if (w !== null) posW.value = w;
            if (h !== null) posH.value = h;

            const fields = ['typ', 'gio', 'phut', 'ngay', 'thang', 'thu', 'am', 'mel'];
            fields.forEach(f => {
                let v = params.get(f);
                if (v !== null) {
                    let el = document.getElementById(f);
                    if (el) el.value = v;
                }
            });

            // Show/Hide sections based on flags
            let tutaoFlag = params.get('tutao');
            let chuFlag = params.get('chu');
            let chkFlag = params.get('chk');

            if (tutaoFlag && tutaoFlag !== '0') document.getElementById('section-image').style.display = 'block';
            if (chuFlag && chuFlag !== '0') document.getElementById('section-text').style.display = 'block';
            if (chkFlag && chkFlag !== '0') document.getElementById('section-alarm').style.display = 'block';

            let txt = params.get('text');
            if (txt) document.getElementById('text').value = decodeHexText(txt);
            updateUI();

            // Load raw image if provided
            const rawImg = params.get('rawImg');
            if (rawImg && tutaoFlag === '1') {
                const targetImg = document.getElementById('cropper-target');
                targetImg.src = "/get_file?name=" + rawImg + "&v=" + Date.now();
                targetImg.style.display = 'block';
                document.getElementById('no-image-text').style.display = 'none';
                targetImg.onload = () => {
                    imgOrig = targetImg;
                    if (croppr) { try { croppr.destroy(); } catch (e) { } }
                    croppr = new Croppr(targetImg, {
                        startSize: [80, 80, '%'],
                        minSize: [10, 10, 'px'],
                        returnMode: 'real',
                        onInitialize: () => {
                            // Initial load doesn't count as changed unless user moves it
                            // but triggerChange enables the buttons
                            triggerChange();
                        },
                        onCropEnd: () => {
                            imageChanged = true;
                            triggerChange();
                        }
                    });
                };
            }

            if (typeof m_x !== 'undefined' && idx === null) {
                posX.value = m_x[0];
                posY.value = m_y[0];
                posW.value = m_w[0];
                posH.value = m_h[0];
            }

            document.getElementById('btn-back').onclick = () => {
                window.location.href = '/clock.html?v=' + Date.now();
            };
        });
    </script>
</body>

</html>
