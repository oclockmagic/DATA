<html lang="en">

<head>

    <title>MAGIC O'CLOCK - EDIT</title>
    <style>
        :root {
            --primary: #4facfe;
            --secondary: #00f2fe;
            --accent: #BA68C8;
            --bg-dark: rgb(6, 2, 29);
            --glass: rgba(15, 23, 42, 0.2);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

            background-attachment: fixed;

            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: white;
        }

        .container {
            width: 460px;
            max-width: 95vw;
            background: var(--glass);
            border-radius: 28px;
            padding: 24px 12px;
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.2);
            box-sizing: border-box;
            position: relative;
            z-index: 1;
        }

        h2 {
            text-align: center;
            font-weight: 700;
            font-size: 20px;
            letter-spacing: 2px;
            margin: 0 0 20px 0;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .section-glass {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .flex-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }

        .flex-column {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        label {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 4px;
        }

        select,
        input[type="number"],
        input[type="text"] {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: white;
            padding: 8px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        option {
            background: rgb(20, 20, 20);
            color: white;
        }

        select:focus,
        input:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.1);
        }

        .preview-area {
            width: 100%;
            height: 380px;
            background-color: #000;
            background-image:
                linear-gradient(45deg, #111 25%, transparent 25%),
                linear-gradient(-45deg, #111 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #111 75%),
                linear-gradient(-45deg, transparent 75%, #111 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            border-radius: 15px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid var(--glass-border);
            position: relative;
        }

        .preview-area>img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .btn {
            padding: 8px 12px;
            border-radius: 10px;
            border: none;
            color: white;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
        }

        .btn-secondary {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-accent {
            background: linear-gradient(135deg, #BA68C8, #9b59b6);
            /* Tương tự tone màu Accent cũ */
        }

        .btn:hover {
            filter: brightness(1.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            filter: none;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .filter-controls {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .slider-group {
            margin-top: 10px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--primary);
            background: transparent;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: #1e293b;
            padding: 30px;
            border-radius: 24px;
            width: 280px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }

        .modal-content h3 {
            margin: 0;
            font-weight: 300;
            letter-spacing: 1px;
            font-size: 18px;
            color: white;
        }

        .progress-container {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary, var(--primary)));
            transition: width 0.3s;
        }


        .status-tag {
            display: block;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 20px;
            text-align: center;
            font-family: monospace;
        }

        hr {
            border: none;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(186, 104, 200, 0.4), transparent);
            margin: 15px 0;
        }

        /* ===== Croppr v2.3.1 official CSS ===== */
        .croppr-container * {
            user-select: none;
            box-sizing: border-box;
        }

        .croppr-container img {
            vertical-align: middle;
            max-width: 100%;
        }

        .croppr {
            position: relative;
            display: inline-block;
        }

        .croppr-handle,
        .croppr-imageClipped,
        .croppr-overlay,
        .croppr-region {
            position: absolute;
            top: 0;
        }

        .croppr-overlay {
            background: rgba(0, 0, 0, .5);
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 1;
            cursor: crosshair;
        }

        .croppr-region {
            border: 1px dashed rgba(0, 0, 0, .5);
            z-index: 3;
            cursor: move;
        }

        .croppr-imageClipped {
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 2;
            pointer-events: none;
        }

        .croppr-handle {
            border: 1px solid #000;
            background-color: #fff;
            width: 10px;
            height: 10px;
            z-index: 4;
        }

        /* ===== Custom visibility overrides ===== */
        .croppr-container {
            position: relative;
        }

        .croppr-region {
            border: 1px dashed #fff !important;
            z-index: 99 !important;
            animation: croppr-glow 0.2s infinite alternate !important;
            background: rgba(255, 0, 0, 0.1) !important;
        }

        @keyframes croppr-glow {
            from {
                box-shadow: inset 0 0 0 1px rgba(255, 0, 0, 0.9), 0 0 0 1px rgba(255, 0, 0, 0.9);
            }

            to {
                box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.9);
            }
        }

        .croppr-handle {
            border: 2px solid #fff !important;
            background-color: #ff0000 !important;
            width: 12px !important;
            height: 12px !important;
            z-index: 100 !important;
            border-radius: 3px !important;
        }

        .disable {
            opacity: 0.2;
            pointer-events: none;
            filter: blur(1px);
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>CUSTOM EDITOR</h2>
        <hr>

        <div id="init-overlay"
            style="position: absolute; inset: 0; background: rgba(6, 2, 29, 0.9); z-index: 100; border-radius: 28px; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px);">
            <div style="text-align: center; color: white;">
                <div
                    style="pointer-events: none; width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.2); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px auto;">
                </div>
                <div style="font-size: 14px; font-weight: bold; letter-spacing: 1px; color: var(--primary);">LOADING
                    EDITOR...</div>
                <div style="font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 5px;">Connecting to Clock</div>
            </div>
            <style>
                @keyframes spin {
                    to {
                        transform: rotate(360deg);
                    }
                }
            </style>
        </div>

        <div id="section-image" style="display: none;">
            <div class="section-glass">
                <div class="flex-column">
                    <button class="btn btn-secondary" onclick="document.getElementById('file-input').click()"
                        style="width: 100%;">
                        CHOOSE IMAGE
                    </button>
                </div>
                <input type="file" id="file-input" accept="image/*" hidden>
            </div>

            <div class="preview-area" id="preview-container">
                <p style="opacity: 0.3;" id="no-image-text">No Image Selected</p>
                <img id="cropper-target" style="max-width: 100%; max-height: 100%; display: none;" />
            </div>

            <div class="section-glass filter-controls" style="margin-top: 20px;">
                <button class="btn btn-secondary btn-filter active" id="brightness">Brightness</button>
                <button class="btn btn-secondary btn-filter" id="saturation">Saturation</button>
                <button class="btn btn-secondary btn-filter" id="inversion">Inversion</button>
                <button class="btn btn-secondary btn-filter" id="grayscale">Grayscale</button>
                <div class="slider-group" style="grid-column: span 2;">
                    <div class="flex-row" style="justify-content: space-between; margin-bottom: 5px;">
                        <span id="filter-name" style="font-size: 12px;">Brightness</span>
                        <span id="filter-value" style="font-size: 12px; color: var(--primary);">100%</span>
                    </div>
                    <input type="range" id="filter-slider" min="0" max="200" value="100">
                </div>

                <div class="slider-group"
                    style="grid-column: span 2; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px;">
                    <div class="flex-row" style="justify-content: space-between; margin-bottom: 5px;">
                        <span style="font-size: 12px; opacity: 0.7;">Animation Speed (1 - 32)</span>
                        <span id="speed-val" style="font-size: 12px; color: var(--primary);">1</span>
                    </div>
                    <input type="range" id="speed" min="1" max="32" value="1"
                        oninput="document.getElementById('speed-val').innerText = this.value" onchange="sendSpeed()"
                        style="width: 100%;">
                </div>

                <div style="grid-column: span 2;">
                    <button class="btn btn-primary" id="btn-save-image-only"
                        style="width: 100%; height: 32px; font-size: 10px;" disabled>

            function setupCropprImage(dataUrl) {

                    const am = parseInt(document.getElementById("am").value) || 0;
                    const mel = parseInt(document.getElementById("mel").value) || 0;
                    websocket.send(`#CALM$${typ},${gi},${ph},${ng},${th},${tnu},${am},${mel}`);
                }

                // 4. Kết thúc: Lưu vào Flash với flag MET để chip chỉ ghi header/alarm/text, không ghi ảnh
                websocket.send("#CRES$");
                websocket.send(isSaving ? "#CSAV:MET" + (isGifAnimation ? ":1" : ":0") : "#CFIN$");
            }

            function sendImageData(finalSave, doRedirect, onlyImage = false) {
                if (!connectt) return;
                const params = new URLSearchParams(window.location.search);
                const isAlarm = (params.get('chk') && params.get('chk') !== '0');
                const isText = (params.get('chu') && params.get('chu') !== '0');
                const isTutao = (params.get('tutao') && params.get('tutao') !== '0');

                const px = parseInt(posX.value) || 0;
                const py = parseInt(posY.value) || 0;
                const pw = parseInt(posW.value) || 64;
                const phh = parseInt(posH.value) || 64;

                const targetW = pw;
                const targetH = phh;

                let hexData = "";
                let imageHasContent = (imgOrig && imageChanged);

                if (croppr && imageChanged) {
                    const crop = croppr.getValue();
                    const canvas = document.createElement('canvas');
                    canvas.width = targetW;
                    canvas.height = targetH;
                    const ctx = canvas.getContext('2d');
                    ctx.filter = `brightness(${brightness}%) saturate(${saturation}%) invert(${inversion}%) grayscale(${grayscale}%)`;

                    ctx.drawImage(imgOrig, crop.x, crop.y, crop.width, crop.height, 0, 0, targetW, targetH);

                    const imgData = ctx.getImageData(0, 0, targetW, targetH).data;
                    for (let i = 0; i < imgData.length; i += 4) {
                        let r = imgData[i], g = imgData[i + 1], b = imgData[i + 2], a = imgData[i + 3];

                        // Alpha threshold: Nếu quá mờ ( < 32/255 ) thì coi như trong suốt hoàn toàn
                        if (a < 32) {
                            a = 0; r = 0; g = 0; b = 0;
                        }

                        const r4 = r >> 4, g4 = g >> 4, b4 = b >> 4, a4 = a >> 4;
                        hexData += byteToHex(a4 | (r4 << 4)) + byteToHex(g4 | (b4 << 4));
                    }

                    const targetHexLen = targetW * targetH * 4;
                    if (hexData.length < targetHexLen) {
                        hexData = hexData.padEnd(targetHexLen, '0');
                    }
                }

                if (finalSave) {
                    // Lấy trạng thái trực tiếp từ UI
                    const secAlarm = document.getElementById('section-alarm');
                    const secText = document.getElementById('section-text');
                    const secImg = document.getElementById('section-image');

                    const isAlarm = (secAlarm && secAlarm.style.display !== 'none');
                    const isText = (secText && secText.style.display !== 'none');
                    const tutao = (secImg && secImg.style.display !== 'none') ? 1 : 0;

                    const typ = parseInt(document.getElementById("typ").value) || 0;
                    const gi = parseInt(document.getElementById("gio").value) || 0;
                    const ph = parseInt(document.getElementById("phut").value) || 0;
                    const ng = parseInt(document.getElementById("ngay").value) || 1;
                    const th = parseInt(document.getElementById("thang").value) || 1;
                    const tnu = parseInt(document.getElementById("thu").value) || 0;
                    const am = parseInt(document.getElementById("am").value) || 0;
                    const mel = parseInt(document.getElementById("mel").value) || 0;

                    // 0. Gửi Header 
                    websocket.send(`#CHDR$${px},${py},${pw},${phh},${tutao}`);

                    if (!onlyImage) {
                        // Gửi Quote (nếu có)
                        const quoteBox = document.getElementById('quote-selection-container');
                        if (isText && quoteBox && quoteBox.style.display !== 'none') {
                            const qidx = document.getElementById('quote_idx') ? document.getElementById('quote_idx').value : "0";
                            websocket.send("#CQOT$" + qidx);
                        }

                        // Gửi Note/Text (nếu có)
                        const manualBox = document.getElementById('manual-text-container');
                        if (isText && manualBox && manualBox.style.display !== 'none') {
                            const tv = document.getElementById('text').value;
                            let nhex = "";
                            const charToHex = {};
                            for (let k in revMap) charToHex[revMap[k]] = byteToHex(parseInt(k));
                            for (let i = 0; i < tv.length; i++) {
                                nhex += charToHex[tv[i]] || byteToHex(tv.charCodeAt(i) < 256 ? tv.charCodeAt(i) : 32);
                            }
                            websocket.send(`#CNOT$${tv.length},${nhex}`);
                        }

                        if (isAlarm) websocket.send(`#CALM$${typ},${gi},${ph},${ng},${th},${tnu},${am},${mel}`);
                    }
                }

                if (hexData) {
                    startUpload(hexData, finalSave, doRedirect);
                } else if (finalSave) {
                    isSaving = finalSave;
                    isRedirecting = doRedirect;
                    uploadModal.style.display = 'flex';
                    document.getElementById('modal-title').innerText = isSaving ? "Saving..." : "Previewing...";
                    websocket.send("#CRES$");
                    websocket.send(isSaving ? "#CSAV$" + (isGifAnimation ? ":1" : ":0") : "#CFIN$");
                }

                if (finalSave || imageChanged) {
                    imageChanged = false;
                }
            }

            let isSaving = false; // Lệnh Lưu vào Flash
            let isRedirecting = false; // Lệnh Chuyển trang

            function startUpload(mainData, toFlash, doRedirect) {
                if (windowGifInterval) {
                    clearInterval(windowGifInterval);
                    windowGifInterval = null;
                }
                uploadModal.style.display = 'flex';
                document.getElementById('modal-title').innerText = toFlash ? "Saving..." : "Previewing...";
                isSaving = toFlash;
                isRedirecting = doRedirect;

                uploadQueue = [];
                for (let i = 0; i < mainData.length; i += 1024) uploadQueue.push("#CIMG$" + mainData.substring(i, i + 1024));

                totalPackets = uploadQueue.length;
                const params = new URLSearchParams(window.location.search);
                const idx = params.get('idx') || 0;
                websocket.send("#CSTB$" + idx); // Phase 1: Bắt đầu lưu ảnh tĩnh/metadata
            }

            let animQueue = [];
            let animPackets = 0;
            function startAnimationUpload() {
                if (!isGifAnimation || gifFramesData.length === 0) return;

                document.getElementById('modal-title').innerText = "Uploading Animation...";
                progressBar.style.width = '0%';
                progressPercent.innerText = '0%';

                const targetW = parseInt(posW.value) || 64;
                const targetH = parseInt(posH.value) || 64;
                const crop = croppr.getValue();
                let allFramesHex = "";

                const pW = 368, pH = 380; // Kích thước giao diện preview chuẩn

                gifFramesData.forEach(fr => {
                    const offCanvas = document.createElement('canvas');
                    offCanvas.width = fr.width; offCanvas.height = fr.height;
                    const offCtx = offCanvas.getContext('2d');
                    const imgDataObj = offCtx.createImageData(fr.width, fr.height);
                    imgDataObj.data.set(fr.data);
                    offCtx.putImageData(imgDataObj, 0, 0);

                    // BƯỚC THIẾU: Phải padding frame về chuẩn 368x380 giống hệt lúc tạo preview imgOrig
                    // Nếu không, tọa độ crop.x, crop.y (được đo trên imgOrig 368x380) sẽ bị áp sai lệch hoàn toàn vào khung gốc
                    let uiW, uiH;
                    if (fr.width / fr.height > pW / pH) {
                        uiW = pW; uiH = uiW * fr.height / fr.width;
                    } else {
                        uiH = pH; uiW = uiH * fr.width / fr.height;
                    }
                    const paddedCanvas = document.createElement("canvas");
                    const paddedCtx = paddedCanvas.getContext("2d");
                    paddedCanvas.width = pW; paddedCanvas.height = pH;
                    paddedCtx.translate(pW / 2, pH / 2);
                    paddedCtx.drawImage(offCanvas, -uiW / 2, -uiH / 2, uiW, uiH);

                    const finalCanvas = document.createElement('canvas');
                    finalCanvas.width = targetW; finalCanvas.height = targetH;
                    const finalCtx = finalCanvas.getContext('2d');
                    finalCtx.filter = `brightness(${brightness}%) saturate(${saturation}%) invert(${inversion}%) grayscale(${grayscale}%)`;

                    // Bây giờ sử dụng paddedCanvas để cắt, tỷ lệ sẽ trùng khớp hoàn toàn
                    finalCtx.drawImage(paddedCanvas, crop.x, crop.y, crop.width, crop.height, 0, 0, targetW, targetH);

                    const pixels = finalCtx.getImageData(0, 0, targetW, targetH).data;
                    for (let i = 0; i < pixels.length; i += 4) {
                        let r = pixels[i], g = pixels[i + 1], b = pixels[i + 2], a = pixels[i + 3];

                        // Alpha threshold
                        if (a < 32) {
                            a = 0; r = 0; g = 0; b = 0;
                        }

                        const r4 = r >> 4, g4 = g >> 4, b4 = b >> 4, a4 = a >> 4;
                        allFramesHex += byteToHex(a4 | (r4 << 4)) + byteToHex(g4 | (b4 << 4));
                    }
                });

                // Padding mỗi frame được coi là 8192 bytes nhị phân (16384 hex), ESP32 ghi theo sector 2048
                // Thực tế binary trọn gói gộp lại sẽ được ESP32 ghi tuần tự.
                animQueue = [];
                for (let i = 0; i < allFramesHex.length; i += 1024) {
                    animQueue.push("#AIMG$" + allFramesHex.substring(i, i + 1024));
                }
                animPackets = animQueue.length;
                websocket.send("#ASTB$" + currentLayer); // Lệnh bắt đầu Animation - dùng currentLayer từ DOWNLOAD_EDIT_CLOCK
            }

            function initWebSocket() {
                if (websocket && (websocket.readyState === WebSocket.CONNECTING || websocket.readyState === WebSocket.OPEN)) return;
                websocket = new WebSocket(`ws://${window.location.hostname}/ws`);
                websocket.onopen = () => {
                    connectt = 1;
                    document.getElementById('ws-status').innerText = "Connected";
                    websocket.send("#CGET$");
                    // Retry tự động nếu 3 giây chưa nhận được data
                    setTimeout(() => {
                        const ov = document.getElementById('init-overlay');
                        if (ov && ov.style.display !== 'none') {
                            console.warn('[editclock] No DOWNLOAD_EDIT_CLOCK after 3s, retrying #CGET$...');
                            if (websocket && websocket.readyState === WebSocket.OPEN) websocket.send("#CGET$");
                        }
                    }, 3000);
                };
                websocket.onclose = () => {
                    setTimeout(initWebSocket, 2000);
                    connectt = 0;
                    document.getElementById('ws-status').innerText = "Disconnected";
                };
                websocket.onmessage = (e) => {
                    const data = e.data;
                    if (data === "C_READY" || data === "C_UP_OK") {
                        if (uploadQueue.length > 0) {
                            websocket.send(uploadQueue.shift());
                            const prog = Math.round(((totalPackets - uploadQueue.length) / totalPackets) * 100);
                            progressBar.style.width = prog + '%';
                            progressPercent.innerText = prog + '%';
                        } else {
                            if (isSaving) {
                                websocket.send("#CSAV:IMG" + (isGifAnimation ? ":1" : ":0"));
                            } else {
                                websocket.send("#CFIN$");
                            }
                        }
                    } else if (data === "C_SAVEOK") {
                        if (isGifAnimation) {
                            startAnimationUpload(); // Chuyển sang Phase 2 (Animation)
                        } else {
                            if (isRedirecting) {
                                document.getElementById('modal-title').innerText = "Success!";
                                setTimeout(() => { window.location.href = '/clock.html?v=' + Date.now(); }, 1500);
                            } else {
                                uploadModal.style.display = 'none';
                            }
                        }
                    } else if (data === "A_READY" || data === "A_UP_OK") {
                        if (animQueue.length > 0) {
                            websocket.send(animQueue.shift());
                            const prog = Math.round(((animPackets - animQueue.length) / animPackets) * 100);
                            progressBar.style.width = prog + '%';
                            progressPercent.innerText = prog + '%';
                        } else {
                            websocket.send("#ASAV$"); // Kết thúc Animation
                        }
                    } else if (data === "A_SAVEOK") {
                        if (isRedirecting) {
                            document.getElementById('modal-title').innerText = "Animation Saved!";
                            setTimeout(() => { window.location.href = '/clock.html?v=' + Date.now(); }, 1500);
                        } else {
                            uploadModal.style.display = 'none';
                        }
                    } else if (data.startsWith("DOWNLOAD_EDIT_CLOCK:")) {
                        const overlay = document.getElementById('init-overlay');
                        try {
                            const p = data.split(':');
                            // p[1]=idx p[2]=tutao p[3]=checkhengio p[4]=chu_check
                            // p[5]=x p[6]=y p[7]=w p[8]=h p[9]=speed
                            // p[10]=typ p[11]=gio p[12]=phut p[13]=ngay p[14]=thang
                            // p[15]=extra p[16]=am p[17]=mel p[18]=text p[19]=qot p[20]=cnoidung
                            currentLayer = parseInt(p[1]);

                            document.getElementById('pos-x').value = p[5];
                            document.getElementById('pos-y').value = p[6];
                            document.getElementById('pos-w').value = p[7];
                            document.getElementById('pos-h').value = p[8];

                            document.getElementById('speed').value = p[9];
                            document.getElementById('speed-val').innerText = p[9];
                            document.getElementById('typ').value = p[10];
                            document.getElementById('gio').value = p[11];
                            document.getElementById('phut').value = p[12];
                            document.getElementById('ngay').value = p[13];
                            document.getElementById('thang').value = p[14];
                            document.getElementById('thu').value = p[15];
                            document.getElementById('am').value = p[16];
                            document.getElementById('mel').value = p[17];

                            if (p[18]) { const tEl = document.getElementById('text'); if (tEl) tEl.value = decodeHexText(p[18]); }
                            const qotEl = document.getElementById('quote_idx');
                            if (qotEl && p[19] !== undefined) qotEl.value = p[19];

                            // State flags
                            const tutaoFlag = p[2];
                            const chkFlag = p[3];  // checkhengio
                            const chuFlag = p[4];  // chu_check
                            const cnoidungFlag = p[20];

                            // 1. Text Section
                            const secText = document.getElementById('section-text');
                            if (secText) secText.style.display = (chuFlag !== '0') ? 'block' : 'none';
                            if (chuFlag !== '0') {
                                const manualBox = document.getElementById('manual-text-container');
                                const quoteBox = document.getElementById('quote-selection-container');
                                if (cnoidungFlag === '1') {
                                    if (manualBox) manualBox.style.display = 'block';
                                    if (quoteBox) quoteBox.style.display = 'none';
                                } else {
                                    if (manualBox) manualBox.style.display = 'none';
                                    if (quoteBox) quoteBox.style.display = 'block';
                                }
                            }

                            // 2. Alarm Section
                            const secAlarm = document.getElementById('section-alarm');
                            if (secAlarm) {
                                secAlarm.setAttribute('data-active', (chkFlag !== '0') ? '1' : '0');
                            }

                            // 3. Image Section
                            const secImg = document.getElementById('section-image');
                            const targetImg = document.getElementById('cropper-target');
                            const noImgTxt = document.getElementById('no-image-text');

                            if (tutaoFlag === '1') {
                                if (secImg) secImg.style.display = 'block';
                                if (targetImg) targetImg.style.display = 'none';
                                if (noImgTxt) noImgTxt.style.display = 'block';
                                if (croppr) { try { croppr.destroy(); } catch (e) { } croppr = null; }
                            } else {
                                if (secImg) secImg.style.display = 'none';
                            }

                            updateUI();
                            console.log('[editclock] DOWNLOAD_EDIT_CLOCK OK, idx=' + currentLayer);
                        } catch (err) {
                            console.error('[editclock] Error processing DOWNLOAD_EDIT_CLOCK:', err);
                        } finally {
                            // Luôn tắt overlay dù có lỗi hay không
                            if (overlay) overlay.style.display = 'none';
                        }
                    }
                };
            }

            window.addEventListener('load', () => {
                initWebSocket();

                document.getElementById('btn-back').onclick = () => {
                    goBackWithReferrer();
                };

                const btnSaveOnly = document.getElementById('btn-save-image-only');
                if (btnSaveOnly) {
                    btnSaveOnly.onclick = () => {
                        imageChanged = true;
                        sendImageData(true, false, true);
                    };
                }

                const btnSaveMetaOnly = document.getElementById('btn-save-meta-only');
                if (btnSaveMetaOnly) {
                    btnSaveMetaOnly.onclick = () => {
                        sendMetaData(true, false);
                    };
                }
            });
        </script>
</body>
