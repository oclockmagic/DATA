    <title>FFT CONFIG - MAGIC O'CLOCK</title>

            background-attachment: fixed;

            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: white;
        }

        .container {
            width: 100%;
            max-width: 380px;
            padding: 15px 20px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            font-weight: 300;
            font-size: 22px;
            letter-spacing: 3px;
            margin: 0 0 20px 0;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .status-tag {
            display: block;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 15px;
            text-align: right;
        }

        .section-label {
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary);
            margin: 15px 0 8px 5px;
            opacity: 0.8;
            display: block;
        }

        .custom-select {
            position: relative;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.4);
            transition: all 0.3s;
        }

        .custom-select-trigger {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 15px;
            font-size: 13px;
            color: #fff;
            cursor: pointer;
            min-height: 38px;
            box-sizing: border-box;
        }

        .custom-select-trigger img {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            margin-right: 12px;
            object-fit: contain;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .custom-options {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            background: rgba(10, 10, 30, 0.98);
            backdrop-filter: blur(20px);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: translateY(-10px);
            transition: all 0.3s;
            max-height: 300px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            margin-top: 5px;
        }

        .custom-select.open .custom-options {
            opacity: 1;
            visibility: visible;
            pointer-events: all;
            transform: translateY(0);
        }

        .custom-option {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            font-size: 12px;
            color: #ccc;
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .custom-option:hover {
            background: rgba(79, 172, 254, 0.2);
            color: #fff;
        }

        .custom-option img {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            margin-right: 12px;
            object-fit: contain;
            background: rgba(0, 0, 0, 0.3);
        }

        .arrow {
            width: 8px;
            height: 8px;
            border-right: 2px solid rgba(255, 255, 255, 0.5);
            border-bottom: 2px solid rgba(255, 255, 255, 0.5);
            transform: rotate(45deg);
            margin-bottom: 4px;
        }

        .custom-select.open .arrow {
            transform: rotate(-135deg);
            margin-bottom: -2px;
        }

        .search-box {
            width: 100%;
            padding: 10px 15px;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.03);
            border: none;
            border-bottom: 1px solid var(--glass-border);
            color: white;
            outline: none;
            font-size: 13px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .btn {
            padding: 10px 15px;
            border-radius: 12px;
            border: none;
            color: white;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.2);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn:hover {
            filter: brightness(1.2);
            transform: translateY(-2px);
        }

        .btn-primary:hover {
            box-shadow: 0 10px 20px rgba(79, 172, 254, 0.4);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 5px;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: rgba(20, 20, 20, 0.75);
            backdrop-filter: blur(20px);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            width: 280px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.6);
            color: white;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        .progress-container {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            margin: 20px 0;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #4facfe, #00f2fe);
            width: 0%;
            transition: width 0.3s;
            box-shadow: 0 0 10px rgba(79, 172, 254, 0.6);
        }

        .disabled-upload {
            opacity: 0.3;
            pointer-events: none;
            filter: grayscale(0.8);
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>SPECTRUM CONFIG</h2>

        <!-- Background Section -->
        <div
            style="margin-top: 12px; padding: 10px 15px; background: rgba(255,255,255,0.03); border-radius: 15px; border: 1px solid var(--glass-border);">
            <span
                style="font-size: 11px; font-weight: bold; color: var(--accent); display: block; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; text-align: center;">Background
            <div style="display: flex; align-items: flex-end; gap: 10px; margin-top: 4px;">
                <div class="custom-select-wrapper" id="wrap-background" style="flex: 1;">
                    <div class="custom-select" id="sel-background">
                        <span class="custom-select-trigger" style="min-height: 40px; padding: 6px 12px;">
                            <div style="display: flex; align-items: center;">
                                <img class="selected-img" src="" style="display: none;">
                                <span class="selected-text">Loading...</span>
                            </div>
                        </span>
                        <div class="custom-options">
                            <input type="text" class="search-box" placeholder="Search..." onclick="event.stopPropagation()">
                            <div class="options-container"></div>
                        </div>
                    </div>
                </div>

                <!-- Custom Image Upload -->
                <div style="display: flex; flex-direction: column; align-items: center; position: relative;">
                    <canvas id="bg-canvas" width="72" height="72"
                        style="width: 40px; height: 40px; border-radius: 8px; background-image: linear-gradient(45deg, #222 25%, transparent 25%), linear-gradient(-45deg, #222 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #222 75%), linear-gradient(-45deg, transparent 75%, #222 75%); background-size: 8px 8px; background-position: 0 0, 0 4px, 4px -4px, -4px 0px; background-color: #333; border: 1px solid var(--primary); cursor: pointer; box-shadow: 0 0 10px rgba(79, 172, 254, 0.2);"
                        onclick="document.getElementById('file-bg').click()"></canvas>
                    <svg id="bg-hint" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; top: 11px; left: 11px; pointer-events: none; filter: drop-shadow(0 0 5px var(--primary));">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>
                        <line x1="16" y1="5" x2="16" y2="11"/><line x1="13" y1="8" x2="19" y2="8"/>
                    </svg>
                    <input type="file" id="file-bg" accept="image/*" style="display: none;">
                </div>
            </div>
        </div>

        <!-- Bass Section -->
        <div
            style="margin-top: 12px; padding: 10px 15px; background: rgba(255,255,255,0.03); border-radius: 15px; border: 1px solid var(--glass-border);">
            <span
                style="font-size: 11px; font-weight: bold; color: var(--accent); display: block; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; text-align: center;">Bass
                Overlay</span>
            <div style="display: flex; align-items: flex-end; gap: 10px;">
                <div class="custom-select-wrapper" id="wrap-bass" style="flex: 1;">
                    <div class="custom-select" id="sel-bass">
                        <span class="custom-select-trigger" style="min-height: 40px; padding: 6px 12px;">
                            <div style="display: flex; align-items: center;">
                                <img class="selected-img" src="" style="display: none;">
                                <span class="selected-text">Loading...</span>
                            </div>
                        </span>
                        <div class="custom-options">
                            <input type="text" class="search-box" placeholder="Search..." onclick="event.stopPropagation()">
                            <div class="options-container"></div>
                        </div>
                    </div>
                </div>
                
                <!-- Custom Bass Image Upload -->
                <div style="display: flex; flex-direction: column; align-items: center; position: relative;">
                    <canvas id="bass-canvas" width="44" height="44"
                        style="width: 40px; height: 40px; border-radius: 8px; background-image: linear-gradient(45deg, #222 25%, transparent 25%), linear-gradient(-45deg, #222 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #222 75%), linear-gradient(-45deg, transparent 75%, #222 75%); background-size: 8px 8px; background-position: 0 0, 0 4px, 4px -4px, -4px 0px; background-color: #333; border: 1px solid var(--accent); cursor: pointer; box-shadow: 0 0 10px rgba(186, 104, 200, 0.2);"
                        onclick="document.getElementById('file-bass').click()"></canvas>
                    <svg id="bass-hint" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; top: 11px; left: 11px; pointer-events: none; filter: drop-shadow(0 0 5px var(--accent));">
                        <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
                        <line x1="14" y1="8" x2="14" y2="14"/><line x1="11" y1="11" x2="17" y2="11"/>
                    </svg>
                    <input type="file" id="file-bass" accept="image/*" style="display: none;">
                </div>
            </div>
        </div>

        <!-- Equalizer Group -->
        <div
            style="margin-top: 12px; padding: 10px 15px; background: rgba(255,255,255,0.03); border-radius: 15px; border: 1px solid var(--glass-border);">
            <span
                style="font-size: 11px; font-weight: bold; color: var(--accent); display: block; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; text-align: center;">Equalizer
                Settings</span>

            <span class="section-label" style="margin-top: 0; font-size: 10px; margin-bottom: 5px;">Bar Type</span>
            <div class="custom-select-wrapper" id="wrap-eq-type">
                <div class="custom-select" id="sel-eq-type">
                    <span class="custom-select-trigger">
                        <div style="display: flex; align-items: center;">
                            <img class="selected-img" src="" style="display: none;">
                            <span class="selected-text">Loading Types...</span>
                        </div>
                    </span>
                    <div class="custom-options">
                        <input type="text" class="search-box" placeholder="Search..." onclick="event.stopPropagation()">
                        <div class="options-container"></div>
                    </div>
                </div>
            </div>

            <span class="section-label" style="font-size: 10px; margin-bottom: 5px;">Color Theme</span>
            <div class="custom-select-wrapper" id="wrap-eq-color">
                <div class="custom-select" id="sel-eq-color">
                    <span class="custom-select-trigger">
                        <div style="display: flex; align-items: center;">
                            <img class="selected-img" src="" style="display: none;">
                            <span class="selected-text">Loading Colors...</span>
                        </div>
                    </span>
                    <div class="custom-options">
                        <input type="text" class="search-box" placeholder="Search..." onclick="event.stopPropagation()">
                        <div class="options-container"></div>
                    </div>
                </div>
            </div>

            <span class="section-label" style="font-size: 10px; margin-bottom: 5px;">Effect</span>
            <div class="custom-select-wrapper" id="wrap-eq-effect">
                <div class="custom-select" id="sel-eq-effect">
                    <span class="custom-select-trigger">
                        <div style="display: flex; align-items: center;">
                            <img class="selected-img" src="" style="display: none;">
                            <span class="selected-text">Loading Effects...</span>
                        </div>
                    </span>
                    <div class="custom-options">
                        <input type="text" class="search-box" placeholder="Search..." onclick="event.stopPropagation()">
                        <div class="options-container"></div>
                    </div>
                </div>
            </div>

            <span class="section-label" style="font-size: 10px; margin-bottom: 5px;">Peak Style</span>
            <div class="custom-select-wrapper" id="wrap-eq-peak">
                <div class="custom-select" id="sel-eq-peak">
                    <span class="custom-select-trigger">
                        <div style="display: flex; align-items: center;">
                            <img class="selected-img" src="" style="display: none;">
                            <span class="selected-text">Loading Peaks...</span>
                        </div>
                    </span>
                    <div class="custom-options">
                        <input type="text" class="search-box" placeholder="Search..." onclick="event.stopPropagation()">
                        <div class="options-container"></div>
                    </div>
                </div>
            </div>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 25px;">
            <button class="btn btn-secondary" style="flex: 1;" onclick="window.location.href='music.html'">CANCEL</button>
            <button id="btn-save-main" class="btn btn-primary" style="flex: 2;">APPLY SETTINGS</button>
        </div>
        <div class="status-tag" id="ws-status">Disconnected</div>
    </div>

    <!-- Modal HTML moved before script for better accessibility -->
    <div id="upload-modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title" style="margin: 0; font-weight: 300; letter-spacing: 1px;">Saving...</h3>
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div id="progress-percent" style="font-size: 14px; color: var(--primary);">0%</div>
        </div>
    </div>

    <script>
        const RAW_BASE = "https://raw.githubusercontent.com/oclockmagic/DATA/refs/heads/main/fft/";

        const DATA = {
            "background": ["00_none.bmp","01_zoom.bmp","02_move0.bmp","03_move1.bmp","04_none.bmp","05_zoom.bmp","06_move0.bmp","07_move1.bmp"],
            "bass": ["none.png","image.png","random.png","0.png","1.png","10.png","13.png","14.png","15.png","2.png","20.png","21.png","22.png","23.png","24.png","25.png","26.png","27.png","28.png","29.png","3.png","30.png","31.png","32.png","33.png","34.png","35.png","36.png","37.png","38.png","39.png","4.png","40.png","41.png","42.png","43.png","44.png","45.png","46.png","47.png","48.png","49.png","5.png","50.png","51.png","52.png","53.png","55.png","56.png","57.png","58.png","59.png","6.png","60.png","61.png","63.png","64.png","66.png","68.png","69.png","7.png","70.png","71.png","72.png","73.png","74.png","8.png","9.png","kk.png","ll.png"],
            "equalizer/type": ["000.png","001.png","01-cot.png","02-cot_peak_down.png","03-cot_peak_up.png","04-nhay.png","05-nhay_dac.png","06-nhay_tim.png","07-nhay_vuong.png","08-nhay_tron.png","09-chay.png","10-chay_peak_down.png","11-chay_peak_up.png","12-giua.png","13-giua_peak_down.png","14-giua_peak_up.png","15-xuong.png","16-xuong_peak_down.png","17-xuong_peak_up.png","18-vacham_cong.png","19-vacham_vuong.png","20-vacham_tron.png","21-vacham_tim.png","22-vacham_dac.png","23-vacham_ran1.png","23-vacham_random.png","24-cotdoi.png","25-cotdoi_peak_1.png","25-cotdoi_peak_2.png","25-cotdoi_peak_3.png"],
            "equalizer/color": ["000.bmp","011.bmp","012.bmp","013.bmp","014.bmp","016.bmp","017.bmp","018.bmp","019.bmp","020.bmp","021.bmp","022.bmp","023.bmp","024.bmp","025.bmp","026.bmp","027.bmp","028.bmp"],
            "equalizer/effect": ["c1.png","c2.png","c3.png"],
            "equalizer/peak": ["00.png","01.png","02.png","03.png","04.png"]
        };

        const CONFIG = [
            { id: 'sel-background', path: 'background', label: 'Background' },
            { id: 'sel-bass', path: 'bass', label: 'Bass' },
            { id: 'sel-eq-type', path: 'equalizer/type', label: 'Type' },
            { id: 'sel-eq-color', path: 'equalizer/color', label: 'Color' },
            { id: 'sel-eq-effect', path: 'equalizer/effect', label: 'Effect' },
            { id: 'sel-eq-peak', path: 'equalizer/peak', label: 'Peak' }
        ];

        const params = new URLSearchParams(window.location.search);
        const PARAM_MAP = {
            'sel-background': 'background',
            'sel-bass': 'bass',
            'sel-eq-type': 'eqtype',
            'sel-eq-color': 'eqcolor',
            'sel-eq-effect': 'eqeffect',
            'sel-eq-peak': 'eqpeak'
        };

        const state = {};

        let websocket = null;
        let hasUploadedBG = false;
        let hasUploadedBass = false;

        async function initCombobox(config) {
            const el = document.getElementById(config.id);
            if (!el) return;
            const trigger = el.querySelector('.custom-select-trigger');
            const optionsBox = el.querySelector('.options-container');
            const selectedImg = el.querySelector('.selected-img');
            const selectedText = el.querySelector('.selected-text');
            const searchInput = el.querySelector('.search-box');

            selectedText.innerText = "Loading " + config.label + "...";
            const images = DATA[config.path] || [];
            state[config.id] = images;

            trigger.onclick = (e) => {
                document.querySelectorAll('.custom-select').forEach(s => { if (s !== el) s.classList.remove('open'); });
                el.classList.toggle('open');
                if (el.classList.contains('open')) searchInput.focus();
                e.stopPropagation();
            };

            let selectedIndex = 0;
            const paramKey = PARAM_MAP[config.id];
            if (paramKey && params.has(paramKey)) {
                selectedIndex = parseInt(params.get(paramKey)) || 0;
            }

            const render = (items) => {
                optionsBox.innerHTML = '';
                if (items.length === 0) {
                    optionsBox.innerHTML = '<div class="custom-option">No results</div>';
                    return;
                }
                items.forEach((name, idx) => {
                    const imgUrl = RAW_BASE + config.path + "/" + name;
                    const displayName = name.replace(/\.[^/.]+$/, "");
                    const opt = document.createElement('div');
                    opt.className = 'custom-option';
                    opt.innerHTML = `<img src="${imgUrl}"><span>${displayName}</span>`;
                    opt.onclick = () => {
                        selectedImg.src = imgUrl;
                        selectedImg.style.display = 'block';
                        selectedText.innerText = displayName;
                        el.classList.remove('open');
                        el.setAttribute('data-index', idx);
                        if (config.id === 'sel-bass') updateBassUploadState(idx);
                    };
                    optionsBox.appendChild(opt);
                });
            };

            render(images);

            if (images.length > 0) {
                if (selectedIndex < 0 || selectedIndex >= images.length) selectedIndex = 0;
                const activeName = images[selectedIndex];
                selectedImg.src = RAW_BASE + config.path + "/" + activeName;
                selectedImg.style.display = 'block';
                selectedText.innerText = activeName.replace(/\.[^/.]+$/, "");
                el.setAttribute('data-index', selectedIndex);
            } else {
                selectedText.innerText = "No " + config.label + " files";
                selectedImg.style.display = 'none';
            }

            if (searchInput) {
                searchInput.onclick = (e) => e.stopPropagation();
                searchInput.oninput = (e) => {
                    const term = e.target.value.toLowerCase();
                    const filtered = images.filter(name => name.toLowerCase().includes(term));
                    render(filtered);
                };
            }
            if (config.id === 'sel-bass') updateBassUploadState(selectedIndex);
        }

        function updateBassUploadState(idx) {
            const canvas = document.getElementById('bass-canvas');
            const hint = document.getElementById('bass-hint');
            if (canvas && hint) {
                if (parseInt(idx) === 1) {
                    canvas.parentElement.classList.remove('disabled-upload');
                } else {
                    canvas.parentElement.classList.add('disabled-upload');
                    if (parseInt(idx) >= 2) {
                        const images = state['sel-bass'] || [];
                        if (images[idx]) {
                            const imgUrl = RAW_BASE + "bass/" + images[idx];
                            const img = new Image();
                            img.crossOrigin = "anonymous";
                            img.src = imgUrl;
                            img.onload = () => {
                                if (typeof bassCtx !== 'undefined') {
                                    bassCtx.clearRect(0, 0, 44, 44);
                                    let s, dx, dy, dw, dh;
                                    if (img.width > img.height) {
                                        s = 44 / img.height; dw = img.width * s; dh = 44;
                                        dx = (44 - dw) / 2; dy = 0;
                                    } else {
                                        s = 44 / img.width; dw = 44; dh = img.height * s;
                                        dx = 0; dy = (44 - dh) / 2;
                                    }
                                    bassCtx.drawImage(img, dx, dy, dw, dh);
                                    hint.style.display = 'none';
                                }
                            };
                        }
                    }
                }
            }
        }

        // --- BG Image Handling ---
        const bgCanvas = document.getElementById('bg-canvas');
        const bgCtx = bgCanvas.getContext('2d', { willReadFrequently: true });
        const fileBG = document.getElementById('file-bg');

        fileBG.onchange = (e) => {
            if (e.target.files.length) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const img = new Image();
                    img.src = ev.target.result;
                    img.onload = () => {
                        bgCtx.clearRect(0, 0, 72, 72);
                        let s, dx, dy, dw, dh;
                        if (img.width > img.height) {
                            s = 72 / img.height;
                            dw = img.width * s;
                            dh = 72;
                            dx = (72 - dw) / 2;
                            dy = 0;
                        } else {
                            s = 72 / img.width;
                            dw = 72;
                            dh = img.height * s;
                            dx = 0;
                            dy = (72 - dh) / 2;
                        }
                        bgCtx.drawImage(img, dx, dy, dw, dh);
                        hasUploadedBG = true;
                        document.getElementById('bg-hint').style.display = 'none';
                    }
                }
                reader.readAsDataURL(e.target.files[0]);
            }
        };

        // --- Bass Image Handling ---
        const bassCanvas = document.getElementById('bass-canvas');
        const bassCtx = bassCanvas.getContext('2d', { willReadFrequently: true });
        const fileBass = document.getElementById('file-bass');

        fileBass.onchange = (e) => {
            if (e.target.files.length) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const img = new Image();
                    img.src = ev.target.result;
                    img.onload = () => {
                        bassCtx.clearRect(0, 0, 44, 44);
                        let s, dx, dy, dw, dh;
                        if (img.width > img.height) {
                            s = 44 / img.height;
                            dw = img.width * s;
                            dh = 44;
                            dx = (44 - dw) / 2;
                            dy = 0;
                        } else {
                            s = 44 / img.width;
                            dw = 44;
                            dh = img.height * s;
                            dx = 0;
                            dy = (44 - dh) / 2;
                        }
                        bassCtx.drawImage(img, dx, dy, dw, dh);
                        hasUploadedBass = true;
                        document.getElementById('bass-hint').style.display = 'none';
                    }
                }
                reader.readAsDataURL(e.target.files[0]);
            }
        };

        function byteToHex(b) {
            const s = (b & 0xFF).toString(16);
            return s.length === 1 ? '0' + s : s;
        }

        function getRGB565Hex(canv, w, h) {
            const imgData = canv.getContext('2d').getImageData(0, 0, w, h).data;
            let hex = "";
            for (let i = 0; i < imgData.length; i += 4) {
                let r = imgData[i], g = imgData[i + 1], b = imgData[i + 2], a = imgData[i + 3];
                
                // Alpha threshold: Nếu quá mờ ( < 32/255) thì coi như trong suốt hoàn toàn
                // Tránh lỗi nhiễu biên gây nền đen khi nội suy scaling
                if (a < 32) {
                    a = 0; r = 0; g = 0; b = 0;
                }

                const r4 = r >> 4, g4 = g >> 4, b4 = b >> 4, a4 = a >> 4;
                hex += byteToHex(a4 | (r4 << 4)) + byteToHex(g4 | (b4 << 4));
            }
            return hex;
        }

        let globalPhotoHex = "";
        let hexPos = 0;
        let currentStep = ""; // "BG", "BASS"
        const CHUNK_SIZE = 512;

        function initWebSocket() {
            const statusEl = document.getElementById('ws-status');
            websocket = new WebSocket(`ws://${window.location.hostname}/ws`);
            websocket.onopen = () => statusEl.innerText = "Connected";
            websocket.onclose = () => {
                statusEl.innerText = "Disconnected";
                setTimeout(initWebSocket, 2000);
            };
            websocket.onmessage = (e) => {
                const data = e.data;
                const saveBtn = document.getElementById('btn-save-main');

                if (data === "M_READY") {
                    sendMetadata();
                } else if (data === "M_META_OK") {
                    // Bước 1: Upload Background (72x72)
                    if (hasUploadedBG) {
                        currentStep = "BG";
                        globalPhotoHex = getRGB565Hex(bgCanvas, 72, 72);
                        hexPos = 0;
                        websocket.send("#MRE1$"); // Reset pos
                    } else {
                        // Nhảy sang bước 2 if no BG
                        handleStepBG_Done();
                    }
                } else if (data === "M_RE_OK") {
                    streamNextChunk();
                } else if (data === "M_UP_OK") {
                    streamNextChunk();
                } else if (data === "M_BG_OK") {
                    handleStepBG_Done();
                } else if (data === "M_SAVEOK") {
                    document.getElementById('upload-modal').style.display = 'none';
                    if (saveBtn) {
                        saveBtn.disabled = false;
                        saveBtn.innerText = "APPLY SETTINGS";
                    }
                    window.location.href = '/music.html?v=' + Date.now();
                }
            };
        }

        function handleStepBG_Done() {
            if (hasUploadedBass) {
                currentStep = "BASS";
                globalPhotoHex = getRGB565Hex(bassCanvas, 44, 44);
                hexPos = 0;
                websocket.send("#MRE1$"); // Reset pos
            } else {
                finalizeSave();
            }
        }

        function streamNextChunk() {
            const saveBtn = document.getElementById('btn-save-main');
            if (hexPos < globalPhotoHex.length) {
                const chunk = globalPhotoHex.substring(hexPos, hexPos + CHUNK_SIZE * 2);
                const tag = (currentStep === "BASS") ? "#MGM2$" : "#MGM1$";
                websocket.send(tag + chunk);
                hexPos += CHUNK_SIZE * 2;
                const prg = Math.round((hexPos / globalPhotoHex.length) * 100);
                const safePrg = prg > 100 ? 100 : prg;
                document.getElementById('modal-title').innerText = `Uploading ${currentStep}...`;
                document.getElementById('progress-bar').style.width = safePrg + '%';
                document.getElementById('progress-percent').innerText = safePrg + '%';
            } else {
                if (currentStep === "BG") {
                    websocket.send("#MFB1$"); // Finalize BG
                } else {
                    finalizeSave();
                }
            }
        }

        function sendMetadata() {
            const idx = params.get('idx') || '0';
            const getIdx = (id) => document.getElementById(id).getAttribute('data-index') || '0';
            const bg = getIdx('sel-background');
            const bass = getIdx('sel-bass');
            const type = getIdx('sel-eq-type');
            const color = getIdx('sel-eq-color');
            const effect = getIdx('sel-eq-effect');
            const peak = getIdx('sel-eq-peak');
            websocket.send(`#MHGM$${idx},${bg},${bass},${type},${color},${effect},${peak}`);
        }

        function finalizeSave() {
            document.getElementById('modal-title').innerText = "Finalizing...";
            websocket.send("#MBUM$");
        }

        document.getElementById('btn-save-main').onclick = async () => {
            const btn = document.getElementById('btn-save-main');
            if (btn.disabled) return;
            btn.disabled = true;
            
            document.getElementById('upload-modal').style.display = 'flex';
            document.getElementById('modal-title').innerText = "Connecting...";
            document.getElementById('progress-bar').style.width = '0%';
            document.getElementById('progress-percent').innerText = '0%';

            const idx = params.get('idx') || '0';
            if (websocket && websocket.readyState === WebSocket.OPEN) {
                websocket.send("#MSTB$" + idx);
            } else {
                document.getElementById('upload-modal').style.display = 'none';
                alert("WebSocket not connected!");
                btn.disabled = false;
            }
        };

        window.onclick = (e) => {
            if (!e.target.closest('.custom-select')) {
                document.querySelectorAll('.custom-select').forEach(s => s.classList.remove('open'));
            }
        };

        initWebSocket();
        CONFIG.forEach(c => initCombobox(c));
    </script>
</body>
