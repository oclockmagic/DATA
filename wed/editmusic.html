<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFT CONFIG - MAGIC O'CLOCK</title>
    <style>
        :root {
            --primary: #4facfe;
            --accent: #00f2fe;
            --bg-dark: #06021d;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-dark);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: white;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 25px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            font-size: 20px;
            letter-spacing: 2px;
            margin: 0 0 20px 0;
            background: linear-gradient(135deg, #fff, var(--primary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .section {
            margin-bottom: 15px;
            padding: 15px;
            background: rgba(255,255,255,0.02);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        label {
            font-size: 11px;
            font-weight: 600;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            display: block;
        }

        select {
            width: 100%;
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        select:focus { border-color: var(--primary); }

        .btn-save {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .btn-save:hover { transform: translateY(-2px); box-shadow: 0 8px 15px rgba(79, 172, 254, 0.4); }
        .btn-save:disabled { opacity: 0.5; transform: none; }

        .btn-back {
            width: 100%;
            padding: 10px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.6);
            border-radius: 10px;
            cursor: pointer;
            font-size: 12px;
        }

        canvas {
            width: 72px; height: 72px;
            background: #000;
            border-radius: 8px;
            border: 1px solid var(--primary);
            display: block;
            margin: 10px auto;
            cursor: pointer;
        }

        .status { text-align: right; font-size: 11px; opacity: 0.4; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>MUSIC CONFIG</h2>

        <div class="section">
            <label>Spectrum Background</label>
            <select id="sel-bg">@@BACKGROUND_OPTIONS@@</select>
            <canvas id="bg-canvas" onclick="document.getElementById('file-bg').click()"></canvas>
            <input type="file" id="file-bg" accept="image/*" style="display: none;">
        </div>

        <div class="section">
            <label>Equalizer Style</label>
            <div style="display: flex; gap: 10px;">
                <select id="sel-type">@@TYPE_OPTIONS@@</select>
                <select id="sel-color">@@COLOR_OPTIONS@@</select>
            </div>
        </div>

        <button class="btn-save" id="btn-save">Apply Setup</button>
        <button class="btn-back" onclick="window.location.href='music.html'">Back</button>

        <div class="status" id="ws-status">Disconnected</div>
    </div>

    <script>
        let websocket;
        let isSaving = false;
        let hasUploadedImg = false;
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        function initWS() {
            websocket = new WebSocket(`ws://${location.hostname}/ws`);
            websocket.onopen = () => document.getElementById('ws-status').innerText = "Connected";
            websocket.onclose = () => setTimeout(initWS, 2000);
            websocket.onmessage = (e) => {
                if (e.data === "SAVEOK" && !hasUploadedImg) {
                    location.href = "music.html?v=" + Date.now();
                }
            };
        }
        initWS();

        document.getElementById('file-bg').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = new Image();
                img.onload = () => {
                    ctx.clearRect(0,0,72,72);
                    ctx.drawImage(img, 0, 0, 72, 72);
                    hasUploadedImg = true;
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        };

        function getRGB565() {
            const data = ctx.getImageData(0, 0, 72, 72).data;
            let hex = "";
            for (let i = 0; i < data.length; i += 4) {
                let r = data[i] >> 3, g = data[i+1] >> 2, b = data[i+2] >> 3;
                let rgb = (r << 11) | (g << 5) | b;
                hex += (rgb & 0xFF).toString(16).padStart(2, '0') + ((rgb >> 8) & 0xFF).toString(16).padStart(2, '0');
            }
            return hex.toUpperCase();
        }

        async function sendImage(hex) {
            const CHUNK = 1024; let pos = 0;
            const btn = document.getElementById('btn-save');
            websocket.onmessage = (e) => {
                if (e.data === "READY" || e.data === "UP") {
                    if (pos < hex.length) {
                        websocket.send("#GM1$" + hex.substring(pos, pos + CHUNK));
                        pos += CHUNK;
                        btn.innerText = `Up ${Math.round((pos/hex.length)*100)}%`;
                    } else {
                        btn.innerText = "Chốt lưu...";
                        websocket.onmessage = (ev) => { if(ev.data === "SAVEOK") location.href="music.html?v="+Date.now(); };
                        websocket.send("#BUM$");
                    }
                }
            };
            websocket.send("#BDM$");
        }

        document.getElementById('btn-save').onclick = () => {
            if (isSaving) return;
            isSaving = true;
            document.getElementById('btn-save').disabled = true;
            
            const idx = new URLSearchParams(location.search).get('idx') || '0';
            const bg = document.getElementById('sel-bg').value || '0';
            const type = document.getElementById('sel-type').value || '0';
            const clr = document.getElementById('sel-color').value || '0';

            websocket.onmessage = (e) => {
                if (e.data === "SAVEOK") {
                    if (hasUploadedImg) setTimeout(() => sendImage(getRGB565()), 200);
                    else location.href = "music.html?v=" + Date.now();
                }
            };
            websocket.send(`#HGM$${idx}:${bg}:0:${type}:${clr}:0:0`);
        };
    </script>
</body>
</html>
