<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFT CONFIG - MAGIC O'CLOCK</title>
    <style>
        :root {
            --primary: #4facfe;
            --accent: #00f2fe;
            --bg-dark: #06021d;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-dark);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: white;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 380px;
            padding: 20px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }

        h2 { text-align: center; font-size: 18px; letter-spacing: 2px; margin: 0 0 15px 0; background: linear-gradient(135deg, #fff, var(--primary)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; }

        .section { margin-bottom: 12px; padding: 10px; background: rgba(255,255,255,0.02); border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }

        label { font-size: 10px; font-weight: 600; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; display: block; }

        select { width: 100%; padding: 8px; background: rgba(0, 0, 0, 0.6); border: 1px solid var(--glass-border); border-radius: 8px; color: white; font-size: 13px; outline: none; }

        .btn-save { width: 100%; padding: 12px; border-radius: 10px; border: none; background: linear-gradient(135deg, #4facfe, #00f2fe); color: white; font-weight: bold; cursor: pointer; transition: all 0.3s; font-size: 13px; margin-top: 10px; }
        .btn-save:hover { transform: translateY(-1.5px); }
        .btn-save:disabled { opacity: 0.5; color: #aaa; }

        canvas { width: 72px; height: 72px; background: #000; border-radius: 6px; border: 1px solid var(--primary); display: block; margin: 8px auto; cursor: pointer; box-shadow: 0 0 10px var(--primary); }
        .status { text-align: right; font-size: 10px; opacity: 0.3; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>MUSIC CONFIG</h2>

        <div class="section">
            <label>Spectrum Background</label>
            <select id="sel-bg">@@BACKGROUND_OPTIONS@@</select>
            <canvas id="bg-canvas" onclick="document.getElementById('file-bg').click()"></canvas>
            <input type="file" id="file-bg" accept="image/*" style="display: none;">
        </div>

        <div class="section">
            <label>Equalizer Style & Theme</label>
            <div style="display: flex; gap: 8px;">
                <select id="sel-type">@@TYPE_OPTIONS@@</select>
                <select id="sel-color">@@COLOR_OPTIONS@@</select>
            </div>
            <div style="height:8px"></div>
            <label>Bass Overlay</label>
            <select id="sel-bass">@@BASS_OPTIONS@@</select>
        </div>

        <button class="btn-save" id="btn-save">Apply Settings</button>
        <button onclick="location.href='music.html'" style="width:100%; padding:8px; margin-top:10px; background:transparent; border:1px solid #444; border-radius:8px; color:#888; cursor:pointer; font-size:11px;">Cancel</button>

        <div class="status" id="ws-status">Disconnected</div>
    </div>

    <script>
        let ws;
        let isSaving = false;
        let photoHex = "";
        let hexPos = 0;
        const CHUNK_SIZE = 2048; // Truyền 2048 bytes (hex là 4096 ký tự)

        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        const btnSave = document.getElementById('btn-save');

        function initWS() {
            ws = new WebSocket(`ws://${location.hostname}/ws`);
            ws.onopen = () => { document.getElementById('ws-status').innerText = "Connected"; syncFromURL(); };
            ws.onclose = () => setTimeout(initWS, 2000);
            ws.onmessage = handleMessage;
        }

        function syncFromURL() {
            const p = new URLSearchParams(location.search);
            if(p.get('bg')) document.getElementById('sel-bg').selectedIndex = p.get('bg');
            if(p.get('eqtype')) document.getElementById('sel-type').selectedIndex = p.get('eqtype');
            if(p.get('eqcolor')) document.getElementById('sel-color').selectedIndex = p.get('eqcolor');
            if(p.get('bass')) document.getElementById('sel-bass').selectedIndex = p.get('bass');
        }

        function handleMessage(e) {
            const data = e.data;
            if (data === "M_READY") {
                sendMetadata();
            } else if (data === "M_META_OK") {
                if (photoHex) startPhotoStream();
                else finalizeSave();
            } else if (data === "M_UP_OK") {
                streamNextChunk();
            } else if (data === "M_SAVEOK") {
                btnSave.innerText = "SUCCESS!";
                setTimeout(() => location.href = "music.html", 800);
            }
        }

        function sendMetadata() {
            const p = new URLSearchParams(location.search);
            const idx = p.get('idx') || '0';
            const bg = document.getElementById('sel-bg').selectedIndex;
            const type = document.getElementById('sel-type').selectedIndex;
            const clr = document.getElementById('sel-color').selectedIndex;
            const bass = document.getElementById('sel-bass').selectedIndex;
            // M-Series Format: #MHGM$bg:bass:type:color:effect:peak
            ws.send(`#MHGM$${bg}:${bass}:${type}:${clr}:0:0:0`);
            btnSave.innerText = "Metadata sent...";
        }

        function startPhotoStream() {
            hexPos = 0;
            streamNextChunk();
        }

        function streamNextChunk() {
            if (hexPos < photoHex.length) {
                const chunk = photoHex.substring(hexPos, hexPos + CHUNK_SIZE * 2);
                ws.send("#MGM1$" + chunk);
                hexPos += CHUNK_SIZE * 2;
                const prg = Math.round((hexPos / photoHex.length) * 100);
                btnSave.innerText = `Photo: ${prg > 100 ? 100 : prg}%`;
            } else {
                finalizeSave();
            }
        }

        function finalizeSave() {
            btnSave.innerText = "Finalizing...";
            ws.send("#MBUM$");
        }

        document.getElementById('file-bg').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = new Image();
                img.onload = () => {
                    ctx.drawImage(img, 0, 0, 72, 72);
                    photoHex = getRGB565Hex();
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        };

        function getRGB565Hex() {
            const d = ctx.getImageData(0, 0, 72, 72).data;
            let hex = "";
            for (let i = 0; i < d.length; i += 4) {
                const r = d[i] >> 3, g = d[i+1] >> 2, b = d[i+2] >> 3;
                const rgb = (r << 11) | (g << 5) | b;
                hex += (rgb & 0xFF).toString(16).padStart(2, '0') + ((rgb >> 8) & 0xFF).toString(16).padStart(2, '0');
            }
            return hex.toUpperCase();
        }

        btnSave.onclick = () => {
            if (isSaving) return;
            const p = new URLSearchParams(location.search);
            const idx = p.get('idx') || '0';
            isSaving = true; btnSave.disabled = true;
            btnSave.innerText = "Connecting...";
            ws.send("#MSTB$" + idx);
        };

        initWS();
    </script>
</body>
</html>
