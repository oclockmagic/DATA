<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFT CONFIG - MAGIC O'CLOCK</title>
    <style>
        :root {
            --primary: #4facfe;
            --accent: #00f2fe;
            --bg-dark: #06021d;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-dark);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: white;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 380px;
            padding: 20px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }

        h2 { text-align: center; font-size: 18px; letter-spacing: 2px; margin: 0 0 15px 0; background: linear-gradient(135deg, #fff, var(--primary)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; }

        .section { margin-bottom: 15px; padding: 12px; background: rgba(255,255,255,0.02); border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }

        label { font-size: 10px; font-weight: 600; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; display: block; }

        select { width: 100%; padding: 8px; background: rgba(0, 0, 0, 0.6); border: 1px solid var(--glass-border); border-radius: 8px; color: white; font-size: 13px; outline: none; transition: all 0.3s; }
        select:focus { border-color: var(--primary); }

        .btn-save { width: 100%; padding: 12px; border-radius: 10px; border: none; background: linear-gradient(135deg, #4facfe, #00f2fe); color: white; font-weight: bold; cursor: pointer; transition: all 0.3s; font-size: 13px; margin-top: 10px; }
        .btn-save:hover { transform: translateY(-1.5px); }
        .btn-save:disabled { opacity: 0.5; transform: none; }

        .btn-back { width: 100%; padding: 8px; background: transparent; border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.4); border-radius: 8px; cursor: pointer; font-size: 11px; margin-top: 10px; }

        canvas { width: 72px; height: 72px; background: #000; border-radius: 6px; border: 1px solid var(--primary); display: block; margin: 8px auto; cursor: pointer; }
        .status { text-align: right; font-size: 10px; opacity: 0.3; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>FFT SETUP</h2>

        <div class="section">
            <label>Spectrum Background</label>
            <select id="sel-bg">
                @@BACKGROUND_OPTIONS@@
            </select>
            <canvas id="bg-canvas" onclick="document.getElementById('file-bg').click()"></canvas>
            <input type="file" id="file-bg" accept="image/*" style="display: none;">
        </div>

        <div class="section">
            <label>Equalizer Style & Theme</label>
            <div style="display: flex; gap: 8px;">
                <select id="sel-type">@@TYPE_OPTIONS@@</select>
                <select id="sel-color">@@COLOR_OPTIONS@@</select>
            </div>
            <div style="height:8px"></div>
            <label>Bass Overlay</label>
            <select id="sel-bass">@@BASS_OPTIONS@@</select>
        </div>

        <button class="btn-save" id="btn-save">Save & Apply</button>
        <button class="btn-back" onclick="window.location.href='music.html'">Cancel</button>

        <div class="status" id="ws-status">Disconnected</div>
    </div>

    <script>
        let websocket;
        let isSaving = false;
        let hasUploadedImg = false;
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        // Logic tự động điền thông số từ URL
        function syncFromURL() {
            const params = new URLSearchParams(window.location.search);
            const map = {
                'sel-bg': 'bg',
                'sel-type': 'eqtype',
                'sel-color': 'eqcolor',
                'sel-bass': 'bass'
            };
            for (let id in map) {
                const val = params.get(map[id]);
                const el = document.getElementById(id);
                if (val !== null && el) el.value = val;
            }
        }

        function initWS() {
            websocket = new WebSocket(`ws://${location.hostname}/ws`);
            websocket.onopen = () => {
                document.getElementById('ws-status').innerText = "Connected";
                syncFromURL(); // Chờ kết nối mới Sync để dữ liệu chuẩn nhất
            };
            websocket.onclose = () => setTimeout(initWS, 2000);
            websocket.onmessage = (e) => {
                if (e.data === "SAVEOK" && !hasUploadedImg) {
                    location.href = "music.html?v=" + Date.now();
                }
            };
        }
        initWS();

        document.getElementById('file-bg').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = new Image();
                img.onload = () => {
                    ctx.clearRect(0,0,72,72);
                    ctx.drawImage(img, 0, 0, 72, 72);
                    hasUploadedImg = true;
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        };

        function getRGB565() {
            const data = ctx.getImageData(0, 0, 72, 72).data;
            let hex = "";
            for (let i = 0; i < data.length; i += 4) {
                let r = data[i] >> 3, g = data[i+1] >> 2, b = data[i+2] >> 3;
                let rgb = (r << 11) | (g << 5) | b;
                hex += (rgb & 0xFF).toString(16).padStart(2, '0') + ((rgb >> 8) & 0xFF).toString(16).padStart(2, '0');
            }
            return hex.toUpperCase();
        }

        async function sendImage(hex) {
            const CHUNK = 1024; let pos = 0;
            const btn = document.getElementById('btn-save');
            websocket.onmessage = (e) => {
                if (e.data === "READY" || e.data === "UP") {
                    if (pos < hex.length) {
                        websocket.send("#GM1$" + hex.substring(pos, pos + CHUNK));
                        pos += CHUNK;
                        btn.innerText = `Up: ${Math.round((pos/hex.length)*100)}%`;
                    } else {
                        btn.innerText = "Finishing...";
                        websocket.onmessage = (ev) => { if(ev.data === "SAVEOK") location.href="music.html?v="+Date.now(); };
                        websocket.send("#BUM$");
                    }
                }
            };
            websocket.send("#BDM$");
        }

        document.getElementById('btn-save').onclick = () => {
            if (isSaving) return;
            isSaving = true;
            document.getElementById('btn-save').disabled = true;
            
            const params = new URLSearchParams(window.location.search);
            const idx = params.get('idx') || '0';
            const bg = document.getElementById('sel-bg').selectedIndex;
            const type = document.getElementById('sel-type').selectedIndex;
            const clr = document.getElementById('sel-color').selectedIndex;
            const bass = document.getElementById('sel-bass').selectedIndex;

            websocket.onmessage = (e) => {
                if (e.data === "SAVEOK") {
                    if (hasUploadedImg) setTimeout(() => sendImage(getRGB565()), 300);
                    else location.href = "music.html?v=" + Date.now();
                }
            };
            // Format: idx:bg:bass:type:color:effect:peak (tạm thời effect:peak = 0)
            websocket.send(`#HGM$${idx}:${bg}:${bass}:${type}:${clr}:0:0`);
        };
    </script>
</body>
</html>
