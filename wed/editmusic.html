            background-attachment: fixed;
            background-size: cover;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 380px;
            padding: 25px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            font-weight: 300;
            font-size: 20px;
            letter-spacing: 3px;
            margin: 0 0 20px 0;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .section-label {
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary);
            margin: 15px 0 8px 5px;
            opacity: 0.8;
            display: block;
        }

        .custom-select {
            position: relative;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.4);
            transition: all 0.3s;
        }

        .custom-select-trigger {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 15px;
            font-size: 13px;
            color: #fff;
            cursor: pointer;
            min-height: 44px;
            box-sizing: border-box;
        }

        .custom-select-trigger img {
            width: 30px;
            height: 30px;
            border-radius: 6px;
            margin-right: 12px;
            object-fit: contain;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .custom-options {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            background: rgba(10, 10, 30, 0.98);
            backdrop-filter: blur(20px);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: translateY(-10px);
            transition: all 0.3s;
            max-height: 300px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            margin-top: 5px;
        }

        .custom-select.open .custom-options {
            opacity: 1;
            visibility: visible;
            pointer-events: all;
            transform: translateY(0);
        }

        .custom-option {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            font-size: 12px;
            color: #ccc;
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .custom-option:hover {
            background: rgba(79, 172, 254, 0.2);
            color: #fff;
        }

        .custom-option img {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            margin-right: 12px;
            object-fit: contain;
            background: rgba(0,0,0,0.3);
        }

        .arrow {
            width: 8px;
            height: 8px;
            border-right: 2px solid rgba(255,255,255,0.5);
            border-bottom: 2px solid rgba(255,255,255,0.5);
            transform: rotate(45deg);
            margin-bottom: 4px;
        }

        .custom-select.open .arrow {
            transform: rotate(-135deg);
            margin-bottom: -2px;
        }

        .search-box {
            width: 100%;
            padding: 10px 15px;
            box-sizing: border-box;
            background: rgba(255,255,255,0.03);
            border: none;
            border-bottom: 1px solid var(--glass-border);
            color: white;
            outline: none;
            font-size: 13px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .btn-save {
            width: 100%;
            margin-top: 30px;
            padding: 12px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: white;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
            font-size: 12px;
        }

        .btn-save:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(79, 172, 254, 0.3);
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 5px; }
    </style>
</head>
<body>

    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1 style="margin: 0;">Spectrum Config</h1>
            <button class="btn-save" style="margin: 0; width: auto; padding: 8px 15px; font-size: 10px;" onclick="window.location.href='listmusic.html'">Store</button>
        </div>

        <!-- Background Section -->
        <span class="section-label">Background</span>
        <div class="custom-select-wrapper" id="wrap-background">
            <div class="custom-select" id="sel-background">
                <span class="custom-select-trigger">
                    <div style="display: flex; align-items: center;">
                        <img class="selected-img" src="" style="display: none;">
                        <span class="selected-text">Loading Backgrounds...</span>
                    </div>
                </span>
                <div class="custom-options">
                    <input type="text" class="search-box" placeholder="Search..." onclick="event.stopPropagation()">
                    <div class="options-container"></div>
                </div>
            </div>
        </div>

        <!-- Bass Section -->
        <span class="section-label">Bass Overlay</span>
        <div class="custom-select-wrapper" id="wrap-bass">
            <div class="custom-select" id="sel-bass">
                <span class="custom-select-trigger">
                    <div style="display: flex; align-items: center;">
                        <img class="selected-img" src="" style="display: none;">
                        <span class="selected-text">Loading Bass motifs...</span>
                    </div>
                </span>
                <div class="custom-options">
                    <input type="text" class="search-box" placeholder="Search..." onclick="event.stopPropagation()">
                    <div class="options-container"></div>
                </div>
            </div>
        </div>

        <!-- Equalizer Group -->
        <div style="margin-top: 20px; padding: 15px; background: rgba(255,255,255,0.03); border-radius: 15px; border: 1px solid var(--glass-border);">
            <span style="font-size: 13px; font-weight: bold; color: var(--accent); display: block; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; text-align: center;">Equalizer Settings</span>
            
            <span class="section-label" style="margin-top: 0;">Bar Type</span>
            <div class="custom-select-wrapper" id="wrap-eq-type">
                <div class="custom-select" id="sel-eq-type">
                    <span class="custom-select-trigger">
                        <div style="display: flex; align-items: center;">
                            <img class="selected-img" src="" style="display: none;">
                            <span class="selected-text">Loading Types...</span>
                        </div>
                    </span>
                    <div class="custom-options">
                        <input type="text" class="search-box" placeholder="Search..." onclick="event.stopPropagation()">
                        <div class="options-container"></div>
                    </div>
                </div>
            </div>

            <span class="section-label">Color Theme</span>
            <div class="custom-select-wrapper" id="wrap-eq-color">
                <div class="custom-select" id="sel-eq-color">
                    <span class="custom-select-trigger">
                        <div style="display: flex; align-items: center;">
                            <img class="selected-img" src="" style="display: none;">
                            <span class="selected-text">Loading Colors...</span>
                        </div>
                    </span>
                    <div class="custom-options">
                        <input type="text" class="search-box" placeholder="Search..." onclick="event.stopPropagation()">
                        <div class="options-container"></div>
                    </div>
                </div>
            </div>

            <span class="section-label">Peak Style</span>
            <div class="custom-select-wrapper" id="wrap-eq-peak">
                <div class="custom-select" id="sel-eq-peak">
                    <span class="custom-select-trigger">
                        <div style="display: flex; align-items: center;">
                            <img class="selected-img" src="" style="display: none;">
                            <span class="selected-text">Loading Peaks...</span>
                        </div>
                    </span>
                    <div class="custom-options">
                        <input type="text" class="search-box" placeholder="Search..." onclick="event.stopPropagation()">
                        <div class="options-container"></div>
                    </div>
                </div>
            </div>
        </div>

        <button class="btn-save">Apply Settings</button>
    </div>

            "equalizer/color": ["011.bmp","012.bmp","013.bmp","014.bmp","016.bmp","017.bmp","018.bmp","019.bmp","02.bmp","020.bmp","021.bmp","022.bmp","023.bmp","024.bmp","025.bmp","026.bmp","027.bmp","028.bmp"],
            "equalizer/peak": ["00.png","01.png","02.png","03.png","04.png"]
        };

        const CONFIG = [
            { id: 'sel-background', path: 'background', label: 'Background' },
            { id: 'sel-bass', path: 'bass', label: 'Bass' },
            { id: 'sel-eq-type', path: 'equalizer/type', label: 'Type' },
            { id: 'sel-eq-color', path: 'equalizer/color', label: 'Color' },
            { id: 'sel-eq-peak', path: 'equalizer/peak', label: 'Peak' }
        ];

        let state = {};

        async function initCombobox(config) {
            const el = document.getElementById(config.id);
            if (!el) return;
            const trigger = el.querySelector('.custom-select-trigger');
            const optionsBox = el.querySelector('.options-container');
            const selectedImg = el.querySelector('.selected-img');
            const selectedText = el.querySelector('.selected-text');
            const searchInput = el.querySelector('.search-box');

            // Toggle Open
            trigger.onclick = (e) => {
                document.querySelectorAll('.custom-select').forEach(s => { if(s !== el) s.classList.remove('open'); });
                el.classList.toggle('open');
                if (el.classList.contains('open')) searchInput.focus();
            };

            // Dữ liệu đã có sẵn trong đối tượng DATA
            const images = DATA[config.path] || [];
            state[config.id] = images;

            const render = (items) => {
                optionsBox.innerHTML = '';
                items.forEach(name => {
                    const imgUrl = RAW_BASE + config.path + "/" + name;
                    const displayName = name.replace(/\.[^/.]+$/, ""); 
                    const opt = document.createElement('div');
                    opt.className = 'custom-option';
                    opt.innerHTML = `<img src="${imgUrl}"><span>${displayName}</span>`;
                    opt.onclick = () => {
                        selectedImg.src = imgUrl;
                        selectedImg.style.display = 'block';
                        selectedText.innerText = displayName;
                        el.classList.remove('open');
                    };
                    optionsBox.appendChild(opt);
                });
            };

            render(images);

            // Auto select first
            if (images.length > 0) {
                const firstImgName = images[0];
                selectedImg.src = RAW_BASE + config.path + "/" + firstImgName;
                selectedImg.style.display = 'block';
                selectedText.innerText = firstImgName.replace(/\.[^/.]+$/, "");
            } else {
                selectedText.innerText = "No files found";
            }

            // Search
            searchInput.oninput = (e) => {
                const term = e.target.value.toLowerCase();
                const filtered = images.filter(name => name.toLowerCase().includes(term));
                render(filtered);
            };
        }

        // Initialize all
        CONFIG.forEach(c => initCombobox(c));

        // Global click close
        window.onclick = (e) => {
            if (!e.target.closest('.custom-select')) {
                document.querySelectorAll('.custom-select').forEach(s => s.classList.remove('open'));
            }
        };

    </script>
