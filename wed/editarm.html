    <script>
        var websocket, croppr = null, imgOrig = null, uploadQueue = [], totalPackets = 0, tutaoActive = false;
        var brightness = 100, saturation = 100, grayscale = 0, inversion = 0, activeFilter = 'brightness';
        var pct = String.fromCharCode(37);
        function byteToHex(b) { return (b & 0xff).toString(16).padStart(2, '0'); }
        function chuyendoi2(s) {
            const m = {'à':'7f','ả':'80','ã':'81','á':'82','ạ':'83','ă':'84','ằ':'85','ẳ':'86','ẵ':'87','ắ':'88','ặ':'89','â':'8a','ầ':'8b','ẩ':'8c','ẫ':'8d','ấ':'8e','ậ':'8f','đ':'90','è':'91','ẻ':'92','ẽ':'93','é':'94','ẹ':'95','ê':'96','ề':'97','ể':'98','ễ':'99','ế':'9a','ệ':'9b','ì':'9c','ỉ':'9d','ĩ':'9e','í':'9f','ị':'a0','ò':'a1','ỏ':'a2','õ':'a3','ó':'a4','ọ':'a5','ô':'a6','ồ':'a7','ổ':'a8','ỗ':'a9','ố':'aa','ộ':'ab','ơ':'ac','ờ':'ad','ở':'ae','ỡ':'af','ớ':'b0','ợ':'b1','ù':'b2','ủ':'b3','ũ':'b4','ú':'b5','ụ':'b6','ư':'b7','ừ':'b8','ử':'b9','ữ':'ba','ứ':'bb','ự':'bc','ỳ':'bd','ỷ':'be','ỹ':'bf','ý':'c0','ỵ':'c1','À':'c2','Ả':'c3','Ã':'c4','Á':'c5','Ạ':'c6','Ă':'c7','Ằ':'c8','Ẳ':'c9','Ẵ':'ca','Ắ':'cb','Ặ':'cc','Â':'cd','Ầ':'ce','Ẩ':'cf','Ẫ':'d0','Ấ':'d1','Ậ':'d2','Đ':'d3','È':'d4','Ẻ':'d5','Ẽ':'d6','É':'d7','Ẹ':'d8','Ê':'d9','Ề':'da','Ể':'db','Ễ':'dc','Ế':'dd','Ệ':'de','Ì':'df','Ỉ':'e0','Ĩ':'e1','Í':'e2','Ị':'e3','Ò':'e4','Ỏ':'e5','Õ':'e6','Ó':'e7','Ọ':'e8','Ô':'e9','Ồ':'ea','Ổ':'eb','Ỗ':'ec','Ố':'ed','Ộ':'ee','Ơ':'ef','Ờ':'f0','Ở':'f1','Ỡ':'f2','Ớ':'f3','Ợ':'f4','Ù':'f5','Ủ':'f6','Ũ':'f7','Ú':'f8','Ụ':'f9','Ư':'fa','Ừ':'fb','Ử':'fc','Ữ':'fd','Ứ':'fe','Ự':'ff'};
            let r = ""; for (let i = 0; i < s.length; i++) r += m[s[i]] || byteToHex(s[i].charCodeAt(0)); return r;
        }
        function invert_hex(h) {
            const m = {'7f':'à','80':'ả','81':'ã','82':'á','83':'ạ','84':'ă','85':'ằ','86':'ẳ','87':'ẵ','88':'ắ','89':'ặ','8a':'â','8b':'ầ','8c':'ẩ','8d':'ẫ','8e':'ấ','8f':'ậ','90':'đ','91':'è','92':'ẻ','93':'ẽ','94':'é','95':'ẹ','96':'ê','97':'ề','98':'ể','99':'ễ','9a':'ế','9b':'ệ','9c':'ì','9d':'ỉ','9e':'ĩ','9f':'í','a0':'ị','a1':'ò','a2':'ỏ','a3':'õ','a4':'ó','a5':'ọ','a6':'ô','a7':'ồ','a8':'ổ','a9':'ỗ','aa':'ố','ab':'ộ','ac':'ơ','ad':'ờ','ae':'ở','af':'ỡ','b0':'ớ','b1':'ợ','b2':'ù','b3':'ủ','b4':'ũ','b5':'ú','b6':'ụ','b7':'ư','b8':'ừ','b9':'ử','ba':'ữ','bb':'ứ','bc':'ự','bd':'ỳ','be':'ỷ','bf':'ỹ','c0':'ý','c1':'ỵ','c2':'À','c3':'Ả','c4':'Ã','c5':'Á','c6':'Ạ','c7':'Ă','c8':'Ằ','c9':'Ẳ','ca':'Ẵ','cb':'Ắ','cc':'Ặ','cd':'Â','ce':'Ầ','cf':'Ẩ','d0':'Ẫ','d1':'Ấ','d2':'Ậ','d3':'Đ','d4':'È','d4':'Ẻ','d6':'Ẽ','d7':'É','d8':'Ẹ','d9':'Ê','da':'Ề','db':'Ể','dc':'Ễ','dd':'Ế','de':'Ệ','df':'Ì','e0':'Ỉ','e1':'Ĩ','e2':'Í','e3':'Ị','e4':'Ò','e5':'Ỏ','e6':'Õ','e7':'Ó','e8':'Ọ','e9':'Ô','ea':'Ồ','eb':'Ổ','ec':'Ỗ','ed':'Ố','ee':'Ộ','ef':'Ơ','f0':'Ờ','f1':'Ở','f2':'Ỡ','f3':'Ớ','f4':'Ợ','f5':'Ù','f6':'Ủ','f7':'Ũ','f8':'Ú','f9':'Ụ','fa':'Ư','fb':'Ừ','fc':'Ử','fd':'Ữ','fe':'Ứ','ff':'Ự'};
            let r = ""; for (let i = 0; i < h.length; i += 2) { let b = h.substr(i, 2).toLowerCase(); r += m[b] || String.fromCharCode(parseInt(b, 16)); } return r;
        }
        function initWebSocket() {
            websocket = new WebSocket(`ws://${window.location.hostname}/ws`);
            websocket.onopen = () => { document.getElementById('conet').innerHTML = "CONNECTED"; };
            websocket.onmessage = (e) => {
                if (e.data === "SAVEOK") window.location.href = "/alarm.html?v=" + Date.now();
                if (e.data === "UP" && uploadQueue.length > 0) websocket.send(uploadQueue.shift());
                else if (e.data === "UP") saveAlarmSettings();
            };
        }
        function saveAlarmSettings() {
            const par = new URLSearchParams(window.location.search);
            const tx = chuyendoi2(document.getElementById('text').value);
            let c = `#HGH$${par.get('idx')||0}|${tx}|${document.querySelector('.listarm').value}|${document.querySelector('.listamlich').value}|${document.querySelector('.listthungay').value}|${document.getElementById('tgio').value}|${document.getElementById('tphut').value}|${document.getElementById('tngay').value}|${document.getElementById('tthang').value}|${document.querySelector('.listmelody').value}`;
            c += tutaoActive ? `|1|${document.getElementById('pos-x').value}|${document.getElementById('pos-y').value}|64|64` : `|0|0|0|0|0`;
            websocket.send(c);
        }
        window.onload = () => {
            initWebSocket();
            document.getElementById('text').value = invert_hex("%VALTEXT%");
            document.querySelector(".listmelody").value = "%VALMLD%";
            if ("%TUTAO_CHECK%" == "1") { tutaoActive = true; document.getElementById('tutao-section').classList.remove('hidden'); }
            document.getElementById('file-input').onchange = (e) => {
                const rd = new FileReader();
                rd.onload = (ev) => {
                    const el = document.getElementById('cropper-target'); el.src = ev.target.result; el.style.display = 'block';
                    el.onload = () => { if (croppr) croppr.destroy(); croppr = new Croppr(el, { aspectRatio: 1, startSize: [80, 80, '%%'], onUpdate: (v) => { document.getElementById('pos-x').value = Math.round(v.x); document.getElementById('pos-y').value = Math.round(v.y); } }); };
                };
                rd.readAsDataURL(e.target.files[0]);
                tutaoActive = true; document.getElementById('tutao-section').classList.remove('hidden');
            };
            document.querySelector(".luu-img").onclick = () => {
                if (tutaoActive && croppr) {
                    const cv = document.createElement('canvas'); cv.width = 64; cv.height = 64;
                    const ctx = cv.getContext('2d'); const r = croppr.getValue();
                    ctx.drawImage(imgOrig, r.x, r.y, r.width, r.height, 0, 0, 64, 64);
                    const d = ctx.getImageData(0,0,64,64).data; let o = [];
                    for(let i=0; i<d.length; i+=4) { o.push(Math.floor(d[i]/17)<<4); o.push((Math.floor(d[i+2]/17)<<4)|Math.floor(d[i+1]/17)); }
                    uploadQueue = []; for(let i=0; i<o.length; i+=512) { uploadQueue.push("#GI1$" + o.slice(i, i+512).map(b => byteToHex(b)).join('').toUpperCase()); }
                    websocket.send(uploadQueue.shift());
                } else saveAlarmSettings();
            };
        };
    </script>
</head>
<body>
    <div class="wrapper">
        <h2>EDIT ALARM</h2>
        <div id="tutao-section" class="section-glass hidden">
            <div class="preview-area"><img id="cropper-target" style="display:none;" /></div>
            <div class="row">
                <div style="flex:1"><label>X</label><input type="number" id="pos-x" value="%POS_X%"></div>
                <div style="flex:1"><label>Y</label><input type="number" id="pos-y" value="%POS_Y%"></div>
                <button class="btn" onclick="document.getElementById('file-input').click()" style="flex:2; margin-top:14px;">UPLOAD</button>
                <input type="file" id="file-input" accept="image/*" hidden>
            </div>
        </div>
        <div class="form-group %TXT_DISABLE%"><label>TITLE TEXT</label><input type="text" id='text' maxlength="255"></div>
        <div class="section-glass">
            <label>TYPE & CALENDAR</label>
            <div class="row"><select class="listarm"><option value="0" %TYP0%>Giờ - Thứ</option><option value="1" %TYP1%>Ngày - Tháng</option></select>
            <select class="listamlich"><option value="0" %AML0%>Dương</option><option value="1" %AML1%>Âm</option></select></div>
            <label>TIME & DATE</label>
            <div class="row"><input type="number" id="tgio" value="%GIO%" min="0" max="23">:<input type="number" id="tphut" value="%PHT%" min="0" max="59"></div>
            <div class="row"><input type="number" id="tngay" value="%NGA%" min="1" max="31">/<input type="number" id="tthang" value="%THA%" min="1" max="12"></div>
            <label>REPEAT</label><select class="listthungay"><option value="0" %THU0%>Cả Tuần</option><option value="1" %THU1%>Chủ Nhật</option><option value="2" %THU2%>Thứ 2</option><option value="3" %THU3%>Thứ 3</option><option value="4" %THU4%>Thứ 4</option><option value="5" %THU5%>Thứ 5</option><option value="6" %THU6%>Thứ 6</option><option value="7" %THU7%>Thứ 7</option></select>
            <label>MELODY</label><select class="listmelody">%MELODY_LIST%</select>
        </div>
        <div class="row"><button class="btn luu-img">SAVE</button><button class="btn" onclick="location.href='/alarm.html'" style="background:#555">BACK</button></div>
        <p id="conet" style="font-size:10px; text-align:center; opacity:0.5; margin-top:10px;">CONNECTING...</p>
    </div>
</body>
</html>
