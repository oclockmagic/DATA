<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0, user-scalable=no">
    <title>MAGIC O'CLOCK - EDIT ALARM</title>
    <style>
        :root {
            --primary: #4facfe;
            --secondary: #00f2fe;
            --accent: #BA68C8;
            --bg-dark: rgb(6, 2, 29);
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-dark);
            background: linear-gradient(135deg, #06021d, #1a1a2e);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: white;
            padding: 10px;
            box-sizing: border-box;
        }
        .container {
            width: 420px;
            max-width: 98vw;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 25px;
            padding: 20px;
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            font-weight: 300;
            font-size: 20px;
            letter-spacing: 2px;
            margin: 0 0 15px 0;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .section-glass {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 12px;
            margin-bottom: 15px;
        }
        .flex-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }
        .flex-column {
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        label {
            font-size: 10px;
            opacity: 0.7;
            margin-bottom: 4px;
            color: var(--secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        select, input[type="number"], input[type="text"] {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: white;
            padding: 8px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
            width: 100%;
            box-sizing: border-box;
        }
        select:focus, input:focus {
            border-color: var(--primary);
            background: rgba(255,255,255,0.1);
        }
        select option { background: #1a1a2e; color: #fff; }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }
        .btn {
            flex: 1;
            height: 38px;
            border-radius: 10px;
            border: none;
            color: white;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-save {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.3);
        }
        .btn-back {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
        }
        .btn:hover { transform: translateY(-1px); filter: brightness(1.1); }
        .btn:active { transform: scale(0.98); }

        .preview-area {
            width: 100%;
            height: 220px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid var(--glass-border);
            position: relative;
            margin-bottom: 12px;
        }
        .filter-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 10px;
        }
        .btn-filter {
            font-size: 8px;
            height: 24px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 5px;
            color: white;
            cursor: pointer;
        }
        .btn-filter.active { background: var(--primary); color: #000; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 10000;
            justify-content: center; align-items: center;
        }
        .modal-content {
            background: rgba(20, 20, 20, 0.95);
            padding: 25px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center; width: 280px;
        }
        .progress-container {
            width: 100%; height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px; margin: 15px 0;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary));
            width: 0%; transition: width 0.3s;
        }
        .hidden { display: none !important; }
        .conectt { font-size: 9px; opacity: 0.4; text-align: right; margin-top: 10px; text-transform: uppercase; }

        input[type="range"] {
            width: 100%;
            accent-color: var(--primary);
            background: transparent;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/gh/jamessouth/Croppr.js@master/dist/croppr.min.js"></script>
    <link href="https://cdn.jsdelivr.net/gh/jamessouth/Croppr.js@master/dist/croppr.min.css" rel="stylesheet">
</head>
<body>
    <div class="container" id="main-container">
        <h2>EDIT ALARM</h2>

        <div class="section-glass %TXT_DISABLE%">
            <label>Title Text</label>
            <input autocomplete="off" placeholder="Alarm name..." type="text" id='text' maxlength="255">
        </div>

        <div class="section-glass">
            <div class="flex-row">
                <div class="flex-column">
                    <label>Type</label>
                    <select class="listarm" name="arm">
                        <option value="0" %TYP0%>Hour-Weekday</option>
                        <option value="1" %TYP1%>Day-Month</option>
                        <option value="2" %TYP2%>Full Date</option>
                    </select>
                </div>
                <div class="flex-column">
                    <label>Calendar</label>
                    <select class="listamlich" name="armamlich">
                        <option value="0" %AML0%>Solar</option>
                        <option value="1" %AML1%>Lunar</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="section-glass">
            <label>Repeat Pattern</label>
            <select class="listthungay" name="armthungay">
                <option value="0" %THU0%>Everyday</option>
                <option value="1" %THU1%>Sunday</option>
                <option value="2" %THU2%>Monday</option>
                <option value="3" %THU3%>Tuesday</option>
                <option value="4" %THU4%>Wednesday</option>
                <option value="5" %THU5%>Thursday</option>
                <option value="6" %THU6%>Friday</option>
                <option value="7" %THU7%>Saturday</option>
            </select>
        </div>

        <div class="section-glass">
            <label>Time & Date</label>
            <div class="flex-row">
                <input type="number" id='tgio' value="%GIO%" min="0" max="23">
                <span>:</span>
                <input type="number" id='tphut' value="%PHT%" min="0" max="59">
                <span style="opacity:0.3">|</span>
                <input type="number" id='tngay' value="%NGA%" min="1" max="31">
                <span>/</span>
                <input type="number" id='tthang' value="%THA%" min="1" max="12">
            </div>
        </div>

        <div class="section-glass">
            <label>Melody</label>
            <select class="listmelody">
                %MELODY_LIST%
            </select>
        </div>

        <div id="tutao-section" class="hidden section-glass" style="border-color: rgba(79, 172, 254, 0.4);">
            <label>Overlay Image</label>
            <button class="btn btn-save" onclick="document.getElementById('file-input').click()" style="width:100%; height:30px; margin-bottom:10px;">
                CHANGE IMAGE
            </button>
            <input type="file" id="file-input" accept="image/*" hidden>

            <div class="preview-area" id="preview-container">
                <p style="opacity: 0.3; font-size: 12px;" id="no-image-text">No Selection</p>
                <img id="cropper-target" style="max-height: 100%; display: none;" />
            </div>

            <div class="filter-grid">
                <button class="btn-filter active" onclick="setFilter('brightness')">Bright</button>
                <button class="btn-filter" onclick="setFilter('saturation')">Satur</button>
                <button class="btn-filter" onclick="setFilter('grayscale')">Gray</button>
                <button class="btn-filter" onclick="setFilter('inversion')">Invert</button>
                <div style="grid-column: span 4;">
                    <input type="range" id="filter-slider" min="0" max="200" value="100" oninput="updateFilterLabel()">
                </div>
            </div>

            <div class="flex-row">
                <div class="flex-column"><label>X</label><input type="number" id="pos-x" value="0"></div>
                <div class="flex-column"><label>Y</label><input type="number" id="pos-y" value="0"></div>
                <div class="flex-column"><label>W</label><input type="number" id="pos-w" value="64" readonly></div>
                <div class="flex-column"><label>H</label><input type="number" id="pos-h" value="64" readonly></div>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-save luu-img">SAVE</button>
            <button class="btn btn-back">BACK</button>
        </div>

        <div class="conectt" id="conet">CONNECTING...</div>
    </div>

    <div id="upload-modal" class="modal">
        <div class="modal-content">
            <h3 style="margin:0 0 5px 0; font-size:16px;">Saving</h3>
            <p id="sync-msg" style="font-size:11px; opacity:0.6;">Syncing with device...</p>
            <div class="progress-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            <p id="progress-percent" style="font-size:13px; color:var(--primary); font-weight:bold;">0%</p>
        </div>
    </div>

    <script>
        var websocket, croppr = null, imgOrig = null, uploadQueue = [], totalPackets = 0, isSaving = false, tutaoActive = false;
        var brightness = 100, saturation = 100, grayscale = 0, inversion = 0, activeFilter = 'brightness';
        var pct = String.fromCharCode(37);

        function byteToHex(b) { return (b & 0xff).toString(16).padStart(2, '0'); }

        function chuyendoi2(s) {
            const m = {'à':'7f','ả':'80','ã':'81','á':'82','ạ':'83','ă':'84','ằ':'85','ẳ':'86','ẵ':'87','ắ':'88','ặ':'89','â':'8a','ầ':'8b','ẩ':'8c','ẫ':'8d','ấ':'8e','ậ':'8f','đ':'90','è':'91','ẻ':'92','ẽ':'93','é':'94','ẹ':'95','ê':'96','ề':'97','ể':'98','ễ':'99','ế':'9a','ệ':'9b','ì':'9c','ỉ':'9d','ĩ':'9e','í':'9f','ị':'a0','ò':'a1','ỏ':'a2','õ':'a3','ó':'a4','ọ':'a5','ô':'a6','ồ':'a7','ổ':'a8','ỗ':'a9','ố':'aa','ộ':'ab','ơ':'ac','ờ':'ad','ở':'ae','ỡ':'af','ớ':'b0','ợ':'b1','ù':'b2','ủ':'b3','ũ':'b4','ú':'b5','ụ':'b6','ư':'b7','ừ':'b8','ử':'b9','ữ':'ba','ứ':'bb','ự':'bc','ỳ':'bd','ỷ':'be','ỹ':'bf','ý':'c0','ỵ':'c1','À':'c2','Ả':'c3','Ã':'c4','Á':'c5','Ạ':'c6','Ă':'c7','Ằ':'c8','Ẳ':'c9','Ẵ':'ca','Ắ':'cb','Ặ':'cc','Â':'cd','Ầ':'ce','Ẩ':'cf','Ẫ':'d0','Ấ':'d1','Ậ':'d2','Đ':'d3','È':'d4','Ẻ':'d5','Ẽ':'d6','É':'d7','Ẹ':'d8','Ê':'d9','Ề':'da','Ể':'db','Ễ':'dc','Ế':'dd','Ệ':'de','Ì':'df','Ỉ':'e0','Ĩ':'e1','Í':'e2','Ị':'e3','Ò':'e4','Ỏ':'e5','Õ':'e6','Ó':'e7','Ọ':'e8','Ô':'e9','Ồ':'ea','Ổ':'eb','Ỗ':'ec','Ố':'ed','Ộ':'ee','Ơ':'ef','Ờ':'f0','Ở':'f1','Ỡ':'f2','Ớ':'f3','Ợ':'f4','Ù':'f5','Ủ':'f6','Ũ':'f7','Ú':'f8','Ụ':'f9','Ư':'fa','Ừ':'fb','Ử':'fc','Ữ':'fd','Ứ':'fe','Ự':'ff'};
            let r = ""; for (let i = 0; i < s.length; i++) r += m[s[i]] || byteToHex(s[i].charCodeAt(0)); return r;
        }

        function invert_hex(h) {
            const m = {'7f':'à','80':'ả','81':'ã','82':'á','83':'ạ','84':'ă','85':'ằ','86':'ẳ','87':'ẵ','88':'ắ','89':'ặ','8a':'â','8b':'ầ','8c':'ẩ','8d':'ẫ','8e':'ấ','8f':'ậ','90':'đ','91':'è','92':'ẻ','93':'ẽ','94':'é','95':'ẹ','96':'ê','97':'ề','98':'ể','99':'ễ','9a':'ế','9b':'ệ','9c':'ì','9d':'ỉ','9e':'ĩ','9f':'í','a0':'ị','a1':'ò','a2':'ỏ','a3':'õ','a4':'ó','a5':'ọ','a6':'ô','a7':'ồ','a8':'ổ','a9':'ỗ','aa':'ố','ab':'ộ','ac':'ơ','ad':'ờ','ae':'ở','af':'ỡ','b0':'ớ','b1':'ợ','b2':'ù','b3':'ủ','b4':'ũ','b5':'ú','b6':'ụ','b7':'ư','b8':'ừ','b9':'ử','ba':'ữ','bb':'ứ','bc':'ự','bd':'ỳ','be':'ỷ','bf':'ỹ','c0':'ý','c1':'ỵ','c2':'À','c3':'Ả','c4':'Ã','c5':'Á','c6':'Ạ','c7':'Ă','c8':'Ằ','c9':'Ẳ','ca':'Ẵ','cb':'Ắ','cc':'Ặ','cd':'Â','ce':'Ầ','cf':'Ẩ','d0':'Ẫ','d1':'Ấ','d2':'Ậ','d3':'Đ','d4':'È','d5':'Ẻ','d6':'Ẽ','d7':'É','d8':'Ẹ','d9':'Ê','da':'Ề','db':'Ể','dc':'Ễ','dd':'Ế','de':'Ệ','df':'Ì','e0':'Ỉ','e1':'Ĩ','e2':'Í','e3':'Ị','e4':'Ò','e5':'Ỏ','e6':'Õ','e7':'Ó','e8':'Ọ','e9':'Ô','ea':'Ồ','eb':'Ổ','ec':'Ỗ','ed':'Ố','ee':'Ộ','ef':'Ơ','f0':'Ờ','f1':'Ở','f2':'Ỡ','f3':'Ớ','f4':'Ợ','f5':'Ù','f6':'Ủ','f7':'Ũ','f8':'Ú','f9':'Ụ','fa':'Ư','fb':'Ừ','fc':'Ử','fd':'Ữ','fe':'Ứ','ff':'Ự'};
            let r = ""; for (let i = 0; i < h.length; i += 2) { let b = h.substr(i, 2).toLowerCase(); r += m[b] || String.fromCharCode(parseInt(b, 16)); } return r;
        }

        function setFilter(f) {
            activeFilter = f; document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active')); event.target.classList.add('active');
            let v = (f === 'brightness' || f === 'saturation') ? 100 : 0;
            if (f === 'brightness') v = brightness; else if (f === 'saturation') v = saturation; else if (f === 'grayscale') v = grayscale; else if (f === 'inversion') v = inversion;
            document.getElementById('filter-slider').value = v; document.getElementById('filter-slider').max = (f === 'grayscale' || f === 'inversion') ? 100 : 200;
        }

        function updateFilterLabel() {
            let v = parseInt(document.getElementById('filter-slider').value);
            if (activeFilter === 'brightness') brightness = v; else if (activeFilter === 'saturation') saturation = v; else if (activeFilter === 'grayscale') grayscale = v; else if (activeFilter === 'inversion') inversion = v;
            applyFilters();
        }

        function applyFilters() {
            const s = `brightness(${brightness}${pct}) saturate(${saturation}${pct}) grayscale(${grayscale}${pct}) invert(${inversion}${pct})`;
            const ci = document.querySelector('.croppr-image'); if (ci) ci.style.filter = s;
            const tg = document.getElementById('cropper-target'); if (tg) tg.style.filter = s;
        }

        function initWebSocket() {
            websocket = new WebSocket(`ws://${window.location.hostname}/ws`);
            websocket.onopen = () => { document.getElementById('conet').innerHTML = "CONNECTED"; };
            websocket.onclose = () => { setTimeout(initWebSocket, 2000); document.getElementById('conet').innerHTML = "CONNECTING..."; };
            websocket.onmessage = (e) => {
                if (e.data === "SAVEOK") window.location.href = "/alarm.html";
                if (e.data === "UP") {
                    if (uploadQueue.length > 0) {
                        websocket.send(uploadQueue.shift());
                        const p = Math.round(((totalPackets - uploadQueue.length) / totalPackets) * 100);
                        document.getElementById('progress-bar').style.width = p + pct;
                        document.getElementById('progress-percent').innerText = p + pct;
                    } else { document.getElementById('sync-msg').innerText = "Finishing..."; saveAlarmSettings(); }
                }
            };
        }

        function saveAlarmSettings() {
            const par = new URLSearchParams(window.location.search);
            const id = par.get('idx') || 0;
            const tx = chuyendoi2(document.getElementById('text').value);
            const ty = document.querySelector('.listarm').value;
            const am = document.querySelector('.listamlich').value;
            const th = document.querySelector('.listthungay').value;
            const gi = document.getElementById('tgio').value;
            const ph = document.getElementById('tphut').value;
            const ng = document.getElementById('tngay').value;
            const ta = document.getElementById('tthang').value;
            const me = document.querySelector('.listmelody').value;
            let c = `#HGH$${id}|${tx}|${ty}|${am}|${th}|${gi}|${ph}|${ng}|${ta}|${me}`;
            if (tutaoActive) {
                c += `|1|${document.getElementById('pos-x').value}|${document.getElementById('pos-y').value}|64|64`;
            } else { c += `|0|0|0|0|0`; }
            websocket.send(c);
        }

        function processImage() {
            if (!croppr) return;
            const cv = document.createElement('canvas'); cv.width = 64; cv.height = 64;
            const ctx = cv.getContext('2d');
            ctx.filter = `brightness(${brightness}${pct}) saturate(${saturation}${pct}) grayscale(${grayscale}${pct}) invert(${inversion}${pct})`;
            const r = croppr.getValue();
            ctx.drawImage(imgOrig, r.x, r.y, r.width, r.height, 0, 0, 64, 64);
            const d = ctx.getImageData(0, 0, 64, 64).data;
            let o = [];
            for (let i = 0; i < d.length; i += 4) {
                const r_val = Math.floor(d[i]/17);
                const g_val = Math.floor(d[i+1]/17);
                const b_val = Math.floor(d[i+2]/17);
                o.push(r_val << 4);
                o.push((b_val << 4) | g_val);
            }
            uploadQueue = [];
            for (let i = 0; i < o.length; i += 512) {
                uploadQueue.push("#GI1$" + o.slice(i, i+512).map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase());
            }
            totalPackets = uploadQueue.length;
            document.getElementById('upload-modal').style.display = 'flex';
            websocket.send(uploadQueue.shift());
        }

        window.onload = () => {
            initWebSocket();
            const par = new URLSearchParams(window.location.search);
            const id = par.get('idx');
            if (id !== null) {
                websocket.onopen = () => { document.getElementById('conet').innerHTML = "CONNECTED"; websocket.send("#ARM$" + id); };
            }
            document.querySelector(".listmelody").value = "%VALMLD%";
            document.getElementById('text').value = invert_hex("%VALTEXT%");

            if (par.get('x')) {
                tutaoActive = true;
                document.getElementById('tutao-section').classList.remove('hidden');
                document.getElementById('pos-x').value = par.get('x');
                document.getElementById('pos-y').value = par.get('y');
            }

            document.getElementById('file-input').onchange = (e) => {
                const f = e.target.files[0]; if (!f) return;
                const rd = new FileReader();
                rd.onload = (ev) => {
                    const el = document.getElementById('cropper-target');
                    el.src = ev.target.result; el.style.display = 'block';
                    document.getElementById('no-image-text').style.display = 'none';
                    el.onload = () => {
                        imgOrig = el; if (croppr) croppr.destroy();
                        croppr = new Croppr(el, { aspectRatio: 1, startSize: [80, 80, 'px'], 
                            onUpdate: (v) => { document.getElementById('pos-x').value = Math.round(v.x); document.getElementById('pos-y').value = Math.round(v.y); }
                        });
                        applyFilters();
                    };
                };
                rd.readAsDataURL(f);
                tutaoActive = true;
                document.getElementById('tutao-section').classList.remove('hidden');
            };

            document.querySelector(".luu-img").onclick = () => {
                if (isSaving) return; isSaving = true;
                if (tutaoActive && imgOrig) processImage();
                else { document.getElementById('upload-modal').style.display = 'flex'; saveAlarmSettings(); }
            };
            document.querySelector(".btn-back").onclick = () => { window.location.href = "/alarm.html"; };
        };
    </script>
</body>
</html>
