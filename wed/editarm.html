        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 11px; margin-bottom: 5px; opacity: 0.7; text-transform: uppercase; letter-spacing: 1px; }
        
        input[type="text"], input[type="number"], select {
            width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.2); color: white;
            padding: 8px 12px; border-radius: 10px; font-size: 13px; box-sizing: border-box; transition: all 0.3s;
        }
        input:focus, select:focus { border-color: #4facfe; outline: none; background: rgba(255, 255, 255, 0.1); }
        
        .row { display: flex; gap: 10px; margin-bottom: 10px; }
        .col { flex: 1; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .btn { flex: 1; height: 35px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: white; cursor: pointer; text-transform: uppercase; font-size: 11px; font-weight: 600; transition: all 0.3s; }
        .btn-save { background: rgba(79, 172, 254, 0.2); border-color: rgba(79, 172, 254, 0.4); }
        .btn:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.4); }

        .conectt { display: block; font-size: 10px; color: rgba(255, 255, 255, 0.4); margin-top: 15px; text-align: right; text-transform: uppercase; }

    <script>
        var websocket;
        var buttonconect = document.getElementById('conet');
        
        function byteToHex(byte) {
            const unsignedByte = byte & 0xff;
            return unsignedByte.toString(16).padStart(2, '0');
        }

        const luuImage = () => {
            let textValue = document.getElementById('text').value;
            let data_arm = parseInt(document.querySelector(".listarm").value);
            let data_am = parseInt(document.querySelector(".listamlich").value);
            let data_gio = parseInt(document.querySelector(".numbergio").value) || 0;
            let data_phut = parseInt(document.querySelector(".numberphut").value) || 0;
            let data_ngay = parseInt(document.querySelector(".numberngay").value) || 1;
            let data_thang = parseInt(document.querySelector(".numberthang").value) || 1;
            let data_thungay = parseInt(document.querySelector(".listthungay").value);
            let data_melody = parseInt(document.querySelector(".listmelody").value);
            
            let data_goi = "";
            data_goi += byteToHex(data_arm);
            data_goi += byteToHex(data_gio);
            data_goi += byteToHex(data_phut);
            data_goi += byteToHex(data_ngay);
            data_goi += byteToHex(data_thang);
            data_goi += byteToHex(data_thungay);
            data_goi += byteToHex(data_am);
            data_goi += byteToHex(data_melody);
            data_goi += byteToHex(textValue.length);
            
            // Note: Replace with your actual encoding if needed
            for(let i=0; i<textValue.length; i++) {
                data_goi += byteToHex(textValue.charCodeAt(i));
            }
            
            console.log("SENDING:", data_goi);
            if(websocket && websocket.readyState === 1) {
                websocket.send("#HGH$" + data_goi);
            }
        };

        const homeImage = () => { window.location.href = "/viewarm"; };

        const updateUI = () => {
            const val = document.querySelector(".listarm").value;
            const al = document.querySelector(".listamlich");
            const th = document.querySelector(".numberthang");
            const ng = document.querySelector(".numberngay");
            const gi = document.querySelector(".numbergio");
            const ph = document.querySelector(".numberphut");
            const tn = document.querySelector(".listthungay");
            const ml = document.querySelector(".listmelody");

            // Reset
            [al, th, ng, gi, ph, tn, ml].forEach(el => el.classList.remove("disable"));

            if(val == "0") { // Default/Off
                 [al, th, ng, gi, ph, tn, ml].forEach(el => el.classList.add("disable"));
            } else if(val == "1") { // Daily/Weekly
                 [al, th, ng].forEach(el => el.classList.add("disable"));
            } else if(val == "2") { // Annual
                 [gi, ph, tn].forEach(el => el.classList.add("disable"));
            } else if(val == "3") { // Date/Time once
                 [tn].forEach(el => el.classList.add("disable"));
            }
        };

        document.querySelector(".listarm").addEventListener("change", updateUI);
        document.querySelector(".luu-img").addEventListener("click", luuImage);
        document.querySelector(".home-img").addEventListener("click", homeImage);

        function initWebSocket() {
            websocket = new WebSocket(`ws://${window.location.hostname}/ws`);
            websocket.onopen = () => { buttonconect.innerHTML = "CONNECTED"; };
            websocket.onclose = () => { setTimeout(initWebSocket, 2000); buttonconect.innerHTML = "RECONNECTING..."; };
            websocket.onmessage = (evt) => { if(evt.data === "SAVEOK") window.location.href = "/viewarm"; };
        }

        window.onload = () => {
             initWebSocket();
             document.querySelector(".listmelody").value = "%MELODY_VAL%";
             updateUI();
         };
    </script>
