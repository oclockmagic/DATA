            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        .wrapper {
            width: 440px;
            max-width: 95vw;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 20px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            font-weight: 300;
            font-size: 20px;
            letter-spacing: 2px;
            margin-bottom: 12px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            color: #fff;
            text-transform: uppercase;
        }

        hr {
            border: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(186, 104, 200, 0.4), transparent);
            margin: 12px 0;
        }

        .section-glass {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 12px;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 10px;
            margin-bottom: 4px;
            opacity: 0.6;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #4facfe;
            font-weight: 600;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        .row {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            align-items: center;
        }

        .col {
            flex: 1;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            height: 36px;
            border-radius: 8px;
            border: none;
            color: white;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 10px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-save {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
        }

        .home-img {
            background: rgba(255, 255, 255, 0.1);
        }

        .preview-area {
            width: 100%%;
            height: 180px;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 10px;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 10px;
        }

        .btn-filter {
            font-size: 8px;
            height: 24px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            color: white;
        }

        .btn-filter.active { background: #4facfe; color: #000; }

        .hidden { display: none !important; }
        
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%%; height: 100%%;
            background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center;
        }
        .modal-content {
            background: #1a1a2e; padding: 20px; border-radius: 15px; text-align: center; width: 250px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/gh/jamessouth/Croppr.js@master/dist/croppr.min.js"></script>
    <link href="https://cdn.jsdelivr.net/gh/jamessouth/Croppr.js@master/dist/croppr.min.css" rel="stylesheet">
</head>

<body>
    <div class="wrapper">
        <h2>EDIT ALARM</h2>
        <hr>

        <div id="tutao-section" class="section-glass hidden">
            <label>IMAGE EDITOR</label>
            <div class="preview-area">
                <p id="no-image-text" style="opacity:0.3; font-size:11px;">Select Image</p>
                <img id="cropper-target" style="max-height: 100%%; display: none;" />
            </div>
            
            <div class="filter-grid">
                <button class="btn-filter active" onclick="setFilter('brightness')">Bright</button>
                <button class="btn-filter" onclick="setFilter('saturation')">Satur</button>
                <button class="btn-filter" onclick="setFilter('grayscale')">Gray</button>
                <button class="btn-filter" onclick="setFilter('inversion')">Invert</button>
                <div style="grid-column: span 4; margin-top:5px;">
                    <input type="range" id="filter-slider" min="0" max="200" value="100" oninput="updateFilterLabel()" style="width:100%%;">
                </div>
            </div>

            <div class="row">
                <div class="col"><label>X</label><input type="number" id="pos-x" value="%POS_X%"></div>
                <div class="col"><label>Y</label><input type="number" id="pos-y" value="%POS_Y%"></div>
                <button class="btn" onclick="document.getElementById('file-input').click()" style="background:#BA68C8; margin-top:14px; flex:2;">UPLOAD</button>
                <input type="file" id="file-input" accept="image/*" hidden>
            </div>
        </div>

        <div class="form-group %TXT_DISABLE%">
            <label>TEXT VIEW</label>
            <input autocomplete="off" placeholder="Message content" type="text" id='text' maxlength="255">
        </div>

        <div class="form-group">
            <label>TYPE & CALENDAR</label>
            <div class="row">
                <select class="listarm" name="arm">
                    <option value="0" %TYP0%>Theo Giờ - Thứ ngày</option>
                    <option value="1" %TYP1%>Theo Ngày - Tháng</option>
                    <option value="2" %TYP2%>Theo Giờ - Ngày Tháng</option>
                </select>
                <select class="listamlich" name="armamlich">
                    <option value="0" %AML0%>Dương lịch</option>
                    <option value="1" %AML1%>Âm lịch</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>DAYS & REPEAT</label>
            <select class="listthungay" name="armthungay">
                <option value="0" %THU0%>Cả Tuần</option>
                <option value="1" %THU1%>Chủ Nhật</option>
                <option value="2" %THU2%>Thứ 2</option>
                <option value="3" %THU3%>Thứ 3</option>
                <option value="4" %THU4%>Thứ 4</option>
                <option value="5" %THU5%>Thứ 5</option>
                <option value="6" %THU6%>Thứ 6</option>
                <option value="7" %THU7%>Thứ 7</option>
            </select>
        </div>

        <div class="form-group">
            <label>TIME & DATE</label>
            <div class="row">
                <input class="col" type="number" id='tgio' value="%GIO%" min="0" max="23">
                <span>:</span>
                <input class="col" type="number" id='tphut' value="%PHT%" min="0" max="59">
                <span style="opacity:0.2">|</span>
                <input class="col" type="number" id='tngay' value="%NGA%" min="1" max="31">
                <span>/</span>
                <input class="col" type="number" id='tthang' value="%THA%" min="1" max="12">
            </div>
        </div>

        <div class="form-group">
            <label>MELODY</label>
            <select class="listmelody">
                %MELODY_LIST%
            </select>
        </div>

        <div class="btn-group">
            <button class="btn btn-save luu-img">SAVE</button>
            <button class="btn home-img">BACK</button>
        </div>

        <label class="conectt" id="conet">STATUS: CONNECTING...</label>
    </div>

    <div id="upload-modal" class="modal">
        <div class="modal-content">
            <h3>Saving...</h3>
            <div style="height:8px; background:rgba(255,255,255,0.1); border-radius:4px; overflow:hidden; margin:15px 0;">
                <div id="progress-bar" style="height:100%%; width:0%%; background:#4facfe; transition:0.3s;"></div>
            </div>
            <p id="progress-percent">0%%</p>
        </div>
    </div>

    <script>
        var websocket, croppr = null, imgOrig = null, uploadQueue = [], totalPackets = 0, tutaoActive = false;
        var brightness = 100, saturation = 100, grayscale = 0, inversion = 0, activeFilter = 'brightness';
        var pct = String.fromCharCode(37);

        function byteToHex(b) { return (b & 0xff).toString(16).padStart(2, '0'); }

        function chuyendoi2(s) {

            let r = ""; for (let i = 0; i < s.length; i++) r += m[s[i]] || byteToHex(s[i].charCodeAt(0)); return r;
        }

        function invert_hex(h) {
            const m = {'7f':'à','80':'ả','81':'ã','82':'á','83':'ạ','84':'ă','85':'ằ','86':'ẳ','87':'ẵ','88':'ắ','89':'ặ','8a':'â','8b':'ầ','8c':'ẩ','8d':'ẫ','8e':'ấ','8f':'ậ','90':'đ','91':'è','92':'ẻ','93':'ẽ','94':'é','95':'ẹ','96':'ê','97':'ề','98':'ể','99':'ễ','9a':'ế','9b':'ệ','9c':'ì','9d':'ỉ','9e':'ĩ','9f':'í','a0':'ị','a1':'ò','a2':'ỏ','a3':'õ','a4':'ó','a5':'ọ','a6':'ô','a7':'ồ','a8':'ổ','a9':'ỗ','aa':'ố','ab':'ộ','ac':'ơ','ad':'ờ','ae':'ở','af':'ỡ','b0':'ớ','b1':'ợ','b2':'ù','b3':'ủ','b4':'ũ','b5':'ú','b6':'ụ','b7':'ư','b8':'ừ','b9':'ử','ba':'ữ','bb':'ứ','bc':'ự','bd':'ỳ','be':'ỷ','bf':'ỹ','c0':'ý','c1':'ỵ','c2':'À','c3':'Ả','c4':'Ã','c5':'Á','c6':'Ạ','c7':'Ă','c8':'Ằ','c9':'Ẳ','ca':'Ẵ','cb':'Ắ','cc':'Ặ','cd':'Â','ce':'Ầ','cf':'Ẩ','d0':'Ẫ','d1':'Ấ','d2':'Ậ','d3':'Đ','d4':'È','d5':'Ẻ','d6':'Ẽ','d7':'É','d8':'Ẹ','d9':'Ê','da':'Ề','db':'Ể','dc':'Ễ','dd':'Ế','de':'Ệ','df':'Ì','e0':'Ỉ','e1':'Ĩ','e2':'Í','e3':'Ị','e4':'Ò','e5':'Ỏ','e6':'Õ','e7':'Ó','e8':'Ọ','e9':'Ô','ea':'Ồ','eb':'Ổ','ec':'Ỗ','ed':'Ố','ee':'Ộ','ef':'Ơ','f0':'Ờ','f1':'Ở','f2':'Ỡ','f3':'Ớ','f4':'Ợ','f5':'Ù','f6':'Ủ','f7':'Ũ','f8':'Ú','f9':'Ụ','fa':'Ư','fb':'Ừ','fc':'Ử','fd':'Ữ','fe':'Ứ','ff':'Ự'};
            let r = ""; for (let i = 0; i < h.length; i += 2) { let b = h.substr(i, 2).toLowerCase(); r += m[b] || String.fromCharCode(parseInt(b, 16)); } return r;
        }

        function setFilter(f) {
            activeFilter = f; document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active')); event.target.classList.add('active');
            let v = (f === 'brightness' || f === 'saturation') ? 100 : 0;
            if (f === 'brightness') v = brightness; else if (f === 'saturation') v = saturation; else if (f === 'grayscale') v = grayscale; else if (f === 'inversion') v = inversion;
            document.getElementById('filter-slider').value = v; document.getElementById('filter-slider').max = (f === 'grayscale' || f === 'inversion') ? 100 : 200;
        }

        function updateFilterLabel() {
            let v = parseInt(document.getElementById('filter-slider').value);
            if (activeFilter === 'brightness') brightness = v; else if (activeFilter === 'saturation') saturation = v; else if (activeFilter === 'grayscale') grayscale = v; else if (activeFilter === 'inversion') inversion = v;
            const s = `brightness(${brightness}${pct}) saturate(${saturation}${pct}) grayscale(${grayscale}${pct}) invert(${inversion}${pct})`;
            document.querySelectorAll('.croppr-image, #cropper-target').forEach(el => el.style.filter = s);
        }

        function initWebSocket() {
            websocket = new WebSocket(`ws://${window.location.hostname}/ws`);
            websocket.onopen = () => { document.getElementById('conet').innerHTML = "STATUS: CONNECTED"; };
            websocket.onclose = () => { setTimeout(initWebSocket, 2000); document.getElementById('conet').innerHTML = "STATUS: RECONNECTING..."; };
            websocket.onmessage = (e) => {
                if (e.data === "SAVEOK") window.location.href = "/alarm.html?v=" + Date.now();
                if (e.data === "UP") {
                    if (uploadQueue.length > 0) {
                        websocket.send(uploadQueue.shift());
                        const p = Math.round(((totalPackets - uploadQueue.length) / totalPackets) * 100);
                        document.getElementById('progress-bar').style.width = p + pct;
                        document.getElementById('progress-percent').innerText = p + pct;
                    } else saveAlarmSettings();
                }
            };
        }

        function saveAlarmSettings() {
            const par = new URLSearchParams(window.location.search);
            const id = par.get('idx') || 0;
            const tx = chuyendoi2(document.getElementById('text').value);
            const ty = document.querySelector('.listarm').value;
            const am = document.querySelector('.listamlich').value;
            const th = document.querySelector('.listthungay').value;
            const gi = document.getElementById('tgio').value;
            const ph = document.getElementById('tphut').value;
            const ng = document.getElementById('tngay').value;
            const ta = document.getElementById('tthang').value;
            const me = document.querySelector('.listmelody').value;
            let c = `#HGH$${id}|${tx}|${ty}|${am}|${th}|${gi}|${ph}|${ng}|${ta}|${me}`;
            c += tutaoActive ? `|1|${document.getElementById('pos-x').value}|${document.getElementById('pos-y').value}|64|64` : `|0|0|0|0|0`;
            websocket.send(c);
        }

        function processImage() {
            if (!croppr) return;
            const cv = document.createElement('canvas'); cv.width = 64; cv.height = 64;
            const ctx = cv.getContext('2d');
            ctx.filter = `brightness(${brightness}${pct}) saturate(${saturation}${pct}) grayscale(${grayscale}${pct}) invert(${inversion}${pct})`;
            const r = croppr.getValue();
            ctx.drawImage(imgOrig, r.x, r.y, r.width, r.height, 0, 0, 64, 64);
            const d = ctx.getImageData(0, 0, 64, 64).data;
            let o = [];
            for (let i = 0; i < d.length; i += 4) {
                o.push(Math.floor(d[i]/17) << 4);
                o.push((Math.floor(d[i+2]/17) << 4) | Math.floor(d[i+1]/17));
            }
            uploadQueue = [];
            for (let i = 0; i < o.length; i += 512) {
                uploadQueue.push("#GI1$" + o.slice(i, i+512).map(b => byteToHex(b)).join('').toUpperCase());
            }
            totalPackets = uploadQueue.length;
            document.getElementById('upload-modal').style.display = 'flex';
            websocket.send(uploadQueue.shift());
        }

        window.onload = () => {
            initWebSocket();
            document.querySelector(".listmelody").value = "%VALMLD%";
            document.getElementById('text').value = invert_hex("%VALTEXT%");
            
            if ("%TUTAO_CHECK%" == "1") {
                tutaoActive = true;
                document.getElementById('tutao-section').classList.remove('hidden');
            }

            document.getElementById('file-input').onchange = (e) => {
                const rd = new FileReader();
                rd.onload = (ev) => {
                    const el = document.getElementById('cropper-target');
                    el.src = ev.target.result; el.style.display = 'block';
                    document.getElementById('no-image-text').style.display = 'none';
                    el.onload = () => {
                        imgOrig = el; if (croppr) croppr.destroy();
                        croppr = new Croppr(el, { aspectRatio: 1, startSize: [80, 80, 'px'], 
                            onUpdate: (v) => { document.getElementById('pos-x').value = Math.round(v.x); document.getElementById('pos-y').value = Math.round(v.y); }
                        });
                        updateFilterLabel();
                    };
                };
                rd.readAsDataURL(e.target.files[0]);
                tutaoActive = true;
                document.getElementById('tutao-section').classList.remove('hidden');
            };

            document.querySelector(".luu-img").onclick = () => {
                if (tutaoActive && imgOrig) processImage();
                else { document.getElementById('upload-modal').style.display = 'flex'; saveAlarmSettings(); }
            };
            document.querySelector(".home-img").onclick = () => { window.location.href = "/alarm.html"; };
        };
    </script>
</body>

</html>
