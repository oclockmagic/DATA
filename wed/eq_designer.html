    <style>
        :root {
            --primary: #4facfe;
            --secondary: #00f2fe;
            --accent: #BA68C8;
            --bg-dark: rgb(6, 2, 29);
            --glass: rgba(15, 23, 42, 0.2);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f3f4f6;
            --text-dim: #9ca3af;
            --font-main: 'Outfit', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;

            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: cover;
            font-family: var(--font-main);
            color: white;
            padding: 12px;
            box-sizing: border-box;
        }

        .container {
            width: 460px;
            max-width: 95vw;
            background: var(--glass);
            border-radius: 28px;
            padding: 20px 14px;
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        h2 {
            text-align: center;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 1.5px;
            margin: 0;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        /* Canvas Wrap */
        .canvas-container {
            position: relative;
            width: 100%;
            height: 240px;
            background-color: rgba(0, 0, 0, 0.45);
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            overflow: hidden;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Bands Table */
        .table-container {
            overflow-x: auto;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.2);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 11px;
        }

        th {
            background-color: rgba(255, 255, 255, 0.03);
            color: var(--text-dim);
            font-weight: 600;
            padding: 8px 10px;
            border-bottom: 1px solid var(--glass-border);
            text-transform: uppercase;
            font-size: 9px;
            letter-spacing: 0.5px;
        }

        td {
            padding: 6px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .band-color-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
            vertical-align: middle;
            box-shadow: 0 0 6px currentColor;
        }

        .band-row.selected {
            background-color: rgba(186, 104, 200, 0.08);
        }

        .band-row.selected td {
            border-color: rgba(186, 104, 200, 0.2);
        }

        input[type="number"] {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            color: #fff;
            padding: 4px 6px;
            width: 55px;
            font-family: var(--font-mono);
            font-size: 11px;
            outline: none;
            transition: border-color 0.2s;
            text-align: center;
        }

        input[type="number"]:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.1);
        }

        select {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            color: #fff;
            padding: 4px 6px;
            font-family: var(--font-main);
            font-size: 11px;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.1);
        }

        option {
            background: rgb(20, 20, 20);
            color: white;
        }

        /* Tabs and Profile controls */
        .tabs-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .profile-tabs {
            display: flex;
            gap: 4px;
            background-color: rgba(0, 0, 0, 0.3);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            padding: 5px 10px;
            border-radius: 6px;
            font-family: var(--font-main);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            color: #fff;
            background-color: rgba(255, 255, 255, 0.05);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: #fff;
        }

        .preset-container {
            display: flex;
            gap: 8px;
            align-items: center;
            background: rgba(0, 0, 0, 0.25);
            padding: 8px 12px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
        }

        .preset-container select {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: #fff;
            padding: 6px 8px;
            font-family: var(--font-main);
            font-size: 11px;
            outline: none;
            cursor: pointer;
            transition: all 0.2s;
            max-width: 180px;
        }

        .preset-container select:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.1);
        }

        .set-btn {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-family: var(--font-main);
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(0, 242, 254, 0.25);
        }

        .set-btn:hover:not(:disabled) {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        .set-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .set-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            box-shadow: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .preamp-container {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.25);
            padding: 10px 14px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            font-size: 12px;
            box-sizing: border-box;
            width: 100%;
        }

        .preamp-label {
            min-width: 95px;
            color: var(--text-dim);
            font-weight: 500;
        }

        .preamp-label strong {
            color: var(--primary);
            font-family: var(--font-mono);
            font-size: 13px;
        }

        .preamp-slider {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            outline: none;
            accent-color: var(--primary);
            cursor: pointer;
        }
    
        /* Smart Features Container (Smart Bass & DRC) */
        .smart-features-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            width: 100%;
            box-sizing: border-box;
            margin-top: 4px;
        }

        @media (max-width: 600px) {
            .smart-features-container {
                grid-template-columns: 1fr;
            }
        }

        .smart-card {
            background: rgba(0, 0, 0, 0.25);
            padding: 12px 16px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-sizing: border-box;
        }

        .smart-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .smart-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .smart-control-row {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 4px;
        }

        .smart-slider {
            flex: 1;
            height: 5px;
            border-radius: 3px;
            background: var(--bg-card);
            outline: none;
            -webkit-appearance: none;
        }

        .smart-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            border: 2px solid #fff;
        }

        /* Toggle switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 34px;
            height: 20px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider-round {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.15);
            transition: .3s;
            border-radius: 20px;
        }

        .slider-round:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider-round {
            background-color: var(--primary);
        }

        input:checked + .slider-round:before {
            transform: translateX(14px);
        }
    </style>
</head>

<body>

    <!-- Overlay nạp cấu hình từ thiết bị -->
    <div id="eqSyncOverlay"
        style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:9999;display:flex;justify-content:center;align-items:center;color:#fff;font-family:sans-serif;font-size:18px;font-weight:500;backdrop-filter:blur(2px);transition:opacity 0.3s ease;">
        <div
            style="background:#1e293b;padding:24px 40px;border-radius:12px;box-shadow:0 10px 25px -5px rgba(0,0,0,0.3);border:1px solid #334155;text-align:center;">
            <div

            logLine.className = `log-line ${type}`;

        // --- Biquad Calculations (Bristow-Johnson Cookbook) ---
        const TWO_PI = 2 * Math.PI;
        const FS = 96000;

        function designBiquad(type, f0, Q, gainDb, fs) {
            const A = Math.pow(10, gainDb / 40);
            const w0 = TWO_PI * f0 / fs;
            const cosW0 = Math.cos(w0);
            const sinW0 = Math.sin(w0);
            let b0 = 1, b1 = 0, b2 = 0;
            let a0 = 1, a1 = 0, a2 = 0;

            if (Q < 0.001) Q = 0.001;
            let alpha;

            switch (type) {
                case 0: // Peaking
                    alpha = sinW0 / (2 * Q);
                    b0 = 1 + alpha * A;
                    b1 = -2 * cosW0;
                    b2 = 1 - alpha * A;
                    a0 = 1 + alpha / A;
                    a1 = -2 * cosW0;
                    a2 = 1 - alpha / A;
                    break;

                case 1: { // Low Shelf
                    alpha = sinW0 / 2 * Math.sqrt((A + 1 / A) * (1 / Q - 1) + 2);
                    const sqrtA = Math.sqrt(A);
                    const twoSqrtAAlpha = 2 * sqrtA * alpha;
                    b0 = A * ((A + 1) - (A - 1) * cosW0 + twoSqrtAAlpha);
                    b1 = 2 * A * ((A - 1) - (A + 1) * cosW0);
                    b2 = A * ((A + 1) - (A - 1) * cosW0 - twoSqrtAAlpha);
                    a0 = (A + 1) + (A - 1) * cosW0 + twoSqrtAAlpha;
                    a1 = -2 * ((A - 1) + (A + 1) * cosW0);
                    a2 = (A + 1) + (A - 1) * cosW0 - twoSqrtAAlpha;
                    break;
                }

                case 2: { // High Shelf
                    alpha = sinW0 / 2 * Math.sqrt((A + 1 / A) * (1 / Q - 1) + 2);
                    const sqrtA = Math.sqrt(A);
                    const twoSqrtAAlpha = 2 * sqrtA * alpha;
                    b0 = A * ((A + 1) + (A - 1) * cosW0 + twoSqrtAAlpha);
                    b1 = -2 * A * ((A - 1) + (A + 1) * cosW0);
                    b2 = A * ((A + 1) + (A - 1) * cosW0 - twoSqrtAAlpha);
                    a0 = (A + 1) - (A - 1) * cosW0 + twoSqrtAAlpha;
                    a1 = 2 * ((A - 1) - (A + 1) * cosW0);
                    a2 = (A + 1) - (A - 1) * cosW0 - twoSqrtAAlpha;
                    break;
                }

                case 3: // Low Pass
                    alpha = sinW0 / (2 * Q);
                    b0 = (1 - cosW0) / 2;
                    b1 = 1 - cosW0;
                    b2 = (1 - cosW0) / 2;
                    a0 = 1 + alpha;
                    a1 = -2 * cosW0;
                    a2 = 1 - alpha;
                    break;

                case 4: // High Pass
                    alpha = sinW0 / (2 * Q);
                    b0 = (1 + cosW0) / 2;
                    b1 = -(1 + cosW0);
                    b2 = (1 + cosW0) / 2;
                    a0 = 1 + alpha;
                    a1 = -2 * cosW0;
                    a2 = 1 - alpha;
                    break;

                case 5: // Band Pass
                    alpha = sinW0 / (2 * Q);
                    b0 = alpha;
                    b1 = 0;
                    b2 = -alpha;
                    a0 = 1 + alpha;
                    a1 = -2 * cosW0;
                    a2 = 1 - alpha;
                    break;

                case 6: // Notch
                    alpha = sinW0 / (2 * Q);
                    b0 = 1;
                    b1 = -2 * cosW0;
                    b2 = 1;
                    a0 = 1 + alpha;
                    a1 = -2 * cosW0;
                    a2 = 1 - alpha;
                    break;

                default: // Passthrough
                    return { b0: 1, b1: 0, b2: 0, a1: 0, a2: 0 };
            }

            const invA0 = 1 / a0;
            return {
                b0: b0 * invA0,
                b1: b1 * invA0,
                b2: b2 * invA0,
                a1: a1 * invA0,
                a2: a2 * invA0
            };
        }

        function biquadMagnitudeDb(coeffs, freq, fs) {
            const w = TWO_PI * freq / fs;
            const cosW = Math.cos(w);
            const cos2W = Math.cos(2 * w);
            const sinW = Math.sin(w);
            const sin2W = Math.sin(2 * w);

            const numReal = coeffs.b0 + coeffs.b1 * cosW + coeffs.b2 * cos2W;
            const numImag = -(coeffs.b1 * sinW + coeffs.b2 * sin2W);
            const denReal = 1 + coeffs.a1 * cosW + coeffs.a2 * cos2W;
            const denImag = -(coeffs.a1 * sinW + coeffs.a2 * sin2W);

            const numMagSq = numReal * numReal + numImag * numImag;
            const denMagSq = denReal * denReal + denImag * denImag;

            if (denMagSq < 1e-20) return 0;
            return 10 * Math.log10(numMagSq / denMagSq);
        }

        function computeCombinedResponse(freqs) {
            const combined = new Float32Array(freqs.length);
            const biquads = bands.map(b => designBiquad(b.type, b.freq, b.q, b.gain, FS));

            for (let f = 0; f < freqs.length; f++) {
                let sumDb = 0;
                for (let b = 0; b < biquads.length; b++) {
                    sumDb += biquadMagnitudeDb(biquads[b], freqs[f], FS);
                }
                combined[f] = sumDb;
            }
            return combined;
        }

        function computeSingleBandResponse(band, freqs) {
            const curve = new Float32Array(freqs.length);
            const coeff = designBiquad(band.type, band.freq, band.q, band.gain, FS);
            for (let f = 0; f < freqs.length; f++) {
                curve[f] = biquadMagnitudeDb(coeff, freqs[f], FS);
            }
            return curve;
        }

        const NUM_POINTS = 512;
        const FREQS = new Float32Array(NUM_POINTS);
        for (let i = 0; i < NUM_POINTS; i++) {
            FREQS[i] = 20 * Math.pow(1000, i / (NUM_POINTS - 1));
        }

        // --- Canvas Graph & Interaction ---
        const canvas = document.getElementById('eqCanvas');
        const ctx = canvas.getContext('2d');
        const pad = { left: 55, right: 20, top: 20, bottom: 35 };

        let selectedBand = -1;
        let hoverBand = -1;
        let dragBand = -1;
        let isDragging = false;

        const FREQ_MIN = 20;
        const FREQ_MAX = 20000;
        const DB_MIN = -24;
        const DB_MAX = 24;

        function getGraphMetrics() {
            const dpr = window.devicePixelRatio || 1;
            const w = canvas.width / dpr;
            const h = canvas.height / dpr;
            return {
                w, h,
                gx: pad.left,
                gy: pad.top,
                gw: w - pad.left - pad.right,
                gh: h - pad.top - pad.bottom
            };
        }

        function freqToX(freq, metrics) {
            const logMin = Math.log10(FREQ_MIN);
            const logMax = Math.log10(FREQ_MAX);
            return metrics.gx + (Math.log10(freq) - logMin) / (logMax - logMin) * metrics.gw;
        }

        function xToFreq(x, metrics) {
            const logMin = Math.log10(FREQ_MIN);
            const logMax = Math.log10(FREQ_MAX);
            const t = (x - metrics.gx) / metrics.gw;
            return Math.pow(10, logMin + t * (logMax - logMin));
        }

        function dbToY(db, metrics) {
            return metrics.gy + (1 - (db - DB_MIN) / (DB_MAX - DB_MIN)) * metrics.gh;
        }

        function yToDb(y, metrics) {
            return DB_MAX - (y - metrics.gy) / metrics.gh * (DB_MAX - DB_MIN);
        }

        function drawGraph() {
            const dpr = window.devicePixelRatio || 1;
            const metrics = getGraphMetrics();

            ctx.save();
            ctx.clearRect(0, 0, metrics.w, metrics.h);

            // Background
            ctx.fillStyle = '#0d111d';
            ctx.fillRect(0, 0, metrics.w, metrics.h);

            // Grid Lines & Labels
            const FREQ_MARKERS = [20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000];
            const FREQ_LABELS = ['20', '50', '100', '200', '500', '1k', '2k', '5k', '10k', '20k'];
            const DB_MARKERS = [-24, -18, -12, -6, 0, 6, 12, 18, 24];

            ctx.font = '11px "Outfit", sans-serif';
            ctx.lineWidth = 1;

            // Freq grid
            for (let i = 0; i < FREQ_MARKERS.length; i++) {
                const x = freqToX(FREQ_MARKERS[i], metrics);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
                ctx.beginPath();
                ctx.moveTo(x, metrics.gy);
                ctx.lineTo(x, metrics.gy + metrics.gh);
                ctx.stroke();

                ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
                ctx.textAlign = 'center';
                ctx.fillText(FREQ_LABELS[i], x, metrics.gy + metrics.gh + 18);
            }

            // dB grid
            for (const db of DB_MARKERS) {
                const y = dbToY(db, metrics);
                ctx.strokeStyle = db === 0 ? 'rgba(16, 185, 129, 0.25)' : 'rgba(255, 255, 255, 0.05)';
                ctx.lineWidth = db === 0 ? 1.5 : 1;
                ctx.beginPath();
                ctx.moveTo(metrics.gx, y);
                ctx.lineTo(metrics.gx + metrics.gw, y);
                ctx.stroke();

                ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
                ctx.textAlign = 'right';
                ctx.fillText(`${db > 0 ? '+' : ''}${db}`, metrics.gx - 10, y + 4);
            }

            // Individual Band Curves (shows Q Factor shape)
            bands.forEach((band, index) => {
                if (Math.abs(band.gain) < 0.05 && index !== selectedBand) return;

                const curve = computeSingleBandResponse(band, FREQS);
                const color = BAND_COLORS[index % BAND_COLORS.length];
                const isSelected = index === selectedBand;

                ctx.strokeStyle = isSelected ? color : `${color}38`;
                ctx.lineWidth = isSelected ? 1.5 : 0.8;
                ctx.setLineDash(isSelected ? [] : [4, 4]);

                ctx.beginPath();
                for (let i = 0; i < NUM_POINTS; i++) {
                    const x = freqToX(FREQS[i], metrics);
                    const y = dbToY(curve[i], metrics);
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            });
            ctx.setLineDash([]); // reset

            // Combined Response Curve
            const combined = computeCombinedResponse(FREQS);

            // Curve Fill
            ctx.beginPath();
            const zeroY = dbToY(0, metrics);
            ctx.moveTo(metrics.gx, zeroY);
            for (let i = 0; i < NUM_POINTS; i++) {
                ctx.lineTo(freqToX(FREQS[i], metrics), dbToY(combined[i], metrics));
            }
            ctx.lineTo(metrics.gx + metrics.gw, zeroY);
            ctx.closePath();

            const grad = ctx.createLinearGradient(0, metrics.gy, 0, metrics.gy + metrics.gh);
            grad.addColorStop(0, 'rgba(16, 185, 129, 0.15)');
            grad.addColorStop(0.5, 'rgba(16, 185, 129, 0.02)');
            grad.addColorStop(1, 'rgba(16, 185, 129, 0.15)');
            ctx.fillStyle = grad;
            ctx.fill();

            // Curve Line
            ctx.strokeStyle = varColor('--accent-green');
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            for (let i = 0; i < NUM_POINTS; i++) {
                const x = freqToX(FREQS[i], metrics);
                const y = dbToY(combined[i], metrics);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();

            // Band Nodes
            bands.forEach((band, index) => {
                const x = freqToX(band.freq, metrics);
                const y = dbToY(band.gain, metrics);
                const color = BAND_COLORS[index % BAND_COLORS.length];
                const isSelected = index === selectedBand;
                const isHover = index === hoverBand;
                const r = 7;

                // Glow for selection
                if (isSelected) {
                    ctx.shadowColor = color;
                    ctx.shadowBlur = 12;
                }

                ctx.beginPath();
                ctx.arc(x, y, r, 0, TWO_PI);
                ctx.fillStyle = isSelected ? color : (isHover ? '#ffffff' : '#8892b0');
                ctx.fill();
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.shadowBlur = 0; // reset shadow

                // Index Label
                ctx.fillStyle = isSelected ? '#ffffff' : 'rgba(255, 255, 255, 0.6)';
                ctx.font = 'bold 9px "Outfit", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(index + 1, x, y - 12);
            });

            // Outer frame border
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            ctx.strokeRect(metrics.gx, metrics.gy, metrics.gw, metrics.gh);

            ctx.restore();
        }

        function varColor(name) {
            return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        }

        // --- Resize canvas handler ---
        function resizeCanvas() {
            const container = canvas.parentElement;
            const rect = container.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;

            canvas.width = Math.round(rect.width * dpr);
            canvas.height = Math.round(rect.height * dpr);
            canvas.style.width = Math.round(rect.width) + 'px';
            canvas.style.height = Math.round(rect.height) + 'px';

            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);

            drawGraph();
        }

        window.addEventListener('resize', resizeCanvas);
        setTimeout(resizeCanvas, 50);

        // --- Interaction Event Listeners ---
        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        function hitTest(x, y) {
            const metrics = getGraphMetrics();
            let closest = -1, minDist = 15;
            bands.forEach((band, index) => {
                const dist = Math.hypot(x - freqToX(band.freq, metrics), y - dbToY(band.gain, metrics));
                if (dist < minDist) {
                    minDist = dist;
                    closest = index;
                }
            });
            return closest;
        }

        canvas.addEventListener('mousedown', (e) => {
            const { x, y } = getMousePos(e);
            const bandIndex = hitTest(x, y);

            if (bandIndex >= 0) {
                selectedBand = bandIndex;
                dragBand = bandIndex;
                isDragging = true;
                canvas.style.cursor = 'grabbing';
                updateSelectedRowHighlight();
            } else {
                selectedBand = -1;
                updateSelectedRowHighlight();
            }
            drawGraph();
        });

        canvas.addEventListener('mousemove', (e) => {
            const { x, y } = getMousePos(e);
            const metrics = getGraphMetrics();

            if (isDragging && dragBand >= 0) {
                const freq = Math.max(FREQ_MIN, Math.min(FREQ_MAX, xToFreq(x, metrics)));
                const gain = Math.max(DB_MIN, Math.min(DB_MAX, yToDb(y, metrics)));

                bands[dragBand].freq = Math.round(freq);
                bands[dragBand].gain = Math.round(gain * 10) / 10;

                syncInputs(dragBand);
                console.log(`[EQ Drag] Band ${dragBand + 1} updated: { type: "${FILTER_TYPES[bands[dragBand].type]}", freq: ${bands[dragBand].freq} Hz, gain: ${bands[dragBand].gain} dB, q: ${bands[dragBand].q} }`);
            } else {
                const b = hitTest(x, y);
                if (b !== hoverBand) {
                    hoverBand = b;
                    canvas.style.cursor = b >= 0 ? 'grab' : 'crosshair';
                }
            }
            drawGraph();
        });

        window.addEventListener('mouseup', () => {
            if (isDragging) {
                const finishedBand = dragBand;
                isDragging = false;
                dragBand = -1;
                canvas.style.cursor = hoverBand >= 0 ? 'grab' : 'crosshair';
                if (finishedBand >= 0 && typeof window.sendEQUpdate === 'function') {
                    window.sendEQUpdate(activeProfileIndex, finishedBand);
                }
            }
        });

        canvas.addEventListener('dblclick', (e) => {
            const { x, y } = getMousePos(e);
            const b = hitTest(x, y);
            if (b >= 0) {
                bands[b].gain = 0.0;
                syncInputs(b);
                console.log(`[EQ DblClick] Band ${b + 1} gain reset: { type: "${FILTER_TYPES[bands[b].type]}", freq: ${bands[b].freq} Hz, gain: 0.0 dB, q: ${bands[b].q} }`);

                if (typeof window.sendEQUpdate === 'function') {
                    window.sendEQUpdate(activeProfileIndex, b);
                }
                drawGraph();
            }
        });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const { x, y } = getMousePos(e);
            const b = selectedBand >= 0 ? selectedBand : hitTest(x, y);
            if (b < 0) return;

            const delta = e.deltaY > 0 ? -0.05 : 0.05;
            bands[b].q = Math.max(0.1, Math.min(10.0, Math.round((bands[b].q + delta) * 100) / 100));
            syncInputs(b);
            console.log(`[EQ Scroll] Band ${b + 1} Q updated: { type: "${FILTER_TYPES[bands[b].type]}", freq: ${bands[b].freq} Hz, gain: ${bands[b].gain} dB, q: ${bands[b].q} }`);

            if (typeof window.sendEQUpdate === 'function') {
                window.sendEQUpdate(activeProfileIndex, b);
            }
            drawGraph();
        }, { passive: false });

        // Touch support
        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                const touch = e.touches[0];
                const pos = getMousePos(touch);
                const b = hitTest(pos.x, pos.y);
                if (b >= 0) {
                    selectedBand = b;
                    dragBand = b;
                    isDragging = true;
                    e.preventDefault();
                    updateSelectedRowHighlight();
                    drawGraph();
                }
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            if (isDragging && e.touches.length > 0) {
                const touch = e.touches[0];
                const pos = getMousePos(touch);
                const metrics = getGraphMetrics();

                const freq = Math.max(FREQ_MIN, Math.min(FREQ_MAX, xToFreq(pos.x, metrics)));
                const gain = Math.max(DB_MIN, Math.min(DB_MAX, yToDb(pos.y, metrics)));

                bands[dragBand].freq = Math.round(freq);
                bands[dragBand].gain = Math.round(gain * 10) / 10;

                syncInputs(dragBand);
                console.log(`[EQ Drag] Band ${dragBand + 1} updated: { type: "${FILTER_TYPES[bands[dragBand].type]}", freq: ${bands[dragBand].freq} Hz, gain: ${bands[dragBand].gain} dB, q: ${bands[dragBand].q} }`);
                e.preventDefault();
                drawGraph();
            }
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            if (isDragging) {
                const finishedBand = dragBand;
                isDragging = false;
                dragBand = -1;
                if (finishedBand >= 0 && typeof window.sendEQUpdate === 'function') {
                    window.sendEQUpdate(activeProfileIndex, finishedBand);
                }
            }
        });

        // --- Build Bands Table Interface ---
        const tableBody = document.getElementById('bandsTableBody');

        // --- Smart Bass & DRC UI Sync ---
        function updateSmartBassDrcUI() {
            const chkSmartBass = document.getElementById('chkSmartBass');
            const sliderSmartBassStr = document.getElementById('sliderSmartBassStr');
            const lblSmartBassStr = document.getElementById('lblSmartBassStr');

            const chkDrc = document.getElementById('chkDrc');
            const sliderDrcSens = document.getElementById('sliderDrcSens');
            const lblDrcSens = document.getElementById('lblDrcSens');

            const prof = profiles[activeProfileIndex];
            
            if (chkSmartBass) chkSmartBass.checked = prof.smartBassEn === 1;
            if (sliderSmartBassStr) {
                sliderSmartBassStr.value = prof.smartBassStr !== undefined ? prof.smartBassStr : 5;
                if (lblSmartBassStr) lblSmartBassStr.textContent = sliderSmartBassStr.value;
            }

            if (chkDrc) chkDrc.checked = prof.drcEn === 1;
            if (sliderDrcSens) {
                sliderDrcSens.value = prof.drcSens !== undefined ? prof.drcSens : 5;
                if (lblDrcSens) lblDrcSens.textContent = sliderDrcSens.value;
            }
        }

        function initSmartSettingsListeners() {
            const chkSmartBass = document.getElementById('chkSmartBass');
            const sliderSmartBassStr = document.getElementById('sliderSmartBassStr');
            const lblSmartBassStr = document.getElementById('lblSmartBassStr');

            const chkDrc = document.getElementById('chkDrc');
            const sliderDrcSens = document.getElementById('sliderDrcSens');
            const lblDrcSens = document.getElementById('lblDrcSens');

            const sendSmartBassSettings = () => {
                const en = chkSmartBass.checked ? 1 : 0;
                const str = parseInt(sliderSmartBassStr.value);
                profiles[activeProfileIndex].smartBassEn = en;
                profiles[activeProfileIndex].smartBassStr = str;
                if (lblSmartBassStr) lblSmartBassStr.textContent = str;
                
                if (window.eqWebSocket && window.eqWebSocket.readyState === WebSocket.OPEN) {
                    window.eqWebSocket.send(`#EQ_SET_SMART_BASS$${activeProfileIndex},${en},${str}`);
                }
            };

            const sendDrcSettings = () => {
                const en = chkDrc.checked ? 1 : 0;
                const sens = parseInt(sliderDrcSens.value);
                profiles[activeProfileIndex].drcEn = en;
                profiles[activeProfileIndex].drcSens = sens;
                if (lblDrcSens) lblDrcSens.textContent = sens;

                if (window.eqWebSocket && window.eqWebSocket.readyState === WebSocket.OPEN) {
                    window.eqWebSocket.send(`#EQ_SET_DRC$${activeProfileIndex},${en},${sens}`);
                }
            };

            if (chkSmartBass) chkSmartBass.addEventListener('change', sendSmartBassSettings);
            if (sliderSmartBassStr) {
                sliderSmartBassStr.addEventListener('input', () => {
                    if (lblSmartBassStr) lblSmartBassStr.textContent = sliderSmartBassStr.value;
                });
                sliderSmartBassStr.addEventListener('change', sendSmartBassSettings);
            }

            if (chkDrc) chkDrc.addEventListener('change', sendDrcSettings);
            if (sliderDrcSens) {
                sliderDrcSens.addEventListener('input', () => {
                    if (lblDrcSens) lblDrcSens.textContent = sliderDrcSens.value;
                });
                sliderDrcSens.addEventListener('change', sendDrcSettings);
            }
        }

        function buildTable() {
            tableBody.innerHTML = '';
            bands.forEach((band, index) => {
                const color = BAND_COLORS[index % BAND_COLORS.length];
                const tr = document.createElement('tr');
                tr.className = 'band-row';
                tr.id = `band-row-${index}`;
                tr.innerHTML = `
                    <td>
                        <span class="band-color-dot" style="color: ${color}; background-color: ${color}"></span>
                        <strong>${index + 1}</strong>
                    </td>
                    <td>
                        <select id="select-type-${index}">
                            <option value="0" ${band.type === 0 ? 'selected' : ''}>Peak</option>
                            <option value="1" ${band.type === 1 ? 'selected' : ''}>LF (Low Shelf)</option>
                            <option value="2" ${band.type === 2 ? 'selected' : ''}>HF (High Shelf)</option>
                            <option value="3" ${band.type === 3 ? 'selected' : ''}>LP (Low Pass)</option>
                            <option value="4" ${band.type === 4 ? 'selected' : ''}>HP (High Pass)</option>
                            <option value="5" ${band.type === 5 ? 'selected' : ''}>BP (Band Pass)</option>
                            <option value="6" ${band.type === 6 ? 'selected' : ''}>Notch</option>
                        </select>
                    </td>
                    <td>
                        <input type="number" id="input-freq-${index}" value="${band.freq}" min="20" max="20000" step="1">
                    </td>
                    <td>
                        <input type="number" id="input-gain-${index}" value="${band.gain}" min="-24" max="24" step="0.1">
                    </td>
                    <td>
                        <input type="number" id="input-q-${index}" value="${band.q}" min="0.1" max="10" step="0.01">
                    </td>
                `;

                // Select band on row click
                tr.addEventListener('click', (e) => {
                    if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT') {
                        selectedBand = index;
                        updateSelectedRowHighlight();
                        drawGraph();
                    }
                });

                // Attach manual input listener
                tr.querySelectorAll('input').forEach(input => {
                    input.addEventListener('input', (e) => {
                        const field = e.target.id.split('-')[1]; // freq, gain, or q
                        let val = parseFloat(e.target.value);
                        if (isNaN(val)) return;

                        if (field === 'freq') {
                            val = Math.max(FREQ_MIN, Math.min(FREQ_MAX, val));
                            bands[index].freq = Math.round(val);
                        } else if (field === 'gain') {
                            val = Math.max(DB_MIN, Math.min(DB_MAX, val));
                            bands[index].gain = Math.round(val * 10) / 10;
                        } else if (field === 'q') {
                            val = Math.max(0.1, Math.min(10, val));
                            bands[index].q = val;
                        }

                        console.log(`[EQ Input] Band ${index + 1} manually set: { type: "${FILTER_TYPES[bands[index].type]}", freq: ${bands[index].freq} Hz, gain: ${bands[index].gain} dB, q: ${bands[index].q} }`);

                        if (typeof window.sendEQUpdate === 'function') {
                            window.sendEQUpdate(activeProfileIndex, index);
                        }
                        drawGraph();
                    });
                });

                const typeSelect = tr.querySelector(`#select-type-${index}`);
                typeSelect.addEventListener('change', (e) => {
                    const val = parseInt(e.target.value);
                    bands[index].type = val;
                    console.log(`[EQ Type] Band ${index + 1} type updated: { type: "${FILTER_TYPES[val]}", freq: ${bands[index].freq} Hz, gain: ${bands[index].gain} dB, q: ${bands[index].q} }`);

                    if (typeof window.sendEQUpdate === 'function') {
                        window.sendEQUpdate(activeProfileIndex, index);
                    }
                    drawGraph();
                });

                tableBody.appendChild(tr);
            });
        }

        function syncInputs(index) {
            const freqInput = document.getElementById(`input-freq-${index}`);
            const gainInput = document.getElementById(`input-gain-${index}`);
            const qInput = document.getElementById(`input-q-${index}`);
            const typeSelect = document.getElementById(`select-type-${index}`);

            if (freqInput) freqInput.value = bands[index].freq;
            if (gainInput) gainInput.value = bands[index].gain;
            if (qInput) qInput.value = bands[index].q;
            if (typeSelect) typeSelect.value = bands[index].type;
        }

        function updateSelectedRowHighlight() {
            document.querySelectorAll('.band-row').forEach((row, index) => {
                row.classList.toggle('selected', index === selectedBand);
            });
        }

        // Initialize Table
        buildTable();

        // --- Profile Tabs Interaction ---
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const idx = parseInt(btn.getAttribute('data-index'));
                if (idx === activeProfileIndex) return;

                // Update active tab UI
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                // Switch active profile
                activeProfileIndex = idx;
                bands = profiles[activeProfileIndex].bands;

                // Gửi lệnh chọn active profile lên ESP32
                if (window.eqWebSocket && window.eqWebSocket.readyState === WebSocket.OPEN) {
                    window.eqWebSocket.send(`#EQ_SELECT_PROFILE$${activeProfileIndex}`);
                }

                // Cập nhật Smart Bass & DRC UI của Profile mới
                updateSmartBassDrcUI();

                // Cập nhật preamp slider
                const preampInput = document.getElementById('inputPreamp');
                const preampValText = document.getElementById('preampVal');
                if (preampInput && preampValText) {
                    const pa = profiles[activeProfileIndex].preamp !== undefined ? profiles[activeProfileIndex].preamp : -6.0;
                    preampInput.value = pa;
                    preampValText.textContent = pa > 0 ? `+${pa.toFixed(1)}` : pa.toFixed(1);
                }

                // Reset selection
                selectedBand = -1;

                // Rebuild & redraw
                buildTable();
                updateSelectedRowHighlight();
                drawGraph();

                console.log(`[EQ Profile] Switched to ${profiles[activeProfileIndex].name}`);
            });
        });

        // --- Preset Selector Logic ---
        const selectBrand = document.getElementById('selectBrand');
        const selectModel = document.getElementById('selectModel');
        const btnSetPreset = document.getElementById('btnSetPreset');

        function initPresetDropdowns() {
            // Đổ danh sách Brand (sắp xếp theo alphabet)
            const brands = Object.keys(EQ_PRESETS_DATA).sort();
            brands.forEach(brand => {
                const opt = document.createElement('option');
                opt.value = brand;
                opt.textContent = brand;
                selectBrand.appendChild(opt);
            });

            // Lắng nghe sự thay đổi của Brand
            selectBrand.addEventListener('change', () => {
                const brand = selectBrand.value;
                selectModel.innerHTML = '<option value="">-- Model --</option>';
                
                if (brand && EQ_PRESETS_DATA[brand]) {
                    selectModel.disabled = false;
                    EQ_PRESETS_DATA[brand].forEach((model, idx) => {
                        const opt = document.createElement('option');
                        opt.value = idx;
                        opt.textContent = model;
                        selectModel.appendChild(opt);
                    });
                } else {
                    selectModel.disabled = true;
                }
                updateSetButtonState();
            });

            // Lắng nghe sự thay đổi của Model
            selectModel.addEventListener('change', updateSetButtonState);
            
            // Xử lý nút Set
            btnSetPreset.addEventListener('click', () => {
                const brand = selectBrand.value;
                const modelIdx = selectModel.value;
                if (!brand || modelIdx === "") return;

                // Index Brand trong thứ tự khai báo của C++ chính là thứ tự key gốc của EQ_PRESETS_DATA
                const brandIndex = Object.keys(EQ_PRESETS_DATA).indexOf(brand);
                if (brandIndex === -1) {
                    console.error("Brand not found in presets mapping:", brand);
                    return;
                }

                console.log(`[EQ Preset Apply] Applying preset: ${brand} (idx=${brandIndex}), ${EQ_PRESETS_DATA[brand][modelIdx]} (idx=${modelIdx}) to Profile ${activeProfileIndex + 1}`);

                if (window.eqWebSocket && window.eqWebSocket.readyState === WebSocket.OPEN) {
                    // Tạo overlay chờ tạm thời
                    const overlay = document.createElement('div');
                    overlay.id = "eqPresetOverlay";
                    overlay.style = "position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);z-index:9999;display:flex;justify-content:center;align-items:center;color:#fff;font-family:sans-serif;font-size:16px;backdrop-filter:blur(1px);";
                    overlay.innerHTML = '<div style="background:#1e293b;padding:16px 28px;border-radius:10px;border:1px solid #334155;text-align:center;">Applying Preset...</div>';
                    document.body.appendChild(overlay);

                    // Gửi bản tin: #EQ_APPLY_PRESET$<profile_idx>,<brand_idx>,<model_idx>
                    window.eqWebSocket.send(`#EQ_APPLY_PRESET$${activeProfileIndex},${brandIndex},${modelIdx}`);

                    // Timeout tự xóa overlay sau 2 giây nếu không nhận được phản hồi
                    setTimeout(() => {
                        const ov = document.getElementById('eqPresetOverlay');
                        if (ov) ov.remove();
                    }, 2000);
                }
            });
        }

        function updateSetButtonState() {
            btnSetPreset.disabled = !(selectBrand.value && selectModel.value !== "");
        }

        // Khởi tạo các Dropdowns
        initPresetDropdowns();
        initSmartSettingsListeners();
        updateSmartBassDrcUI();

                // --- Preamp Slider Interaction ---
        const preampInput = document.getElementById('inputPreamp');
        const preampValText = document.getElementById('preampVal');

        if (preampInput && preampValText) {
            // Cập nhật giá trị hiển thị mượt mà khi đang kéo
            preampInput.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                profiles[activeProfileIndex].preamp = val;
                preampValText.textContent = val > 0 ? `+${val.toFixed(1)}` : val.toFixed(1);
            });

            // Chỉ gửi lên ESP32 và lưu NVS khi thả tay ra (change event)
            preampInput.addEventListener('change', (e) => {
                if (typeof window.sendEQUpdate === 'function') {
                    window.sendEQUpdate(activeProfileIndex, 0);
                }
                console.log(`[EQ Preamp Change] Final preamp value set to: ${profiles[activeProfileIndex].preamp} dB`);
            });
        }

        // --- WebSocket Sync ---
        let lastSendTime = 0;
        window.throttleSendEQ = function (profileIdx, filterIdx) {
            const now = Date.now();
            if (now - lastSendTime > 50) { // 50ms throttle
                window.sendEQUpdate(profileIdx, filterIdx);
                lastSendTime = now;
            }
        };

        window.sendEQUpdate = function (profileIdx, filterIdx) {
            if (window.eqWebSocket && window.eqWebSocket.readyState === WebSocket.OPEN) {
                const prof = profiles[profileIdx];
                const filter = prof.bands[filterIdx];
                if (!filter) return;
                // Format: #EQ_SET$profile_idx,preamp,filter_idx,type,fc,q,gain
                const preampVal = prof.preamp !== undefined ? prof.preamp : -6.0;
                const msg = `#EQ_SET$${profileIdx},${preampVal.toFixed(1)},${filterIdx},${filter.type},${filter.freq.toFixed(1)},${filter.q.toFixed(2)},${filter.gain.toFixed(1)}`;
                window.eqWebSocket.send(msg);
            }
        };

        function initEQSync() {
            // Lấy phần tử overlay tĩnh đã vẽ sẵn
            const overlay = document.getElementById('eqSyncOverlay');

            // 2. Kết nối WebSocket
            const wsUrl = `ws://${window.location.host}/ws`;
            console.log(`[EQ Sync] Connecting to WebSocket: ${wsUrl}`);
            const ws = new WebSocket(wsUrl);
            window.eqWebSocket = ws;

            ws.onopen = () => {
                console.log('[EQ Sync] WebSocket connected. Requesting profiles...');
                ws.send('#EQ_GET$');
            };

            ws.onmessage = (event) => {
                if (event.data.startsWith('EQ_PROFILES:')) {
                    console.log('[EQ Sync] Received profiles data from ESP32');
                    const dataStr = event.data.substring(12);
                    if (!dataStr) {
                        overlay.remove();
                        return;
                    }
                    const vals = dataStr.split(',').map(Number);
                    if (vals.length < 123) {
                        console.error('[EQ Sync] Invalid profiles data length:', vals.length);
                        overlay.remove();
                        return;
                    }

                    let idx = 0;
                    for (let p = 0; p < 3; p++) {
                        profiles[p].preamp = vals[idx++];
                        for (let f = 0; f < 10; f++) {
                            profiles[p].bands[f].type = vals[idx++];
                            profiles[p].bands[f].freq = vals[idx++];
                            profiles[p].bands[f].q = vals[idx++];
                            profiles[p].bands[f].gain = vals[idx++];
                        }
                    }

                    // Đồng bộ biến bands toàn cục với profile đang kích hoạt
                    bands = profiles[activeProfileIndex].bands;

                    // Cập nhật hiển thị preamp cho profile đang kích hoạt
                    const preampInput = document.getElementById('inputPreamp');
                    const preampValText = document.getElementById('preampVal');
                    if (preampInput && preampValText) {
                        const pa = profiles[activeProfileIndex].preamp !== undefined ? profiles[activeProfileIndex].preamp : -6.0;
                        preampInput.value = pa;
                        preampValText.textContent = pa > 0 ? `+${pa.toFixed(1)}` : pa.toFixed(1);
                    }

                    // Vẽ lại đồ thị & bảng thông số
                    buildTable();
                    updateSelectedRowHighlight();
                    drawGraph();

                    // Xóa preset loading overlay nếu có
                    const presetOverlay = document.getElementById('eqPresetOverlay');
                    if (presetOverlay) presetOverlay.remove();

                    // Ẩn/Xóa overlay nạp cấu hình ban đầu
                    if (document.getElementById('eqSyncOverlay')) {
                        const initOverlay = document.getElementById('eqSyncOverlay');
                        initOverlay.style.opacity = '0';
                        setTimeout(() => initOverlay.remove(), 300);
                    }
                }
                
                if (event.data.startsWith('EQ_SMART_SETTINGS:')) {
                    console.log('[EQ Sync] Received Smart Bass & DRC settings');
                    const dataStr = event.data.substring(18);
                    const vals = dataStr.split(',').map(Number);
                    if (vals.length === 12) {
                        let idx = 0;
                        for (let p = 0; p < 3; p++) {
                            profiles[p].smartBassEn = vals[idx++];
                            profiles[p].smartBassStr = vals[idx++];
                            profiles[p].drcEn = vals[idx++];
                            profiles[p].drcSens = vals[idx++];
                        }
                        updateSmartBassDrcUI();
                    }
                }
            };

            ws.onerror = (err) => {
                console.error('[EQ Sync] WebSocket error:', err);
            };

            ws.onclose = () => {
                console.warn('[EQ Sync] WebSocket connection closed.');
                // Tự động đóng overlay để không khóa màn hình nếu mất kết nối
                if (document.getElementById('eqSyncOverlay')) {
                    document.getElementById('eqSyncOverlay').remove();
                }
            };
        }

        // Khởi động đồng bộ hóa
        initEQSync();
    </script>
</body>

</html>
